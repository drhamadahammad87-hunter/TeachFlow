<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الحضور - TeachFlow</title>
    <!-- ===== EmailJS (مجاني) ===== -->
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js">
    </script>
    <style>
        /* نفس الاستايلات السابقة مع إضافة بسيطة للإشعارات */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, sans-serif;
        }

        body {
            background: #f0f2f5;
            min-height: 100vh;
        }

        .sidebar {
            position: fixed;
            right: 0;
            top: 0;
            width: 220px;
            height: 100vh;
            background: white;
            padding: 20px 15px;
            box-shadow: -2px 0 10px rgba(0, 0, 0, 0.05);
            overflow-y: auto;
            z-index: 100;
        }

        .logo {
            font-size: 22px;
            font-weight: 700;
            color: #667eea;
            text-align: center;
            padding-bottom: 20px;
            border-bottom: 1px solid #eee;
            margin-bottom: 15px;
        }

        .logo span {
            display: block;
            font-size: 12px;
            color: #999;
            font-weight: 400;
        }

        .sidebar-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 12px;
            border-radius: 10px;
            color: #555;
            cursor: pointer;
            transition: 0.3s;
            border: none;
            background: none;
            width: 100%;
            text-align: right;
            font-size: 14px;
        }

        .sidebar-item:hover {
            background: #f0f4ff;
            color: #667eea;
        }

        .sidebar-item.active {
            background: #667eea;
            color: white;
        }

        .main-content {
            margin-right: 220px;
            padding: 25px;
            width: 100%;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .page-header h1 {
            font-size: 26px;
            color: #333;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .page-header .actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn-back {
            padding: 10px 20px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-back:hover {
            background: #5a6fd6;
            transform: scale(1.02);
        }

        .btn-save {
            padding: 10px 20px;
            background: #2ecc71;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-save:hover {
            background: #27ae60;
            transform: scale(1.02);
        }

        /* ===== فلتر اليوم ===== */
        .filter-bar {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            align-items: center;
            background: white;
            padding: 16px 20px;
            border-radius: 16px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }

        .filter-bar label {
            font-weight: 500;
            color: #444;
            font-size: 14px;
        }

        .filter-bar input[type="date"] {
            padding: 8px 14px;
            border: 2px solid #e8edf2;
            border-radius: 10px;
            font-size: 14px;
            background: #f8fafc;
            transition: 0.3s;
        }

        .filter-bar input[type="date"]:focus {
            outline: none;
            border-color: #667eea;
            background: white;
        }

        .filter-bar select {
            padding: 8px 14px;
            border: 2px solid #e8edf2;
            border-radius: 10px;
            font-size: 14px;
            background: #f8fafc;
            transition: 0.3s;
            min-width: 140px;
        }

        .filter-bar select:focus {
            outline: none;
            border-color: #667eea;
            background: white;
        }

        .filter-bar .summary {
            margin-right: auto;
            font-size: 14px;
            color: #666;
        }

        .filter-bar .summary strong {
            color: #333;
        }

        /* ===== جدول الحضور ===== */
        .table-container {
            background: white;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
            flex: 1;
            overflow-x: auto;
        }

        .attendance-table {
            width: 100%;
            border-collapse: collapse;
            min-width: 600px;
        }

        .attendance-table th {
            background: #f8fafc;
            padding: 14px 16px;
            text-align: right;
            font-weight: 600;
            color: #555;
            font-size: 14px;
            border-bottom: 2px solid #e8edf2;
            white-space: nowrap;
        }

        .attendance-table td {
            padding: 12px 16px;
            border-bottom: 1px solid #f0f2f5;
            color: #333;
            font-size: 14px;
            vertical-align: middle;
        }

        .attendance-table tr:hover td {
            background: #f8fafc;
        }

        .attendance-table .status-badge {
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 500;
            border: none;
            cursor: pointer;
            transition: 0.3s;
        }

        .status-present {
            background: #eafaf1;
            color: #27ae60;
        }
        .status-present:hover {
            background: #d5f5e3;
        }
        .status-absent {
            background: #fdedec;
            color: #e74c3c;
        }
        .status-absent:hover {
            background: #fadbd8;
        }
        .status-late {
            background: #fef9e7;
            color: #f39c12;
        }
        .status-late:hover {
            background: #fdebd0;
        }
        .status-excused {
            background: #ebf5fb;
            color: #3498db;
        }
        .status-excused:hover {
            background: #d6eaf8;
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: #999;
        }

        .empty-state .big-icon {
            font-size: 48px;
            display: block;
            margin-bottom: 10px;
        }

        .footer {
            text-align: center;
            margin-top: 30px;
            padding: 15px;
            color: #aaa;
            font-size: 13px;
            border-top: 1px solid #e8edf2;
            direction: ltr;
        }

        .footer .name {
            color: #667eea;
            font-weight: 600;
        }

        /* ===== زر الإشعارات ===== */
        .notif-badge {
            position: relative;
            display: inline-block;
        }

        .notif-badge .badge {
            position: absolute;
            top: -8px;
            right: -8px;
            background: #e74c3c;
            color: white;
            border-radius: 50%;
            padding: 2px 8px;
            font-size: 11px;
            font-weight: 600;
        }

        @media (max-width: 768px) {
            .sidebar {
                width: 60px;
                padding: 15px 8px;
            }
            .sidebar-item span:not(.icon) {
                display: none;
            }
            .sidebar-item {
                justify-content: center;
                padding: 12px;
            }
            .logo {
                font-size: 16px;
            }
            .logo span {
                display: none;
            }
            .main-content {
                margin-right: 60px;
                padding: 15px;
            }
            .page-header h1 {
                font-size: 20px;
            }
            .filter-bar {
                flex-direction: column;
                align-items: stretch;
            }
            .filter-bar .summary {
                margin-right: 0;
            }
        }

        @media (max-width: 480px) {
            .attendance-table {
                font-size: 12px;
                min-width: 500px;
            }
            .attendance-table th,
            .attendance-table td {
                padding: 8px 10px;
            }
        }
    </style>
</head>
<body>

    <nav class="sidebar">
        <div class="logo">📚 TeachFlow <span>نظام إدارة المعلمين</span></div>
        <button class="sidebar-item" onclick="window.location.href='home.html'">🏠 <span>الرئيسية</span></button>
        <button class="sidebar-item" onclick="window.location.href='students.html'">👨‍🎓 <span>الطلاب</span></button>
        <button class="sidebar-item" onclick="window.location.href='groups.html'">👥 <span>المجموعات</span></button>
        <button class="sidebar-item" onclick="window.location.href='home.html'">📚 <span>الدروس</span></button>
        <button class="sidebar-item" onclick="window.location.href='home.html'">📅 <span>الجدول</span></button>
        <button class="sidebar-item active" onclick="window.location.href='attendance.html'">✅ <span>الحضور</span></button>
        <button class="sidebar-item" onclick="window.location.href='home.html'">📊 <span>التقييمات</span></button>
        <button class="sidebar-item" onclick="window.location.href='home.html'">💰 <span>الحسابات</span></button>
        <button class="sidebar-item" onclick="window.location.href='home.html'">📈 <span>التقارير</span></button>
        <button class="sidebar-item" onclick="window.location.href='notifications.html'">
            🔔 <span>التنبيهات</span>
            <span class="notif-badge">
                <span class="badge" id="notifCount">0</span>
            </span>
        </button>
        <button class="sidebar-item" onclick="window.location.href='home.html'">⚙️ <span>الإعدادات</span></button>
        <button class="sidebar-item" onclick="logout()">🚪 <span>تسجيل الخروج</span></button>
    </nav>

    <main class="main-content">

        <div class="page-header">
            <h1>✅ الحضور</h1>
            <div class="actions">
                <button class="btn-back" onclick="window.location.href='home.html'">🔙 رجوع</button>
                <button class="btn-save" onclick="saveAttendance()">💾 حفظ الحضور وإرسال الإشعارات</button>
            </div>
        </div>

        <!-- ===== فلتر ===== -->
        <div class="filter-bar">
            <label>📅 التاريخ:</label>
            <input type="date" id="attendanceDate" onchange="loadAttendance()">

            <label>📚 المجموعة:</label>
            <select id="groupFilter" onchange="loadAttendance()">
                <option value="all">كل المجموعات</option>
            </select>

            <div class="summary">
                👥 <strong id="totalStudents">0</strong> طالب |
                ✅ <strong id="presentCount">0</strong> حاضر |
                ❌ <strong id="absentCount">0</strong> غائب |
                ⏰ <strong id="lateCount">0</strong> متأخر |
                📝 <strong id="excusedCount">0</strong> معذور
            </div>
        </div>

        <!-- ===== جدول الحضور ===== -->
        <div class="table-container">
            <table class="attendance-table">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>👤 اسم الطالب</th>
                        <th>📚 المجموعة</th>
                        <th>✅ الحالة</th>
                        <th>📝 ملاحظات</th>
                    </tr>
                </thead>
                <tbody id="attendanceBody">
                    <!-- هتتعبأ من JavaScript -->
                </tbody>
            </table>
        </div>

        <div class="footer">
            Designed with ❤️ by <span class="name">Dr. Hamada Fathy Hammad</span>
        </div>
    </main>

    <script>
        // ===== تهيئة EmailJS (مجاني) =====
        // سجل في https://www.emailjs.com/ عشان تاخد البيانات دي
        const EMAILJS_CONFIG = {
            publicKey: 'YOUR_PUBLIC_KEY', // حط الـ Public Key بتاعك
            serviceID: 'YOUR_SERVICE_ID', // حط الـ Service ID بتاعك
            templateID: 'YOUR_TEMPLATE_ID' // حط الـ Template ID بتاعك
        };

        // ===== بيانات الحضور =====
        let attendanceData = [];
        let currentStudents = [];
        let currentDate = '';

        // ===== تحميل البيانات =====
        function loadAttendance() {
            const date = document.getElementById('attendanceDate').value;
            if (!date) {
                const today = new Date().toISOString().split('T')[0];
                document.getElementById('attendanceDate').value = today;
                currentDate = today;
            } else {
                currentDate = date;
            }

            loadGroupsFilter();
            loadStudents();
            renderAttendance();
            updateSummary();
            updateNotificationBadge();
        }

        // ===== تحميل المجموعات في الفلتر =====
        function loadGroupsFilter() {
            const groups = JSON.parse(localStorage.getItem('teachflow_groups')) || [];
            const select = document.getElementById('groupFilter');
            select.innerHTML = '<option value="all">كل المجموعات</option>';
            groups.forEach(g => {
                const option = document.createElement('option');
                option.value = g.name;
                option.textContent = g.name;
                select.appendChild(option);
            });
        }

        // ===== تحميل الطلاب =====
        function loadStudents() {
            const students = JSON.parse(localStorage.getItem('teachflow_students')) || [];
            const groupFilter = document.getElementById('groupFilter').value;

            if (groupFilter === 'all') {
                currentStudents = students.filter(s => s.active);
            } else {
                currentStudents = students.filter(s => s.group === groupFilter && s.active);
            }

            // تحميل بيانات الحضور لهذا التاريخ
            const saved = localStorage.getItem('teachflow_attendance');
            if (saved) {
                const allAttendance = JSON.parse(saved);
                attendanceData = allAttendance.filter(a => a.date === currentDate);
            } else {
                attendanceData = [];
            }
        }

        // ===== عرض جدول الحضور =====
        function renderAttendance() {
            const tbody = document.getElementById('attendanceBody');

            if (currentStudents.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="5">
                            <div class="empty-state">
                                <span class="big-icon">✅</span>
                                <p>لا يوجد طلاب في هذه المجموعة</p>
                            </div>
                        </td>
                    </tr>
                `;
                return;
            }

            tbody.innerHTML = currentStudents.map((student, index) => {
                const record = attendanceData.find(a => a.studentId === student.id);
                const status = record ? record.status : 'present';
                const note = record ? record.note || '' : '';

                return `
                    <tr>
                        <td>${index + 1}</td>
                        <td><strong>${student.name}</strong></td>
                        <td>${student.group}</td>
                        <td>
                            <select class="status-badge status-${status}" 
                                    onchange="updateStatus(${student.id}, this.value)"
                                    style="padding:6px 14px;border-radius:20px;border:2px solid #e8edf2;font-size:13px;font-weight:500;cursor:pointer;background:${getStatusColor(status)};color:${getStatusTextColor(status)};">
                                <option value="present" ${status === 'present' ? 'selected' : ''}>✅ حاضر</option>
                                <option value="absent" ${status === 'absent' ? 'selected' : ''}>❌ غائب</option>
                                <option value="late" ${status === 'late' ? 'selected' : ''}>⏰ متأخر</option>
                                <option value="excused" ${status === 'excused' ? 'selected' : ''}>📝 معذور</option>
                            </select>
                        </td>
                        <td>
                            <input type="text" 
                                   placeholder="ملاحظات..." 
                                   value="${note}"
                                   onchange="updateNote(${student.id}, this.value)"
                                   style="width:100%;padding:6px 10px;border:2px solid #e8edf2;border-radius:8px;font-size:13px;background:#f8fafc;transition:0.3s;">
                        </td>
                    </tr>
                `;
            }).join('');
        }

        // ===== ألوان الحالة =====
        function getStatusColor(status) {
            const colors = {
                'present': '#eafaf1',
                'absent': '#fdedec',
                'late': '#fef9e7',
                'excused': '#ebf5fb'
            };
            return colors[status] || '#f8fafc';
        }

        function getStatusTextColor(status) {
            const colors = {
                'present': '#27ae60',
                'absent': '#e74c3c',
                'late': '#f39c12',
                'excused': '#3498db'
            };
            return colors[status] || '#333';
        }

        function getStatusText(status) {
            const map = {
                'present': '✅ حاضر',
                'absent': '❌ غائب',
                'late': '⏰ متأخر',
                'excused': '📝 معذور'
            };
            return map[status] || status;
        }

        // ===== تحديث حالة الطالب =====
        function updateStatus(studentId, status) {
            const existing = attendanceData.find(a => a.studentId === studentId && a.date === currentDate);
            if (existing) {
                existing.status = status;
            } else {
                attendanceData.push({
                    studentId: studentId,
                    date: currentDate,
                    status: status,
                    note: ''
                });
            }
            updateSummary();
        }

        // ===== تحديث ملاحظات الطالب =====
        function updateNote(studentId, note) {
            const existing = attendanceData.find(a => a.studentId === studentId && a.date === currentDate);
            if (existing) {
                existing.note = note;
            } else {
                attendanceData.push({
                    studentId: studentId,
                    date: currentDate,
                    status: 'present',
                    note: note
                });
            }
        }

        // ===== تحديث الإحصائيات =====
        function updateSummary() {
            const total = currentStudents.length;
            let present = 0,
                absent = 0,
                late = 0,
                excused = 0;

            currentStudents.forEach(student => {
                const record = attendanceData.find(a => a.studentId === student.id);
                if (record) {
                    switch (record.status) {
                        case 'present':
                            present++;
                            break;
                        case 'absent':
                            absent++;
                            break;
                        case 'late':
                            late++;
                            break;
                        case 'excused':
                            excused++;
                            break;
                    }
                } else {
                    present++;
                }
            });

            document.getElementById('totalStudents').textContent = total;
            document.getElementById('presentCount').textContent = present;
            document.getElementById('absentCount').textContent = absent;
            document.getElementById('lateCount').textContent = late;
            document.getElementById('excusedCount').textContent = excused;
        }

        // ===== إرسال إشعار داخل التطبيق =====
        function sendInAppNotification(studentName, status, date) {
            const notifications = JSON.parse(localStorage.getItem('teachflow_notifications')) || [];

            notifications.push({
                id: Date.now(),
                studentName: studentName,
                status: status,
                statusText: getStatusText(status),
                date: date || currentDate,
                read: false,
                timestamp: new Date().toISOString()
            });

            localStorage.setItem('teachflow_notifications', JSON.stringify(notifications));
            updateNotificationBadge();
        }

        // ===== إرسال إشعار إيميل (مجاني عبر EmailJS) =====
        function sendEmailNotification(student, status, date) {
            // لو معندكش بريد ولي الأمر، نتخطى
            if (!student.parentEmail) return;

            // تأكد من تهيئة EmailJS
            if (EMAILJS_CONFIG.publicKey === 'YOUR_PUBLIC_KEY') {
                console.log('⚠️ يرجى تهيئة EmailJS أولاً');
                return;
            }

            const templateParams = {
                to_email: student.parentEmail,
                student_name: student.name,
                status: getStatusText(status),
                date: date || currentDate,
                group: student.group,
                note: attendanceData.find(a => a.studentId === student.id)?.note || ''
            };

            emailjs.send(
                EMAILJS_CONFIG.serviceID,
                EMAILJS_CONFIG.templateID,
                templateParams,
                EMAILJS_CONFIG.publicKey
            ).then(() => {
                console.log(`✅ تم إرسال إيميل لولي أمر ${student.name}`);
            }).catch((error) => {
                console.error('❌ فشل إرسال الإيميل:', error);
            });
        }

        // ===== حفظ الحضور وإرسال الإشعارات =====
        function saveAttendance() {
            // جلب جميع بيانات الحضور المحفوظة
            const saved = localStorage.getItem('teachflow_attendance');
            let allAttendance = saved ? JSON.parse(saved) : [];

            // حذف البيانات القديمة لنفس التاريخ
            allAttendance = allAttendance.filter(a => a.date !== currentDate);

            // إضافة البيانات الجديدة
            allAttendance = allAttendance.concat(attendanceData);

            localStorage.setItem('teachflow_attendance', JSON.stringify(allAttendance));

            // جلب بيانات الطلاب
            const students = JSON.parse(localStorage.getItem('teachflow_students')) || [];

            // ===== إرسال الإشعارات =====
            let notificationsSent = 0;
            let emailsSent = 0;

            attendanceData.forEach(record => {
                const student = students.find(s => s.id === record.studentId);
                if (student) {
                    // 1. إشعار داخل التطبيق
                    sendInAppNotification(student.name, record.status, record.date);
                    notificationsSent++;

                    // 2. إشعار إيميل (لو عندك بريد ولي الأمر)
                    if (student.parentEmail) {
                        sendEmailNotification(student, record.status, record.date);
                        emailsSent++;
                    }
                }
            });

            // تحديث إحصائيات الصفحة الرئيسية
            updateHomeStats();

            alert(`✅ تم حفظ الحضور بنجاح!\n📨 تم إرسال ${notificationsSent} إشعار داخل التطبيق\n📧 تم إرسال ${emailsSent} إيميل`);
        }

        // ===== تحديث إحصائيات الصفحة الرئيسية =====
        function updateHomeStats() {
            const today = new Date().toISOString().split('T')[0];
            const allAttendance = JSON.parse(localStorage.getItem('teachflow_attendance')) || [];
            const todayAttendance = allAttendance.filter(a => a.date === today);
            const presentToday = todayAttendance.filter(a => a.status === 'present' || a.status === 'late').length;
            localStorage.setItem('teachflow_today_attendance', presentToday);
        }

        // ===== تحديث عدد الإشعارات =====
        function updateNotificationBadge() {
            const notifications = JSON.parse(localStorage.getItem('teachflow_notifications')) || [];
            const unread = notifications.filter(n => !n.read).length;
            const badge = document.getElementById('notifCount');
            if (badge) {
                badge.textContent = unread;
                badge.style.display = unread > 0 ? 'inline' : 'none';
            }
        }

        // ===== تهيئة EmailJS =====
        function initEmailJS() {
            if (EMAILJS_CONFIG.publicKey !== 'YOUR_PUBLIC_KEY') {
                emailjs.init(EMAILJS_CONFIG.publicKey);
                console.log('✅ EmailJS initialized');
            }
        }

        // ===== تسجيل الخروج =====
        function logout() {
            if (confirm('هل أنت متأكد من تسجيل الخروج؟')) {
                localStorage.removeItem('teachflow_teacher');
                localStorage.removeItem('teachflow_user');
                window.location.href = 'index.html';
            }
        }

        // ===== تحميل الصفحة =====
        document.addEventListener('DOMContentLoaded', function() {
            const teacher = localStorage.getItem('teachflow_teacher');
            if (!teacher) {
                window.location.href = 'index.html';
                return;
            }

            // تهيئة EmailJS
            initEmailJS();

            // تعيين تاريخ اليوم كافتراضي
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('attendanceDate').value = today;

            loadAttendance();
        });
    </script>
</body>
</html>
