<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المجموعات - TeachFlow</title>
    <!-- ===== Firebase SDK ===== -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js">
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, sans-serif;
        }

        body {
            background: #f0f2f5;
            min-height: 100vh;
        }

        /* ===== Hamburger ===== */
        .hamburger {
            display: none;
            position: fixed;
            top: 15px;
            right: 15px;
            z-index: 999;
            background: #667eea;
            color: white;
            border: none;
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 24px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
        }

        .sidebar-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.4);
            z-index: 99;
        }

        .sidebar-overlay.active {
            display: block;
        }

        /* ===== Sidebar ===== */
        .sidebar {
            position: fixed;
            right: 0;
            top: 0;
            width: 220px;
            height: 100vh;
            background: white;
            padding: 20px 15px;
            box-shadow: -2px 0 10px rgba(0, 0, 0, 0.05);
            overflow-y: auto;
            z-index: 100;
            transition: transform 0.3s ease;
        }

        .sidebar .close-btn {
            display: none;
            background: none;
            border: none;
            font-size: 28px;
            color: #555;
            cursor: pointer;
            float: left;
            margin-bottom: 10px;
        }

        .logo {
            font-size: 22px;
            font-weight: 700;
            color: #667eea;
            text-align: center;
            padding-bottom: 20px;
            border-bottom: 1px solid #eee;
            margin-bottom: 15px;
        }

        .logo span {
            display: block;
            font-size: 12px;
            color: #999;
            font-weight: 400;
        }

        .sidebar-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 12px;
            border-radius: 10px;
            color: #555;
            cursor: pointer;
            transition: 0.3s;
            border: none;
            background: none;
            width: 100%;
            text-align: right;
            font-size: 14px;
        }

        .sidebar-item:hover {
            background: #f0f4ff;
            color: #667eea;
        }

        .sidebar-item.active {
            background: #667eea;
            color: white;
        }

        /* ===== Main ===== */
        .main-content {
            margin-right: 220px;
            padding: 25px;
            width: 100%;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .page-header h1 {
            font-size: 26px;
            color: #333;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .page-header .actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn-add {
            padding: 10px 20px;
            background: #2ecc71;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-add:hover {
            background: #27ae60;
            transform: scale(1.02);
        }

        .btn-back {
            padding: 10px 20px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-back:hover {
            background: #5a6fd6;
            transform: scale(1.02);
        }

        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .search-box input {
            flex: 1;
            padding: 10px 14px;
            border: 2px solid #e8edf2;
            border-radius: 12px;
            font-size: 15px;
            background: white;
            transition: 0.3s;
            min-width: 200px;
        }

        .search-box input:focus {
            outline: none;
            border-color: #667eea;
        }

        .groups-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 20px;
            flex: 1;
        }

        .group-card {
            background: white;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
            transition: 0.3s;
            position: relative;
            display: flex;
            flex-direction: column;
            cursor: pointer;
        }

        .group-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
        }

        .group-card .group-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 8px;
        }

        .group-card .group-icon {
            font-size: 36px;
        }

        .group-card .group-number {
            font-size: 13px;
            color: #999;
            margin-bottom: 4px;
        }

        .group-card .group-name {
            font-size: 20px;
            font-weight: 600;
            color: #333;
        }

        .group-card .group-meta {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px 12px;
            margin: 10px 0;
            font-size: 13px;
            color: #666;
        }

        .group-card .group-meta span {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .group-card .group-description {
            color: #888;
            font-size: 14px;
            margin: 8px 0 12px 0;
            flex: 1;
        }

        .group-card .group-location {
            background: #f0f4ff;
            border-radius: 8px;
            padding: 8px 12px;
            margin: 6px 0 10px 0;
            font-size: 13px;
            color: #444;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .group-card .group-location .location-type {
            background: #667eea;
            color: white;
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
        }

        .group-card .group-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 14px;
            padding-top: 14px;
            border-top: 1px solid #f0f2f5;
        }

        .group-card .student-count {
            background: #667eea;
            color: white;
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 500;
        }

        .group-card .group-actions {
            display: flex;
            gap: 8px;
        }

        .group-card .group-actions button {
            padding: 6px 14px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            transition: 0.3s;
        }

        .group-card .group-actions .btn-edit {
            background: #f39c12;
            color: white;
        }

        .group-card .group-actions .btn-edit:hover {
            background: #e67e22;
        }

        .group-card .group-actions .btn-delete {
            background: #e74c3c;
            color: white;
        }

        .group-card .group-actions .btn-delete:hover {
            background: #c0392b;
        }

        .group-card .badge-status {
            padding: 3px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
            display: inline-block;
        }

        .badge-active {
            background: #eafaf1;
            color: #27ae60;
        }

        .badge-inactive {
            background: #fdedec;
            color: #e74c3c;
        }

        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }

        .empty-state .big-icon {
            font-size: 56px;
            display: block;
            margin-bottom: 12px;
        }

        .empty-state p {
            font-size: 16px;
        }

        .footer {
            text-align: center;
            margin-top: 30px;
            padding: 15px;
            color: #aaa;
            font-size: 13px;
            border-top: 1px solid #e8edf2;
            direction: ltr;
        }

        .footer .name {
            color: #667eea;
            font-weight: 600;
        }

        /* ===== الموبايل ===== */
        @media (max-width: 768px) {
            .hamburger {
                display: block;
            }

            .sidebar {
                width: 280px;
                transform: translateX(100%);
                box-shadow: -4px 0 20px rgba(0, 0, 0, 0.1);
            }

            .sidebar.open {
                transform: translateX(0);
            }

            .sidebar .close-btn {
                display: block;
            }

            .main-content {
                margin-right: 0;
                padding: 70px 15px 15px 15px;
            }

            .page-header h1 {
                font-size: 20px;
            }

            .groups-grid {
                grid-template-columns: 1fr 1fr;
            }

            .group-card .group-meta {
                grid-template-columns: 1fr;
            }

            .btn-add,
            .btn-back {
                font-size: 12px;
                padding: 6px 12px;
            }
        }

        @media (max-width: 480px) {
            .groups-grid {
                grid-template-columns: 1fr;
            }

            .group-card {
                padding: 16px;
            }

            .group-card .group-header {
                flex-wrap: wrap;
            }

            .group-card .group-icon {
                font-size: 28px;
            }

            .group-card .group-name {
                font-size: 17px;
            }

            .group-card .group-meta {
                grid-template-columns: 1fr;
                font-size: 12px;
            }

            .hamburger {
                font-size: 20px;
                padding: 8px 12px;
                top: 10px;
                right: 10px;
            }

            .sidebar {
                width: 260px;
            }

            .page-header {
                flex-direction: column;
                align-items: stretch;
            }

            .page-header .actions {
                justify-content: center;
            }
        }
    </style>
</head>
<body>

    <!-- ===== Hamburger ===== -->
    <button class="hamburger" onclick="toggleSidebar()">☰</button>
    <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

    <!-- ===== Sidebar ===== -->
    <nav class="sidebar" id="sidebar">
        <button class="close-btn" onclick="toggleSidebar()">✕</button>
        <div class="logo">📚 TeachFlow <span>نظام إدارة المعلمين</span></div>

        <button class="sidebar-item" onclick="window.location.href='home.html'">🏠 <span>الرئيسية</span></button>
        <button class="sidebar-item active" onclick="window.location.href='groups.html'">👥 <span>المجموعات</span></button>
        <button class="sidebar-item" onclick="window.location.href='students.html'">👨‍🎓 <span>الطلاب</span></button>
        <button class="sidebar-item" onclick="window.location.href='schedule.html'">📅 <span>الجدول</span></button>
        <button class="sidebar-item" onclick="window.location.href='attendance.html'">✅ <span>الحضور</span></button>
        <button class="sidebar-item" onclick="window.location.href='assessments.html'">📊 <span>التقييمات</span></button>
        <button class="sidebar-item" onclick="window.location.href='finances.html'">💰 <span>الحسابات</span></button>
        <button class="sidebar-item" onclick="window.location.href='student-report.html'">📈 <span>التقارير</span></button>
        <button class="sidebar-item" onclick="window.location.href='notifications.html'">🔔 <span>التنبيهات</span></button>
        <button class="sidebar-item" onclick="window.location.href='settings.html'">⚙️ <span>الإعدادات</span></button>
        <button class="sidebar-item" onclick="logout()">🚪 <span>تسجيل الخروج</span></button>
    </nav>

    <!-- ===== Main ===== -->
    <main class="main-content">

        <div class="page-header">
            <h1>
                👥 المجموعات
                <span style="font-size:16px;color:#999;font-weight:400;" id="groupsCountLabel">(0)</span>
            </h1>
            <div class="actions">
                <button class="btn-back" onclick="window.location.href='home.html'">🔙 رجوع</button>
                <button class="btn-add" onclick="showAddGroup()">➕ إضافة مجموعة</button>
            </div>
        </div>

        <div class="search-box">
            <input type="text" id="searchInput" placeholder="🔍 ابحث عن مجموعة..." oninput="searchGroups()">
        </div>

        <div class="groups-grid" id="groupsGrid"></div>

        <div class="footer">
            Designed with ❤️ by <span class="name">Dr. Hamada Fathy Hammad</span>
        </div>
    </main>

    <script>
        // ===== Firebase Config =====
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT.firebaseapp.com",
            projectId: "YOUR_PROJECT",
            storageBucket: "YOUR_PROJECT.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // ===== Sidebar Toggle =====
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebarOverlay');

            sidebar.classList.toggle('closed');
            sidebar.classList.toggle('open');
            overlay.classList.toggle('active');

            if (window.innerWidth <= 768) {
                document.querySelectorAll('.sidebar-item').forEach(item => {
                    item.addEventListener('click', function() {
                        setTimeout(() => {
                            sidebar.classList.add('closed');
                            sidebar.classList.remove('open');
                            overlay.classList.remove('active');
                        }, 300);
                    });
                });
            }
        }

        // ===== بيانات المجموعات =====
        let groups = [];
        let filteredGroups = [];
        const locationTypes = ['🏠 بيت', '🏢 سنتر', '💻 أونلاين', '📚 مدرسة', '🏛️ معهد', '📍 مكان آخر'];
        const daysList = ['السبت', 'الأحد', 'الإثنين', 'الثلاثاء', 'الأربعاء', 'الخميس', 'الجمعة'];
        const timeList = ['8:00 ص', '9:00 ص', '10:00 ص', '11:00 ص', '12:00 م', '1:00 م', '2:00 م', '3:00 م', '4:00 م', '5:00 م', '6:00 م', '7:00 م', '8:00 م', '9:00 م', '10:00 م'];

        // ===== جلب المجموعات من Firebase =====
        async function loadGroups() {
            const uid = localStorage.getItem('teachflow_uid');
            if (!uid) {
                window.location.href = 'index.html';
                return;
            }

            try {
                const snapshot = await db.collection('teachers').doc(uid).collection('groups').get();
                groups = [];
                snapshot.forEach(doc => {
                    groups.push({ id: doc.id, ...doc.data() });
                });

                // ترتيب حسب رقم المجموعة
                groups.sort((a, b) => (a.number || '').localeCompare(b.number || ''));
                filteredGroups = [...groups];
                renderGroups();

            } catch (error) {
                console.error('❌ خطأ في تحميل المجموعات:', error);
                groups = [];
                filteredGroups = [];
                renderGroups();
            }
        }

        // ===== حفظ المجموعة في Firebase =====
        async function saveGroup(groupData) {
            const uid = localStorage.getItem('teachflow_uid');
            if (!uid) return;

            try {
                const docRef = await db.collection('teachers').doc(uid).collection('groups').add(groupData);
                return docRef.id;
            } catch (error) {
                console.error('❌ خطأ في حفظ المجموعة:', error);
                alert('❌ حدث خطأ أثناء حفظ المجموعة');
                return null;
            }
        }

        // ===== تحديث مجموعة في Firebase =====
        async function updateGroup(groupId, groupData) {
            const uid = localStorage.getItem('teachflow_uid');
            if (!uid) return;

            try {
                await db.collection('teachers').doc(uid).collection('groups').doc(groupId).update(groupData);
                return true;
            } catch (error) {
                console.error('❌ خطأ في تحديث المجموعة:', error);
                alert('❌ حدث خطأ أثناء تحديث المجموعة');
                return false;
            }
        }

        // ===== حذف مجموعة من Firebase =====
        async function deleteGroupFromFirebase(groupId) {
            const uid = localStorage.getItem('teachflow_uid');
            if (!uid) return;

            try {
                await db.collection('teachers').doc(uid).collection('groups').doc(groupId).delete();
                return true;
            } catch (error) {
                console.error('❌ خطأ في حذف المجموعة:', error);
                alert('❌ حدث خطأ أثناء حذف المجموعة');
                return false;
            }
        }

        // ===== عرض المجموعات =====
        function renderGroups() {
            const grid = document.getElementById('groupsGrid');

            if (filteredGroups.length === 0) {
                grid.innerHTML = `
                    <div class="empty-state">
                        <span class="big-icon">👥</span>
                        <p>لا توجد مجموعات</p>
                        <p style="font-size:12px;color:#ccc;">اضغط على "إضافة مجموعة" لإضافة أول مجموعة</p>
                    </div>
                `;
            } else {
                grid.innerHTML = filteredGroups.map(group => {
                    // حساب عدد الطلاب في هذه المجموعة (من Firebase)
                    const studentCount = group.studentCount || 0;
                    const statusClass = group.active ? 'badge-active' : 'badge-inactive';
                    const statusText = group.active ? '✅ نشطة' : '❌ غير نشطة';

                    return `
                        <div class="group-card" onclick="showGroupStudents('${group.id}')">
                            <div class="group-number"># ${group.number || 'G-000'}</div>
                            <div class="group-header">
                                <span class="group-icon">${group.icon || '👥'}</span>
                                <span class="group-name">${group.name}</span>
                            </div>
                            <div class="group-description">${group.description || 'لا يوجد وصف'}</div>
                            <div class="group-location">
                                <span class="location-type">${group.locationType || '📍 مكان'}</span>
                                <span>${group.locationAddress || 'لا يوجد عنوان'}</span>
                            </div>
                            <div class="group-meta">
                                <span>📅 ${group.day || 'غير محدد'}</span>
                                <span>⏰ ${group.time || 'غير محدد'}</span>
                                <span>📊 المستوى: ${group.level || 'عام'}</span>
                                <span>👥 الحد الأقصى: ${group.maxStudents || 'غير محدد'}</span>
                            </div>
                            <div class="group-footer">
                                <div>
                                    <span class="student-count">${studentCount} طالب</span>
                                    <span class="badge-status ${statusClass}" style="margin-right:8px;">${statusText}</span>
                                </div>
                                <div class="group-actions" onclick="event.stopPropagation();">
                                    <button class="btn-edit" onclick="editGroup('${group.id}')">✏️ تعديل</button>
                                    <button class="btn-delete" onclick="deleteGroup('${group.id}')">🗑️ حذف</button>
                                </div>
                            </div>
                        </div>
                    `;
                }).join('');
            }

            document.getElementById('groupsCountLabel').textContent = `(${filteredGroups.length})`;
        }

        // ===== عرض طلاب المجموعة =====
        async function showGroupStudents(groupId) {
            const uid = localStorage.getItem('teachflow_uid');
            if (!uid) return;

            try {
                // جلب المجموعة
                const groupDoc = await db.collection('teachers').doc(uid).collection('groups').doc(groupId).get();
                if (!groupDoc.exists) {
                    alert('⚠️ المجموعة غير موجودة');
                    return;
                }
                const group = groupDoc.data();

                // جلب الطلاب المرتبطين بهذه المجموعة
                const studentsSnapshot = await db.collection('teachers').doc(uid).collection('students')
                    .where('group', '==', group.name).get();

                if (studentsSnapshot.empty) {
                    alert(`📚 ${group.name}\n\nلا يوجد طلاب في هذه المجموعة`);
                    return;
                }

                const students = [];
                studentsSnapshot.forEach(doc => {
                    students.push({ id: doc.id, ...doc.data() });
                });

                const studentList = students.map((s, i) =>
                    `${i + 1}. ${s.name} 📱 ${s.phone || '-'} 👨‍👦 ${s.parentPhone || '-'}`
                ).join('\n');

                alert(`📚 ${group.name}\n👥 ${students.length} طالب\n\n${studentList}`);

            } catch (error) {
                console.error('❌ خطأ في عرض الطلاب:', error);
                alert('❌ حدث خطأ أثناء عرض الطلاب');
            }
        }

        // ===== البحث =====
        function searchGroups() {
            const filter = document.getElementById('searchInput').value.trim().toLowerCase();
            filteredGroups = groups.filter(g =>
                (g.name || '').toLowerCase().includes(filter) ||
                (g.number || '').toLowerCase().includes(filter) ||
                (g.description || '').toLowerCase().includes(filter) ||
                (g.locationAddress || '').toLowerCase().includes(filter) ||
                (g.locationType || '').includes(filter) ||
                (g.day || '').includes(filter) ||
                (g.level || '').toLowerCase().includes(filter)
            );
            renderGroups();
        }

        // ===== عرض قائمة منسدلة =====
        function showDropdown(options, title, currentValue = '') {
            let list = options.map((item, i) => `${i + 1}. ${item}`).join('\n');
            let defaultIndex = options.indexOf(currentValue) + 1;
            if (defaultIndex === 0) defaultIndex = '';
            const choice = prompt(`${title}:\n${list}\n\nأدخل رقم الخيار:`, defaultIndex);
            if (!choice) return null;
            const index = parseInt(choice) - 1;
            if (isNaN(index) || index < 0 || index >= options.length) {
                alert('⚠️ اختيار غير صحيح!');
                return null;
            }
            return options[index];
        }

        // ===== إضافة مجموعة =====
        async function showAddGroup() {
            const uid = localStorage.getItem('teachflow_uid');
            if (!uid) {
                alert('⚠️ يرجى تسجيل الدخول أولاً');
                return;
            }

            const nextNumber = groups.length + 1;
            const defaultNumber = 'G-' + String(nextNumber).padStart(3, '0');

            const number = prompt('🔢 رقم المجموعة (مثلاً G-001):', defaultNumber);
            if (!number) return;

            if (groups.some(g => g.number === number)) {
                alert('⚠️ هذا الرقم موجود بالفعل!');
                return;
            }

            const name = prompt('👥 اسم المجموعة:');
            if (!name) return;

            const icon = prompt('🎨 أيقونة المجموعة (اختياري):', '👥') || '👥';

            const locationType = showDropdown(locationTypes, '📍 اختر مكان الانعقاد');
            if (locationType === null) return;

            const locationAddress = prompt('📍 العنوان التفصيلي (شارع، منطقة، محافظة):') || '';

            const description = prompt('📝 وصف المجموعة (اختياري):') || '';

            const day = showDropdown(daysList, '📅 اختر اليوم');
            if (day === null) return;

            const time = showDropdown(timeList, '⏰ اختر الوقت');
            if (time === null) return;

            const level = prompt('📊 المستوى (مبتدئ، متوسط، متقدم):', 'متوسط') || 'متوسط';
            const maxStudents = prompt('👥 الحد الأقصى للطلاب:', '20') || '20';
            const active = confirm('✅ هل المجموعة نشطة؟ (OK = نشطة، Cancel = غير نشطة)');

            const newGroup = {
                number: number,
                name: name,
                icon: icon,
                description: description,
                locationType: locationType,
                locationAddress: locationAddress,
                day: day,
                time: time,
                level: level,
                maxStudents: parseInt(maxStudents) || 20,
                active: active,
                studentCount: 0
            };

            const docId = await saveGroup(newGroup);
            if (docId) {
                newGroup.id = docId;
                groups.push(newGroup);
                groups.sort((a, b) => (a.number || '').localeCompare(b.number || ''));
                filteredGroups = [...groups];
                renderGroups();
                alert(`✅ تم إضافة المجموعة "${name}" برقم ${number}`);
            }
        }

        // ===== تعديل مجموعة =====
        async function editGroup(groupId) {
            const group = groups.find(g => g.id === groupId);
            if (!group) return;

            const number = prompt('🔢 رقم المجموعة:', group.number);
            if (number && number !== group.number) {
                if (groups.some(g => g.number === number && g.id !== groupId)) {
                    alert('⚠️ هذا الرقم موجود بالفعل!');
                    return;
                }
                group.number = number;
            }

            const name = prompt('👥 اسم المجموعة:', group.name);
            if (name) group.name = name;

            const icon = prompt('🎨 أيقونة المجموعة:', group.icon) || '👥';
            if (icon) group.icon = icon;

            const locationType = showDropdown(locationTypes, '📍 اختر مكان الانعقاد', group.locationType);
            if (locationType !== null) group.locationType = locationType;

            const locationAddress = prompt('📍 العنوان التفصيلي:', group.locationAddress) || '';
            if (locationAddress !== null) group.locationAddress = locationAddress;

            const description = prompt('📝 وصف المجموعة:', group.description) || '';
            if (description !== null) group.description = description;

            const day = showDropdown(daysList, '📅 اختر اليوم', group.day);
            if (day !== null) group.day = day;

            const time = showDropdown(timeList, '⏰ اختر الوقت', group.time);
            if (time !== null) group.time = time;

            const level = prompt('📊 المستوى (مبتدئ، متوسط، متقدم):', group.level) || 'متوسط';
            if (level !== null) group.level = level;

            const maxStudents = prompt('👥 الحد الأقصى للطلاب:', group.maxStudents) || '20';
            if (maxStudents !== null) group.maxStudents = parseInt(maxStudents) || 20;

            group.active = confirm('✅ هل المجموعة نشطة؟ (OK = نشطة، Cancel = غير نشطة)');

            const updated = await updateGroup(groupId, {
                number: group.number,
                name: group.name,
                icon: group.icon,
                description: group.description,
                locationType: group.locationType,
                locationAddress: group.locationAddress,
                day: group.day,
                time: group.time,
                level: group.level,
                maxStudents: group.maxStudents,
                active: group.active
            });

            if (updated) {
                groups.sort((a, b) => (a.number || '').localeCompare(b.number || ''));
                filteredGroups = [...groups];
                renderGroups();
                alert('✅ تم تعديل المجموعة!');
            }
        }

        // ===== حذف مجموعة =====
        async function deleteGroup(groupId) {
            const group = groups.find(g => g.id === groupId);
            if (!group) return;

            // التحقق من وجود طلاب في المجموعة
            const uid = localStorage.getItem('teachflow_uid');
            if (!uid) return;

            try {
                const studentsSnapshot = await db.collection('teachers').doc(uid).collection('students')
                    .where('group', '==', group.name).get();

                if (!studentsSnapshot.empty) {
                    if (!confirm(`⚠️ يوجد ${studentsSnapshot.size} طالب في هذه المجموعة. هل أنت متأكد من حذفها؟ سيتم إزالة المجموعة من الطلاب.`)) {
                        return;
                    }
                    // إزالة المجموعة من الطلاب
                    const batch = db.batch();
                    studentsSnapshot.forEach(doc => {
                        batch.update(doc.ref, { group: '' });
                    });
                    await batch.commit();
                }

                if (confirm(`🗑️ هل أنت متأكد من حذف المجموعة "${group.name}"؟`)) {
                    const deleted = await deleteGroupFromFirebase(groupId);
                    if (deleted) {
                        groups = groups.filter(g => g.id !== groupId);
                        filteredGroups = [...groups];
                        renderGroups();
                        alert('✅ تم حذف المجموعة!');
                    }
                }
            } catch (error) {
                console.error('❌ خطأ في حذف المجموعة:', error);
                alert('❌ حدث خطأ أثناء حذف المجموعة');
            }
        }

        // ===== تسجيل الخروج =====
        function logout() {
            if (confirm('هل أنت متأكد من تسجيل الخروج؟')) {
                localStorage.removeItem('teachflow_teacher');
                localStorage.removeItem('teachflow_user');
                localStorage.removeItem('teachflow_uid');
                window.location.href = 'index.html';
            }
        }

        // ===== تحميل الصفحة =====
        document.addEventListener('DOMContentLoaded', function() {
            const uid = localStorage.getItem('teachflow_uid');
            if (!uid) {
                window.location.href = 'index.html';
                return;
            }
            loadGroups();

            if (window.innerWidth > 768) {
                const sidebar = document.getElementById('sidebar');
                sidebar.classList.remove('closed');
                sidebar.classList.remove('open');
            }
        });

        window.addEventListener('resize', function() {
            const sidebar = document.getElementById('sidebar');
            if (window.innerWidth > 768) {
                sidebar.classList.remove('closed');
                sidebar.classList.remove('open');
                document.getElementById('sidebarOverlay').classList.remove('active');
            } else {
                sidebar.classList.add('closed');
                sidebar.classList.remove('open');
            }
        });
    </script>
</body>
</html>
