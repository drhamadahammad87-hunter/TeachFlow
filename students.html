<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الطلاب - TeachFlow</title>
    <!-- ===== Firebase SDK ===== -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js">
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, sans-serif;
        }

        body {
            background: #f0f2f5;
            min-height: 100vh;
        }

        /* ===== Hamburger ===== */
        .hamburger {
            display: none;
            position: fixed;
            top: 15px;
            right: 15px;
            z-index: 999;
            background: #667eea;
            color: white;
            border: none;
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 24px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
        }

        .sidebar-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.4);
            z-index: 99;
        }

        .sidebar-overlay.active {
            display: block;
        }

        /* ===== Sidebar ===== */
        .sidebar {
            position: fixed;
            right: 0;
            top: 0;
            width: 220px;
            height: 100vh;
            background: white;
            padding: 20px 15px;
            box-shadow: -2px 0 10px rgba(0, 0, 0, 0.05);
            overflow-y: auto;
            z-index: 100;
            transition: transform 0.3s ease;
        }

        .sidebar .close-btn {
            display: none;
            background: none;
            border: none;
            font-size: 28px;
            color: #555;
            cursor: pointer;
            float: left;
            margin-bottom: 10px;
        }

        .logo {
            font-size: 22px;
            font-weight: 700;
            color: #667eea;
            text-align: center;
            padding-bottom: 20px;
            border-bottom: 1px solid #eee;
            margin-bottom: 15px;
        }

        .logo span {
            display: block;
            font-size: 12px;
            color: #999;
            font-weight: 400;
        }

        .sidebar-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 12px;
            border-radius: 10px;
            color: #555;
            cursor: pointer;
            transition: 0.3s;
            border: none;
            background: none;
            width: 100%;
            text-align: right;
            font-size: 14px;
        }

        .sidebar-item:hover {
            background: #f0f4ff;
            color: #667eea;
        }

        .sidebar-item.active {
            background: #667eea;
            color: white;
        }

        /* ===== Main ===== */
        .main-content {
            margin-right: 220px;
            padding: 25px;
            width: 100%;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .page-header h1 {
            font-size: 26px;
            color: #333;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .page-header .actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn-add {
            padding: 10px 20px;
            background: #2ecc71;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-add:hover {
            background: #27ae60;
            transform: scale(1.02);
        }

        .btn-back {
            padding: 10px 20px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-back:hover {
            background: #5a6fd6;
            transform: scale(1.02);
        }

        .btn-import {
            padding: 8px 16px;
            background: #3498db;
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            transition: 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
        }

        .btn-import:hover {
            background: #2980b9;
            transform: scale(1.02);
        }

        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .search-box input {
            flex: 1;
            padding: 10px 14px;
            border: 2px solid #e8edf2;
            border-radius: 12px;
            font-size: 15px;
            background: white;
            transition: 0.3s;
            min-width: 200px;
        }

        .search-box input:focus {
            outline: none;
            border-color: #667eea;
        }

        .table-container {
            background: white;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
            flex: 1;
            overflow-x: auto;
        }

        .students-table {
            width: 100%;
            border-collapse: collapse;
            min-width: 700px;
        }

        .students-table th {
            background: #f8fafc;
            padding: 14px 16px;
            text-align: right;
            font-weight: 600;
            color: #555;
            font-size: 14px;
            border-bottom: 2px solid #e8edf2;
            white-space: nowrap;
        }

        .students-table td {
            padding: 12px 16px;
            border-bottom: 1px solid #f0f2f5;
            color: #333;
            font-size: 14px;
        }

        .students-table tr:hover td {
            background: #f8fafc;
        }

        .students-table .actions-cell {
            display: flex;
            gap: 8px;
        }

        .btn-edit {
            padding: 4px 12px;
            background: #f39c12;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 12px;
            transition: 0.3s;
        }

        .btn-edit:hover {
            background: #e67e22;
        }

        .btn-delete {
            padding: 4px 12px;
            background: #e74c3c;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 12px;
            transition: 0.3s;
        }

        .btn-delete:hover {
            background: #c0392b;
        }

        .badge {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
        }

        .badge-active {
            background: #eafaf1;
            color: #27ae60;
        }

        .badge-inactive {
            background: #fdedec;
            color: #e74c3c;
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: #999;
        }

        .empty-state .big-icon {
            font-size: 48px;
            display: block;
            margin-bottom: 10px;
        }

        .footer {
            text-align: center;
            margin-top: 30px;
            padding: 15px;
            color: #aaa;
            font-size: 13px;
            border-top: 1px solid #e8edf2;
            direction: ltr;
        }

        .footer .name {
            color: #667eea;
            font-weight: 600;
        }

        /* ===== Mobile ===== */
        @media (max-width: 768px) {
            .hamburger {
                display: block;
            }

            .sidebar {
                width: 280px;
                transform: translateX(100%);
                box-shadow: -4px 0 20px rgba(0, 0, 0, 0.1);
            }

            .sidebar.open {
                transform: translateX(0);
            }

            .sidebar .close-btn {
                display: block;
            }

            .main-content {
                margin-right: 0;
                padding: 70px 15px 15px 15px;
            }

            .page-header h1 {
                font-size: 20px;
            }

            .students-table {
                font-size: 12px;
                min-width: 600px;
            }

            .students-table th,
            .students-table td {
                padding: 8px 10px;
            }

            .btn-add,
            .btn-back {
                font-size: 12px;
                padding: 6px 12px;
            }

            .btn-import {
                font-size: 11px;
                padding: 4px 10px;
            }
        }

        @media (max-width: 480px) {
            .students-table {
                font-size: 11px;
                min-width: 500px;
            }

            .students-table th,
            .students-table td {
                padding: 6px 8px;
            }

            .page-header {
                flex-direction: column;
                align-items: stretch;
            }

            .page-header .actions {
                justify-content: center;
            }

            .hamburger {
                font-size: 20px;
                padding: 8px 12px;
                top: 10px;
                right: 10px;
            }

            .sidebar {
                width: 260px;
            }

            .search-box {
                flex-direction: column;
            }

            .search-box input {
                min-width: unset;
            }
        }
    </style>
</head>
<body>

    <!-- ===== Hamburger ===== -->
    <button class="hamburger" onclick="toggleSidebar()">☰</button>
    <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

    <!-- ===== Sidebar ===== -->
    <nav class="sidebar" id="sidebar">
        <button class="close-btn" onclick="toggleSidebar()">✕</button>
        <div class="logo">📚 TeachFlow <span>نظام إدارة المعلمين</span></div>

        <button class="sidebar-item" onclick="window.location.href='home.html'">🏠 <span>الرئيسية</span></button>
        <button class="sidebar-item" onclick="window.location.href='groups.html'">👥 <span>المجموعات</span></button>
        <button class="sidebar-item active" onclick="window.location.href='students.html'">👨‍🎓 <span>الطلاب</span></button>
        <button class="sidebar-item" onclick="window.location.href='schedule.html'">📅 <span>الجدول</span></button>
        <button class="sidebar-item" onclick="window.location.href='attendance.html'">✅ <span>الحضور</span></button>
        <button class="sidebar-item" onclick="window.location.href='assessments.html'">📊 <span>التقييمات</span></button>
        <button class="sidebar-item" onclick="window.location.href='finances.html'">💰 <span>الحسابات</span></button>
        <button class="sidebar-item" onclick="window.location.href='student-report.html'">📈 <span>التقارير</span></button>
        <button class="sidebar-item" onclick="window.location.href='notifications.html'">🔔 <span>التنبيهات</span></button>
        <button class="sidebar-item" onclick="window.location.href='settings.html'">⚙️ <span>الإعدادات</span></button>
        <button class="sidebar-item" onclick="logout()">🚪 <span>تسجيل الخروج</span></button>
    </nav>

    <!-- ===== Main ===== -->
    <main class="main-content">

        <div class="page-header">
            <h1>
                👨‍🎓 الطلاب
                <span style="font-size:16px;color:#999;font-weight:400;" id="studentCountLabel">(0)</span>
            </h1>
            <div class="actions">
                <button class="btn-back" onclick="window.location.href='home.html'">🔙 رجوع</button>
                <button class="btn-add" onclick="showAddStudent()">➕ إضافة طالب</button>
            </div>
        </div>

        <div class="search-box">
            <input type="text" id="searchInput" placeholder="🔍 ابحث عن طالب..." oninput="searchStudents()">
        </div>

        <div class="table-container">
            <table class="students-table">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>👤 اسم الطالب</th>
                        <th>📚 المجموعة</th>
                        <th>📱 تليفون الطالب</th>
                        <th>📱 تليفون ولي الأمر</th>
                        <th>الحالة</th>
                        <th>⚡ المهارات</th>
                    </tr>
                </thead>
                <tbody id="studentsTableBody">
                    <!-- هتتعبأ من JavaScript -->
                </tbody>
            </table>
        </div>

        <div class="footer">
            Designed with ❤️ by <span class="name">Dr. Hamada Fathy Hammad</span>
        </div>
    </main>

    <script>
        // ===== Firebase Config =====
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT.firebaseapp.com",
            projectId: "YOUR_PROJECT",
            storageBucket: "YOUR_PROJECT.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // ===== Sidebar Toggle =====
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebarOverlay');

            sidebar.classList.toggle('closed');
            sidebar.classList.toggle('open');
            overlay.classList.toggle('active');

            if (window.innerWidth <= 768) {
                document.querySelectorAll('.sidebar-item').forEach(item => {
                    item.addEventListener('click', function() {
                        setTimeout(() => {
                            sidebar.classList.add('closed');
                            sidebar.classList.remove('open');
                            overlay.classList.remove('active');
                        }, 300);
                    });
                });
            }
        }

        // ===== بيانات الطلاب =====
        let students = [];
        let groups = [];

        // ===== جلب الطلاب من Firebase =====
        async function loadData() {
            const uid = localStorage.getItem('teachflow_uid');
            if (!uid) {
                window.location.href = 'index.html';
                return;
            }

            try {
                // جلب المجموعات
                const groupsSnapshot = await db.collection('teachers').doc(uid).collection('groups').get();
                groups = [];
                groupsSnapshot.forEach(doc => {
                    groups.push({ id: doc.id, ...doc.data() });
                });

                // جلب الطلاب
                const studentsSnapshot = await db.collection('teachers').doc(uid).collection('students').get();
                students = [];
                studentsSnapshot.forEach(doc => {
                    students.push({ id: doc.id, ...doc.data() });
                });

                renderStudents();

            } catch (error) {
                console.error('❌ خطأ في تحميل البيانات:', error);
                students = [];
                renderStudents();
            }
        }

        // ===== حفظ طالب في Firebase =====
        async function saveStudent(studentData) {
            const uid = localStorage.getItem('teachflow_uid');
            if (!uid) return;

            try {
                const docRef = await db.collection('teachers').doc(uid).collection('students').add(studentData);
                return docRef.id;
            } catch (error) {
                console.error('❌ خطأ في حفظ الطالب:', error);
                alert('❌ حدث خطأ أثناء حفظ الطالب');
                return null;
            }
        }

        // ===== تحديث طالب في Firebase =====
        async function updateStudent(studentId, studentData) {
            const uid = localStorage.getItem('teachflow_uid');
            if (!uid) return;

            try {
                await db.collection('teachers').doc(uid).collection('students').doc(studentId).update(studentData);
                return true;
            } catch (error) {
                console.error('❌ خطأ في تحديث الطالب:', error);
                alert('❌ حدث خطأ أثناء تحديث الطالب');
                return false;
            }
        }

        // ===== حذف طالب من Firebase =====
        async function deleteStudentFromFirebase(studentId) {
            const uid = localStorage.getItem('teachflow_uid');
            if (!uid) return;

            try {
                await db.collection('teachers').doc(uid).collection('students').doc(studentId).delete();
                return true;
            } catch (error) {
                console.error('❌ خطأ في حذف الطالب:', error);
                alert('❌ حدث خطأ أثناء حذف الطالب');
                return false;
            }
        }

        // ===== عرض الطلاب =====
        function renderStudents(filter = '') {
            const tbody = document.getElementById('studentsTableBody');

            let filtered = students;
            if (filter) {
                filtered = students.filter(s =>
                    (s.name || '').includes(filter) ||
                    (s.group || '').includes(filter) ||
                    (s.phone || '').includes(filter) ||
                    (s.parentPhone || '').includes(filter)
                );
            }

            if (filtered.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="7">
                            <div class="empty-state">
                                <span class="big-icon">👨‍🎓</span>
                                <p>لا يوجد طلاب</p>
                                <p style="font-size:12px;color:#ccc;">اضغط على "إضافة طالب" لإضافة أول طالب</p>
                            </div>
                        </td>
                    </tr>
                `;
            } else {
                tbody.innerHTML = filtered.map((student, index) => `
                    <tr>
                        <td>${index + 1}</td>
                        <td><strong>${student.name || ''}</strong></td>
                        <td>${student.group || '-'}</td>
                        <td>${student.phone || '-'}</td>
                        <td>${student.parentPhone || '-'}</td>
                        <td>
                            <span class="badge ${student.active ? 'badge-active' : 'badge-inactive'}">
                                ${student.active ? '✅ نشط' : '❌ غير نشط'}
                            </span>
                        </td>
                        <td class="actions-cell">
                            <button class="btn-edit" onclick="editStudent('${student.id}')">✏️ تعديل</button>
                            <button class="btn-delete" onclick="deleteStudent('${student.id}')">🗑️ حذف</button>
                        </td>
                    </tr>
                `).join('');
            }

            document.getElementById('studentCountLabel').textContent = `(${students.length})`;
        }

        // ===== البحث =====
        function searchStudents() {
            const filter = document.getElementById('searchInput').value.trim();
            renderStudents(filter);
        }

        // ===== استيراد جهة اتصال =====
        async function importContact() {
            if (!navigator.contacts) {
                alert('⚠️ هذه الميزة غير مدعومة في هذا المتصفح.\nيرجى استخدام متصفح Chrome على Android.');
                return;
            }

            try {
                const properties = ['name', 'tel'];
                const options = { multiple: false };

                const contacts = await navigator.contacts.select(properties, options);

                if (!contacts || contacts.length === 0) {
                    alert('⚠️ لم يتم اختيار أي جهة اتصال');
                    return;
                }

                const contact = contacts[0];
                const name = contact.name ? contact.name[0] : '';
                const phone = contact.tel ? contact.tel[0] : '';

                if (name || phone) {
                    // فتح نافذة إضافة طالب مع البيانات المستوردة
                    const studentName = prompt('👤 اسم الطالب:', name) || '';
                    if (!studentName) return;

                    const groupName = await selectGroup();
                    if (groupName === null) return;

                    const studentPhone = prompt('📱 تليفون الطالب:', phone) || '';
                    if (!studentPhone) return;

                    const parentPhone = prompt('📱 تليفون ولي الأمر:') || '';

                    if (studentName && groupName && studentPhone) {
                        await addStudentToFirebase(studentName, groupName, studentPhone, parentPhone);
                    }
                } else {
                    alert('⚠️ جهة الاتصال لا تحتوي على اسم أو رقم');
                }
            } catch (error) {
                console.error('❌ خطأ في استيراد جهة الاتصال:', error);
                alert('❌ حدث خطأ أثناء استيراد جهة الاتصال');
            }
        }

        // ===== اختيار مجموعة =====
        function selectGroup() {
            if (groups.length === 0) {
                alert('⚠️ لا توجد مجموعات! الرجاء إضافة مجموعة أولاً من صفحة المجموعات.');
                return null;
            }

            const groupOptions = groups.map((g, i) => `${i + 1}. ${g.number || ''} - ${g.name}`).join('\n');
            const groupChoice = prompt(`📚 اختر المجموعة:\n${groupOptions}\n\nأدخل رقم المجموعة:`);
            const groupIndex = parseInt(groupChoice) - 1;

            if (isNaN(groupIndex) || groupIndex < 0 || groupIndex >= groups.length) {
                alert('⚠️ اختيار غير صحيح!');
                return null;
            }

            return groups[groupIndex].name;
        }

        // ===== إضافة طالب إلى Firebase =====
        async function addStudentToFirebase(name, group, phone, parentPhone) {
            const uid = localStorage.getItem('teachflow_uid');
            if (!uid) return;

            // التحقق من الحد الأقصى
            const teacherDoc = await db.collection('teachers').doc(uid).get();
            const teacher = teacherDoc.data();

            if (!teacher.isPaid) {
                const maxStudents = teacher.maxStudents || 10;
                const studentsSnapshot = await db.collection('teachers').doc(uid).collection('students').get();

                if (studentsSnapshot.size >= maxStudents) {
                    alert(`⚠️ لقد وصلت للحد الأقصى من الطلاب (${maxStudents} طالب).\nقم بالترقية لإضافة المزيد من الطلاب.`);
                    if (confirm('هل تريد الترقية الآن؟')) {
                        window.location.href = 'pricing.html';
                    }
                    return;
                }
            }

            const newStudent = {
                name: name,
                group: group,
                phone: phone,
                parentPhone: parentPhone || '',
                active: true,
                addedAt: new Date().toISOString()
            };

            const docId = await saveStudent(newStudent);
            if (docId) {
                newStudent.id = docId;
                students.push(newStudent);
                renderStudents();
                alert(`✅ تم إضافة الطالب ${name} إلى مجموعة "${group}"`);
            }
        }

        // ===== إضافة طالب (الطريقة العادية) =====
        async function showAddStudent() {
            const uid = localStorage.getItem('teachflow_uid');
            if (!uid) return;

            // جلب المجموعات من Firebase
            const groupsSnapshot = await db.collection('teachers').doc(uid).collection('groups').get();
            const groups = [];
            groupsSnapshot.forEach(doc => {
                groups.push({ id: doc.id, ...doc.data() });
            });

            if (groups.length === 0) {
                alert('⚠️ لا توجد مجموعات! الرجاء إضافة مجموعة أولاً من صفحة المجموعات.');
                return;
            }

            const groupOptions = groups.map((g, i) => `${i + 1}. ${g.number || ''} - ${g.name}`).join('\n');
            const groupChoice = prompt(`📚 اختر المجموعة:\n${groupOptions}\n\nأدخل رقم المجموعة:`);
            const groupIndex = parseInt(groupChoice) - 1;

            if (isNaN(groupIndex) || groupIndex < 0 || groupIndex >= groups.length) {
                alert('⚠️ اختيار غير صحيح!');
                return;
            }

            const selectedGroup = groups[groupIndex].name;

            // استيراد من جهات الاتصال أو كتابة يدوياً
            const useImport = confirm('📇 هل تريد استيراد بيانات الطالب من جهات الاتصال؟\n(OK = نعم، Cancel = كتابة يدوية)');

            let name, phone;

            if (useImport && navigator.contacts) {
                try {
                    const contacts = await navigator.contacts.select(['name', 'tel'], { multiple: false });
                    if (contacts && contacts.length > 0) {
                        const contact = contacts[0];
                        name = contact.name ? contact.name[0] : '';
                        phone = contact.tel ? contact.tel[0] : '';
                    }
                } catch (error) {
                    console.error('❌ خطأ في استيراد جهة الاتصال:', error);
                }
            }

            if (!name) {
                name = prompt('👤 اسم الطالب:');
                if (!name) return;
            }

            if (!phone) {
                phone = prompt('📱 تليفون الطالب:');
                if (!phone) return;
            }

            const parentPhone = prompt('📱 تليفون ولي الأمر:') || '';

            // التحقق من الحد الأقصى
            const teacherDoc = await db.collection('teachers').doc(uid).get();
            const teacher = teacherDoc.data();

            if (!teacher.isPaid) {
                const maxStudents = teacher.maxStudents || 10;
                const studentsSnapshot = await db.collection('teachers').doc(uid).collection('students').get();

                if (studentsSnapshot.size >= maxStudents) {
                    alert(`⚠️ لقد وصلت للحد الأقصى من الطلاب (${maxStudents} طالب).\nقم بالترقية لإضافة المزيد من الطلاب.`);
                    if (confirm('هل تريد الترقية الآن؟')) {
                        window.location.href = 'pricing.html';
                    }
                    return;
                }
            }

            const newStudent = {
                name: name,
                group: selectedGroup,
                phone: phone,
                parentPhone: parentPhone || '',
                active: true,
                addedAt: new Date().toISOString()
            };

            const docId = await saveStudent(newStudent);
            if (docId) {
                newStudent.id = docId;
                students.push(newStudent);
                renderStudents();
                alert(`✅ تم إضافة الطالب ${name} إلى مجموعة "${selectedGroup}"`);
            }
        }

        // ===== تعديل طالب =====
        async function editStudent(studentId) {
            const student = students.find(s => s.id === studentId);
            if (!student) return;

            const uid = localStorage.getItem('teachflow_uid');
            if (!uid) return;

            // جلب المجموعات
            const groupsSnapshot = await db.collection('teachers').doc(uid).collection('groups').get();
            const groups = [];
            groupsSnapshot.forEach(doc => {
                groups.push({ id: doc.id, ...doc.data() });
            });

            const name = prompt('👤 اسم الطالب:', student.name);
            if (name) student.name = name;

            if (groups.length > 0) {
                const groupOptions = groups.map((g, i) => `${i + 1}. ${g.number || ''} - ${g.name}`).join('\n');
                const currentGroupIndex = groups.findIndex(g => g.name === student.group) + 1;
                const groupChoice = prompt(`📚 اختر المجموعة (الحالية: ${student.group}):\n${groupOptions}\n\nأدخل رقم المجموعة:`, currentGroupIndex);
                if (groupChoice) {
                    const groupIndex = parseInt(groupChoice) - 1;
                    if (!isNaN(groupIndex) && groupIndex >= 0 && groupIndex < groups.length) {
                        student.group = groups[groupIndex].name;
                    }
                }
            }

            const phone = prompt('📱 تليفون الطالب:', student.phone);
            if (phone) student.phone = phone;

            const parentPhone = prompt('📱 تليفون ولي الأمر:', student.parentPhone);
            if (parentPhone !== null) student.parentPhone = parentPhone;

            student.active = confirm('✅ هل الطالب نشط؟ (OK = نشط، Cancel = غير نشط)');

            const updated = await updateStudent(studentId, {
                name: student.name,
                group: student.group,
                phone: student.phone,
                parentPhone: student.parentPhone,
                active: student.active
            });

            if (updated) {
                renderStudents();
                alert('✅ تم تعديل بيانات الطالب!');
            }
        }

        // ===== حذف طالب =====
        async function deleteStudent(studentId) {
            const student = students.find(s => s.id === studentId);
            if (!student) return;

            if (confirm(`🗑️ هل أنت متأكد من حذف الطالب "${student.name}"؟`)) {
                const deleted = await deleteStudentFromFirebase(studentId);
                if (deleted) {
                    students = students.filter(s => s.id !== studentId);
                    renderStudents();
                    alert('✅ تم حذف الطالب!');
                }
            }
        }

        // ===== تسجيل الخروج =====
        function logout() {
            if (confirm('هل أنت متأكد من تسجيل الخروج؟')) {
                localStorage.removeItem('teachflow_teacher');
                localStorage.removeItem('teachflow_user');
                localStorage.removeItem('teachflow_uid');
                window.location.href = 'index.html';
            }
        }

        // ===== تحميل الصفحة =====
        document.addEventListener('DOMContentLoaded', function() {
            const uid = localStorage.getItem('teachflow_uid');
            if (!uid) {
                window.location.href = 'index.html';
                return;
            }
            loadData();

            if (window.innerWidth > 768) {
                const sidebar = document.getElementById('sidebar');
                sidebar.classList.remove('closed');
                sidebar.classList.remove('open');
            }
        });

        window.addEventListener('resize', function() {
            const sidebar = document.getElementById('sidebar');
            if (window.innerWidth > 768) {
                sidebar.classList.remove('closed');
                sidebar.classList.remove('open');
                document.getElementById('sidebarOverlay').classList.remove('active');
            } else {
                sidebar.classList.add('closed');
                sidebar.classList.remove('open');
            }
        });
    </script>
</body>
</html>
