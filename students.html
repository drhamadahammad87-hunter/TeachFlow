<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الطلاب - TeachFlow</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, sans-serif;
        }

        body {
            background: #f0f2f5;
            min-height: 100vh;
        }

        .sidebar {
            position: fixed;
            right: 0;
            top: 0;
            width: 220px;
            height: 100vh;
            background: white;
            padding: 20px 15px;
            box-shadow: -2px 0 10px rgba(0, 0, 0, 0.05);
            overflow-y: auto;
            z-index: 100;
        }

        .logo {
            font-size: 22px;
            font-weight: 700;
            color: #667eea;
            text-align: center;
            padding-bottom: 20px;
            border-bottom: 1px solid #eee;
            margin-bottom: 15px;
        }

        .logo span {
            display: block;
            font-size: 12px;
            color: #999;
            font-weight: 400;
        }

        .sidebar-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 12px;
            border-radius: 10px;
            color: #555;
            cursor: pointer;
            transition: 0.3s;
            border: none;
            background: none;
            width: 100%;
            text-align: right;
            font-size: 14px;
        }

        .sidebar-item:hover {
            background: #f0f4ff;
            color: #667eea;
        }

        .sidebar-item.active {
            background: #667eea;
            color: white;
        }

        .main-content {
            margin-right: 220px;
            padding: 25px;
            width: 100%;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .page-header h1 {
            font-size: 26px;
            color: #333;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .page-header .actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn-add {
            padding: 10px 20px;
            background: #2ecc71;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-add:hover {
            background: #27ae60;
            transform: scale(1.02);
        }

        .btn-back {
            padding: 10px 20px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-back:hover {
            background: #5a6fd6;
            transform: scale(1.02);
        }

        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .search-box input {
            flex: 1;
            padding: 10px 14px;
            border: 2px solid #e8edf2;
            border-radius: 12px;
            font-size: 15px;
            background: white;
            transition: 0.3s;
            min-width: 200px;
        }

        .search-box input:focus {
            outline: none;
            border-color: #667eea;
        }

        .table-container {
            background: white;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
            flex: 1;
            overflow-x: auto;
        }

        .students-table {
            width: 100%;
            border-collapse: collapse;
            min-width: 700px;
        }

        .students-table th {
            background: #f8fafc;
            padding: 14px 16px;
            text-align: right;
            font-weight: 600;
            color: #555;
            font-size: 14px;
            border-bottom: 2px solid #e8edf2;
            white-space: nowrap;
        }

        .students-table td {
            padding: 12px 16px;
            border-bottom: 1px solid #f0f2f5;
            color: #333;
            font-size: 14px;
        }

        .students-table tr:hover td {
            background: #f8fafc;
        }

        .students-table .actions-cell {
            display: flex;
            gap: 8px;
        }

        .btn-edit {
            padding: 4px 12px;
            background: #f39c12;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 12px;
            transition: 0.3s;
        }

        .btn-edit:hover {
            background: #e67e22;
        }

        .btn-delete {
            padding: 4px 12px;
            background: #e74c3c;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 12px;
            transition: 0.3s;
        }

        .btn-delete:hover {
            background: #c0392b;
        }

        .badge {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
        }

        .badge-active {
            background: #eafaf1;
            color: #27ae60;
        }

        .badge-inactive {
            background: #fdedec;
            color: #e74c3c;
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: #999;
        }

        .empty-state .big-icon {
            font-size: 48px;
            display: block;
            margin-bottom: 10px;
        }

        .footer {
            text-align: center;
            margin-top: 30px;
            padding: 15px;
            color: #aaa;
            font-size: 13px;
            border-top: 1px solid #e8edf2;
            direction: ltr;
        }

        .footer .name {
            color: #667eea;
            font-weight: 600;
        }

        @media (max-width: 768px) {
            .sidebar {
                width: 60px;
                padding: 15px 8px;
            }
            .sidebar-item span:not(.icon) {
                display: none;
            }
            .sidebar-item {
                justify-content: center;
                padding: 12px;
            }
            .logo {
                font-size: 16px;
            }
            .logo span {
                display: none;
            }
            .main-content {
                margin-right: 60px;
                padding: 15px;
            }
            .page-header h1 {
                font-size: 20px;
            }
            .students-table th,
            .students-table td {
                padding: 8px 10px;
                font-size: 12px;
            }
            .btn-add {
                padding: 8px 14px;
                font-size: 12px;
            }
        }

        @media (max-width: 480px) {
            .students-table {
                font-size: 12px;
                min-width: 600px;
            }
            .students-table th,
            .students-table td {
                padding: 6px 8px;
            }
            .actions-cell {
                flex-direction: column;
                gap: 4px;
            }
        }
    </style>
</head>
<body>

    <!-- ===== القائمة الجانبية ===== -->
   <nav class="sidebar">
    <div class="logo">📚 TeachFlow <span>نظام إدارة المعلمين</span></div>

    <button class="sidebar-item" onclick="window.location.href='home.html'">🏠 <span>الرئيسية</span></button>
    <button class="sidebar-item" onclick="window.location.href='groups.html'">👥 <span>المجموعات</span></button>
    <button class="sidebar-item" onclick="window.location.href='students.html'">👨‍🎓 <span>الطلاب</span></button>
    <button class="sidebar-item" onclick="window.location.href='schedule.html'">📅 <span>الجدول</span></button>
    <button class="sidebar-item" onclick="window.location.href='attendance.html'">✅ <span>الحضور</span></button>
    <button class="sidebar-item" onclick="window.location.href='assessments.html'">📊 <span>التقييمات</span></button>
    <button class="sidebar-item" onclick="window.location.href='finances.html'">💰 <span>الحسابات</span></button>
    <button class="sidebar-item" onclick="window.location.href='student-report.html'">📈 <span>التقارير</span></button>
    <button class="sidebar-item" onclick="window.location.href='notifications.html'">🔔 <span>التنبيهات</span></button>
    <button class="sidebar-item" onclick="window.location.href='settings.html'">⚙️ <span>الإعدادات</span></button>
    <button class="sidebar-item" onclick="logout()">🚪 <span>تسجيل الخروج</span></button>
</nav>
    <!-- ===== المحتوى ===== -->
    <main class="main-content">

        <div class="page-header">
            <h1>
                👨‍🎓 الطلاب
                <span style="font-size:16px;color:#999;font-weight:400;" id="studentCountLabel">(0)</span>
            </h1>
            <div class="actions">
                <button class="btn-back" onclick="window.location.href='home.html'">🔙 رجوع</button>
                <button class="btn-add" onclick="showAddStudent()">➕ إضافة طالب</button>
            </div>
        </div>

        <div class="search-box">
            <input type="text" id="searchInput" placeholder="🔍 ابحث عن طالب..." oninput="searchStudents()">
        </div>

        <div class="table-container">
            <table class="students-table">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>👤 اسم الطالب</th>
                        <th>📚 المجموعة</th>
                        <th>📱 تليفون الطالب</th>
                        <th>📱 تليفون ولي الأمر</th>
                        <th>الحالة</th>
                        <th>⚡ المهارات</th>
                    </tr>
                </thead>
                <tbody id="studentsTableBody">
                    <!-- هتتعبأ من JavaScript -->
                </tbody>
            </table>
        </div>

        <div class="footer">
            Designed with ❤️ by <span class="name">Dr. Hamada Fathy Hammad</span>
        </div>
    </main>

    <script>
        // ===== بيانات الطلاب والمجموعات =====
        let students = [];
        let groups = [];

        // ===== تحميل الطلاب والمجموعات =====
        function loadData() {
            // تحميل المجموعات
            const savedGroups = localStorage.getItem('teachflow_groups');
            groups = savedGroups ? JSON.parse(savedGroups) : [];

            // تحميل الطلاب
            const savedStudents = localStorage.getItem('teachflow_students');
            if (savedStudents) {
                students = JSON.parse(savedStudents);
            } else {
                // بيانات وهمية للتجربة
                students = [
                    { id: 1, name: 'أحمد محمد', group: groups.length > 0 ? groups[0].name : 'الرياضيات', phone: '01001234567', parentPhone: '01009876543', active: true },
                    { id: 2, name: 'سارة علي', group: groups.length > 1 ? groups[1].name : 'العلوم', phone: '01007654321', parentPhone: '01005432187', active: true },
                    { id: 3, name: 'محمد خالد', group: groups.length > 0 ? groups[0].name : 'الرياضيات', phone: '01009876543', parentPhone: '01003216548', active: false },
                    { id: 4, name: 'فاطمة أحمد', group: groups.length > 1 ? groups[1].name : 'العلوم', phone: '01005432187', parentPhone: '01001122334', active: true }
                ];
                saveStudents();
            }
            renderStudents();
        }

        // ===== حفظ الطلاب =====
        function saveStudents() {
            localStorage.setItem('teachflow_students', JSON.stringify(students));
        }

        // ===== عرض الطلاب =====
        function renderStudents(filter = '') {
            const tbody = document.getElementById('studentsTableBody');

            let filtered = students;
            if (filter) {
                filtered = students.filter(s =>
                    s.name.includes(filter) ||
                    s.group.includes(filter) ||
                    s.phone.includes(filter) ||
                    s.parentPhone.includes(filter)
                );
            }

            if (filtered.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="7">
                            <div class="empty-state">
                                <span class="big-icon">👨‍🎓</span>
                                <p>لا يوجد طلاب</p>
                                <p style="font-size:12px;color:#ccc;">اضغط على "إضافة طالب" لإضافة أول طالب</p>
                            </div>
                        </td>
                    </tr>
                `;
            } else {
                tbody.innerHTML = filtered.map((student, index) => `
                    <tr>
                        <td>${index + 1}</td>
                        <td><strong>${student.name}</strong></td>
                        <td>${student.group}</td>
                        <td>${student.phone}</td>
                        <td>${student.parentPhone}</td>
                        <td>
                            <span class="badge ${student.active ? 'badge-active' : 'badge-inactive'}">
                                ${student.active ? '✅ نشط' : '❌ غير نشط'}
                            </span>
                        </td>
                        <td class="actions-cell">
                            <button class="btn-edit" onclick="editStudent(${student.id})">✏️ تعديل</button>
                            <button class="btn-delete" onclick="deleteStudent(${student.id})">🗑️ حذف</button>
                        </td>
                    </tr>
                `).join('');
            }

            document.getElementById('studentCountLabel').textContent = `(${students.length})`;
        }

        // ===== البحث =====
        function searchStudents() {
            const filter = document.getElementById('searchInput').value.trim();
            renderStudents(filter);
        }

        // ===== عرض قائمة المجموعات =====
        function getGroupsList() {
            return groups.map((g, i) => `${i + 1}. ${g.number || ''} - ${g.name}`).join('\n');
        }

        // ===== إضافة طالب =====
        function showAddStudent() {
            // جلب المجموعات من localStorage
            const savedGroups = localStorage.getItem('teachflow_groups');
            const groups = savedGroups ? JSON.parse(savedGroups) : [];

            if (groups.length === 0) {
                alert('⚠️ لا توجد مجموعات! الرجاء إضافة مجموعة أولاً من صفحة المجموعات.');
                return;
            }

            const name = prompt('👤 أدخل اسم الطالب:');
            if (!name) return;

            // عرض قائمة المجموعات للاختيار
            const groupOptions = groups.map((g, i) => `${i + 1}. ${g.number || ''} - ${g.name}`).join('\n');
            const groupChoice = prompt(`📚 اختر المجموعة:\n${groupOptions}\n\nأدخل رقم المجموعة:`);
            const groupIndex = parseInt(groupChoice) - 1;

            if (isNaN(groupIndex) || groupIndex < 0 || groupIndex >= groups.length) {
                alert('⚠️ اختيار غير صحيح! الرجاء إدخال رقم صحيح.');
                return;
            }

            const selectedGroup = groups[groupIndex].name;

            const phone = prompt('📱 أدخل رقم تليفون الطالب:');
            if (!phone) return;

            const parentPhone = prompt('📱 أدخل رقم تليفون ولي الأمر:');
            if (!parentPhone) return;

            const newStudent = {
                id: Date.now(),
                name: name,
                group: selectedGroup,
                phone: phone,
                parentPhone: parentPhone,
                active: true
            };

            students.push(newStudent);
            saveStudents();
            renderStudents();
            alert(`✅ تم إضافة الطالب ${name} إلى مجموعة "${selectedGroup}"`);
        }

        // ===== تعديل طالب =====
        function editStudent(id) {
            const student = students.find(s => s.id === id);
            if (!student) return;

            const name = prompt('👤 اسم الطالب:', student.name);
            if (name) student.name = name;

            // جلب المجموعات
            const savedGroups = localStorage.getItem('teachflow_groups');
            const groups = savedGroups ? JSON.parse(savedGroups) : [];

            if (groups.length > 0) {
                const groupOptions = groups.map((g, i) => `${i + 1}. ${g.number || ''} - ${g.name}`).join('\n');
                const currentGroupIndex = groups.findIndex(g => g.name === student.group) + 1;
                const groupChoice = prompt(`📚 اختر المجموعة (الحالية: ${student.group}):\n${groupOptions}\n\nأدخل رقم المجموعة:`, currentGroupIndex);
                if (groupChoice) {
                    const groupIndex = parseInt(groupChoice) - 1;
                    if (!isNaN(groupIndex) && groupIndex >= 0 && groupIndex < groups.length) {
                        student.group = groups[groupIndex].name;
                    }
                }
            }

            const phone = prompt('📱 تليفون الطالب:', student.phone);
            if (phone) student.phone = phone;

            const parentPhone = prompt('📱 تليفون ولي الأمر:', student.parentPhone);
            if (parentPhone) student.parentPhone = parentPhone;

            student.active = confirm('✅ هل الطالب نشط؟ (OK = نشط، Cancel = غير نشط)');

            saveStudents();
            renderStudents();
            alert('✅ تم تعديل بيانات الطالب!');
        }

        // ===== حذف طالب =====
        function deleteStudent(id) {
            const student = students.find(s => s.id === id);
            if (!student) return;

            if (confirm(`🗑️ هل أنت متأكد من حذف الطالب "${student.name}"؟`)) {
                students = students.filter(s => s.id !== id);
                saveStudents();
                renderStudents();
                alert('✅ تم حذف الطالب!');
            }
        }

        // ===== تسجيل الخروج =====
        function logout() {
            if (confirm('هل أنت متأكد من تسجيل الخروج؟')) {
                localStorage.removeItem('teachflow_teacher');
                localStorage.removeItem('teachflow_user');
                window.location.href = 'index.html';
            }
        }

        // ===== تحميل الصفحة =====
        document.addEventListener('DOMContentLoaded', function() {
            const teacher = localStorage.getItem('teachflow_teacher');
            if (!teacher) {
                window.location.href = 'index.html';
                return;
            }
            loadData();
        });
    </script>
</body>
</html>
