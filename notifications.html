<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>التنبيهات - TeachFlow</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, sans-serif;
        }

        body {
            background: #f0f2f5;
            min-height: 100vh;
        }

        .sidebar {
            position: fixed;
            right: 0;
            top: 0;
            width: 220px;
            height: 100vh;
            background: white;
            padding: 20px 15px;
            box-shadow: -2px 0 10px rgba(0, 0, 0, 0.05);
            overflow-y: auto;
            z-index: 100;
        }

        .logo {
            font-size: 22px;
            font-weight: 700;
            color: #667eea;
            text-align: center;
            padding-bottom: 20px;
            border-bottom: 1px solid #eee;
            margin-bottom: 15px;
        }

        .logo span {
            display: block;
            font-size: 12px;
            color: #999;
            font-weight: 400;
        }

        .sidebar-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 12px;
            border-radius: 10px;
            color: #555;
            cursor: pointer;
            transition: 0.3s;
            border: none;
            background: none;
            width: 100%;
            text-align: right;
            font-size: 14px;
        }

        .sidebar-item:hover {
            background: #f0f4ff;
            color: #667eea;
        }

        .sidebar-item.active {
            background: #667eea;
            color: white;
        }

        .sidebar-item .badge {
            background: #e74c3c;
            color: white;
            border-radius: 50%;
            padding: 2px 8px;
            font-size: 11px;
            font-weight: 600;
            margin-right: auto;
        }

        .main-content {
            margin-right: 220px;
            padding: 25px;
            width: 100%;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .page-header h1 {
            font-size: 26px;
            color: #333;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .page-header .actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn-back {
            padding: 10px 20px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-back:hover {
            background: #5a6fd6;
            transform: scale(1.02);
        }

        .btn-mark-all {
            padding: 10px 20px;
            background: #2ecc71;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-mark-all:hover {
            background: #27ae60;
            transform: scale(1.02);
        }

        .btn-clear-all {
            padding: 10px 20px;
            background: #e74c3c;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-clear-all:hover {
            background: #c0392b;
            transform: scale(1.02);
        }

        .filter-bar {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            align-items: center;
            background: white;
            padding: 16px 20px;
            border-radius: 16px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }

        .filter-bar label {
            font-weight: 500;
            color: #444;
            font-size: 14px;
        }

        .filter-bar select {
            padding: 8px 14px;
            border: 2px solid #e8edf2;
            border-radius: 10px;
            font-size: 14px;
            background: #f8fafc;
            transition: 0.3s;
            min-width: 140px;
        }

        .filter-bar select:focus {
            outline: none;
            border-color: #667eea;
            background: white;
        }

        .notifications-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            flex: 1;
        }

        .notification-item {
            background: white;
            border-radius: 16px;
            padding: 18px 22px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
            transition: 0.3s;
            display: flex;
            align-items: flex-start;
            gap: 16px;
            cursor: pointer;
            border-right: 4px solid transparent;
        }

        .notification-item:hover {
            transform: translateX(-4px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
        }

        .notification-item.unread {
            border-right-color: #667eea;
            background: #f8faff;
        }

        .notification-item .icon {
            font-size: 28px;
            flex-shrink: 0;
            width: 48px;
            height: 48px;
            background: #f0f4ff;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .notification-item .content {
            flex: 1;
        }

        .notification-item .content .title {
            font-size: 16px;
            font-weight: 600;
            color: #333;
            margin-bottom: 4px;
        }

        .notification-item .content .message {
            font-size: 14px;
            color: #666;
            margin-bottom: 6px;
        }

        .notification-item .content .meta {
            display: flex;
            gap: 16px;
            font-size: 12px;
            color: #999;
            flex-wrap: wrap;
        }

        .notification-item .content .meta .student-name {
            color: #667eea;
            font-weight: 500;
        }

        .notification-item .content .meta .status-badge {
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 500;
        }

        .notification-item .content .meta .status-badge.present {
            background: #eafaf1;
            color: #27ae60;
        }
        .notification-item .content .meta .status-badge.absent {
            background: #fdedec;
            color: #e74c3c;
        }
        .notification-item .content .meta .status-badge.late {
            background: #fef9e7;
            color: #f39c12;
        }
        .notification-item .content .meta .status-badge.excused {
            background: #ebf5fb;
            color: #3498db;
        }

        .notification-item .unread-dot {
            width: 10px;
            height: 10px;
            background: #667eea;
            border-radius: 50%;
            flex-shrink: 0;
            margin-top: 6px;
        }

        .notification-item.read .unread-dot {
            background: #ddd;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }

        .empty-state .big-icon {
            font-size: 56px;
            display: block;
            margin-bottom: 12px;
        }

        .empty-state p {
            font-size: 16px;
        }

        .footer {
            text-align: center;
            margin-top: 30px;
            padding: 15px;
            color: #aaa;
            font-size: 13px;
            border-top: 1px solid #e8edf2;
            direction: ltr;
        }

        .footer .name {
            color: #667eea;
            font-weight: 600;
        }

        @media (max-width: 768px) {
            .sidebar {
                width: 60px;
                padding: 15px 8px;
            }
            .sidebar-item span:not(.icon) {
                display: none;
            }
            .sidebar-item .badge {
                display: none;
            }
            .sidebar-item {
                justify-content: center;
                padding: 12px;
            }
            .logo {
                font-size: 16px;
            }
            .logo span {
                display: none;
            }
            .main-content {
                margin-right: 60px;
                padding: 15px;
            }
            .page-header h1 {
                font-size: 20px;
            }
            .filter-bar {
                flex-direction: column;
                align-items: stretch;
            }
            .notification-item {
                flex-wrap: wrap;
            }
        }

        @media (max-width: 480px) {
            .page-header .actions {
                flex-direction: column;
                width: 100%;
            }
            .page-header .actions button {
                width: 100%;
                justify-content: center;
            }
            .notification-item .content .meta {
                flex-direction: column;
                gap: 4px;
            }
        }
    </style>
</head>
<body>

    <!-- ===== الشريط الجانبي الموحد ===== -->
    <nav class="sidebar">
        <div class="logo">📚 TeachFlow <span>نظام إدارة المعلمين</span></div>

        <button class="sidebar-item" onclick="window.location.href='home.html'">🏠 <span>الرئيسية</span></button>
        <button class="sidebar-item" onclick="window.location.href='groups.html'">👥 <span>المجموعات</span></button>
        <button class="sidebar-item" onclick="window.location.href='students.html'">👨‍🎓 <span>الطلاب</span></button>
        <button class="sidebar-item" onclick="window.location.href='attendance.html'">✅ <span>الحضور</span></button>
        <button class="sidebar-item" onclick="window.location.href='assessments.html'">📊 <span>التقييمات</span></button>
        <button class="sidebar-item" onclick="window.location.href='finances.html'">💰 <span>الحسابات</span></button>
        <button class="sidebar-item" onclick="window.location.href='student-report.html'">📈 <span>التقارير</span></button>
        <button class="sidebar-item active" onclick="window.location.href='notifications.html'">🔔 <span>التنبيهات</span></button>
        <button class="sidebar-item" onclick="window.location.href='settings.html'">⚙️ <span>الإعدادات</span></button>
        <button class="sidebar-item" onclick="logout()">🚪 <span>تسجيل الخروج</span></button>
    </nav>

    <main class="main-content">

        <div class="page-header">
            <h1>🔔 التنبيهات والإشعارات</h1>
            <div class="actions">
                <button class="btn-back" onclick="window.location.href='home.html'">🔙 رجوع</button>
                <button class="btn-mark-all" onclick="markAllAsRead()">✅ قراءة الكل</button>
                <button class="btn-clear-all" onclick="clearAll()">🗑️ حذف الكل</button>
            </div>
        </div>

        <!-- ===== فلتر ===== -->
        <div class="filter-bar">
            <label>📋 النوع:</label>
            <select id="typeFilter" onchange="renderNotifications()">
                <option value="all">كل الإشعارات</option>
                <option value="attendance">✅ الحضور</option>
                <option value="payment">💰 المدفوعات</option>
                <option value="assessment">📊 التقييمات</option>
                <option value="reminder">⏰ تذكير</option>
                <option value="system">⚙️ النظام</option>
            </select>

            <label>📅 الحالة:</label>
            <select id="statusFilter" onchange="renderNotifications()">
                <option value="all">الكل</option>
                <option value="unread">غير مقروء</option>
                <option value="read">مقروء</option>
            </select>
        </div>

        <!-- ===== الإشعارات ===== -->
        <div class="notifications-list" id="notificationsList">
            <!-- هتتعبأ من JavaScript -->
        </div>

        <div class="footer">
            Designed with ❤️ by <span class="name">Dr. Hamada Fathy Hammad</span>
        </div>
    </main>

    <script>
        // ===== بيانات الإشعارات =====
        let notifications = [];
        let students = [];

        // ===== تحميل البيانات =====
        function loadNotifications() {
            students = JSON.parse(localStorage.getItem('teachflow_students')) || [];

            const saved = localStorage.getItem('teachflow_notifications');
            if (saved) {
                notifications = JSON.parse(saved);
            } else {
                notifications = [
                    { id: 1, type: 'attendance', title: '✅ تسجيل حضور', message: 'تم تسجيل حضور الطالب أحمد محمد', studentName: 'أحمد محمد', status: 'present', date: '2026-08-31', read: false, timestamp: '2026-08-31T10:30:00' },
                    { id: 2, type: 'attendance', title: '❌ تسجيل غياب', message: 'تم تسجيل غياب الطالب سارة علي', studentName: 'سارة علي', status: 'absent', date: '2026-08-31', read: false, timestamp: '2026-08-31T10:35:00' },
                    { id: 3, type: 'payment', title: '💰 دفعة جديدة', message: 'تم تسجيل دفعة جديدة للطالب محمد خالد بقيمة 200 EGP', studentName: 'محمد خالد', amount: 200, date: '2026-08-30', read: true, timestamp: '2026-08-30T14:20:00' },
                    { id: 4, type: 'assessment', title: '📊 تقييم جديد', message: 'تم إضافة تقييم للطالب فاطمة أحمد في مادة الرياضيات', studentName: 'فاطمة أحمد', grade: 85, date: '2026-08-29', read: false, timestamp: '2026-08-29T09:15:00' },
                    { id: 5, type: 'reminder', title: '⏰ تذكير بدرس', message: 'لديك درس مع أحمد محمد غداً الساعة 10:00 ص', studentName: 'أحمد محمد', date: '2026-09-01', read: false, timestamp: '2026-08-29T18:00:00' }
                ];
                saveNotifications();
            }

            renderNotifications();
            updateBadge();
        }

        function saveNotifications() {
            localStorage.setItem('teachflow_notifications', JSON.stringify(notifications));
        }

        function renderNotifications() {
            const list = document.getElementById('notificationsList');
            const typeFilter = document.getElementById('typeFilter').value;
            const statusFilter = document.getElementById('statusFilter').value;

            let filtered = [...notifications];

            if (typeFilter !== 'all') {
                filtered = filtered.filter(n => n.type === typeFilter);
            }

            if (statusFilter === 'unread') {
                filtered = filtered.filter(n => !n.read);
            } else if (statusFilter === 'read') {
                filtered = filtered.filter(n => n.read);
            }

            filtered.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));

            if (filtered.length === 0) {
                list.innerHTML = `
                    <div class="empty-state">
                        <span class="big-icon">🔔</span>
                        <p>لا توجد إشعارات</p>
                        <p style="font-size:12px;color:#ccc;">ستظهر الإشعارات هنا عند تسجيل الحضور أو المدفوعات</p>
                    </div>
                `;
                return;
            }

            list.innerHTML = filtered.map(notif => {
                const isUnread = !notif.read;
                const icon = getIcon(notif.type);
                const statusBadge = getStatusBadge(notif);
                const timeAgo = getTimeAgo(notif.timestamp);

                return `
                    <div class="notification-item ${isUnread ? 'unread' : 'read'}" onclick="markAsRead(${notif.id})">
                        <div class="icon">${icon}</div>
                        <div class="content">
                            <div class="title">${notif.title}</div>
                            <div class="message">${notif.message}</div>
                            <div class="meta">
                                ${notif.studentName ? `<span class="student-name">👤 ${notif.studentName}</span>` : ''}
                                ${statusBadge ? `<span>${statusBadge}</span>` : ''}
                                <span>📅 ${notif.date}</span>
                                <span>🕐 ${timeAgo}</span>
                            </div>
                        </div>
                        <div class="unread-dot"></div>
                    </div>
                `;
            }).join('');

            updateBadge();
        }

        function getIcon(type) {
            const icons = {
                'attendance': '✅',
                'payment': '💰',
                'assessment': '📊',
                'reminder': '⏰',
                'system': '⚙️'
            };
            return icons[type] || '🔔';
        }

        function getStatusBadge(notif) {
            if (notif.status) {
                const statusMap = {
                    'present': '<span class="status-badge present">✅ حاضر</span>',
                    'absent': '<span class="status-badge absent">❌ غائب</span>',
                    'late': '<span class="status-badge late">⏰ متأخر</span>',
                    'excused': '<span class="status-badge excused">📝 معذور</span>'
                };
                return statusMap[notif.status] || '';
            }
            return '';
        }

        function getTimeAgo(timestamp) {
            const now = new Date();
            const then = new Date(timestamp);
            const diff = Math.floor((now - then) / 1000);

            if (diff < 60) return 'منذ لحظات';
            if (diff < 3600) return `منذ ${Math.floor(diff / 60)} دقيقة`;
            if (diff < 86400) return `منذ ${Math.floor(diff / 3600)} ساعة`;
            if (diff < 604800) return `منذ ${Math.floor(diff / 86400)} يوم`;
            return then.toLocaleDateString('ar-EG');
        }

        function updateBadge() {
            const unread = notifications.filter(n => !n.read).length;
            const badge = document.getElementById('sidebarBadge');
            if (badge) {
                badge.textContent = unread;
                badge.style.display = unread > 0 ? 'inline' : 'none';
            }
        }

        function markAsRead(id) {
            const notif = notifications.find(n => n.id === id);
            if (notif && !notif.read) {
                notif.read = true;
                saveNotifications();
                renderNotifications();
            }
        }

        function markAllAsRead() {
            notifications.forEach(n => n.read = true);
            saveNotifications();
            renderNotifications();
            alert('✅ تم تحديد جميع الإشعارات كمقروءة');
        }

        function clearAll() {
            if (confirm('🗑️ هل أنت متأكد من حذف جميع الإشعارات؟')) {
                notifications = [];
                saveNotifications();
                renderNotifications();
                alert('✅ تم حذف جميع الإشعارات');
            }
        }

        function logout() {
            if (confirm('هل أنت متأكد من تسجيل الخروج؟')) {
                localStorage.removeItem('teachflow_teacher');
                localStorage.removeItem('teachflow_user');
                window.location.href = 'index.html';
            }
        }

        document.addEventListener('DOMContentLoaded', function() {
            const teacher = localStorage.getItem('teachflow_teacher');
            if (!teacher) {
                window.location.href = 'index.html';
                return;
            }
            loadNotifications();
        });
    </script>
</body>
</html>
