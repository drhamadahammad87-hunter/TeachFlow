<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>التقييمات - TeachFlow</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, sans-serif;
        }

        body {
            background: #f0f2f5;
            min-height: 100vh;
        }

        .sidebar {
            position: fixed;
            right: 0;
            top: 0;
            width: 220px;
            height: 100vh;
            background: white;
            padding: 20px 15px;
            box-shadow: -2px 0 10px rgba(0, 0, 0, 0.05);
            overflow-y: auto;
            z-index: 100;
        }

        .logo {
            font-size: 22px;
            font-weight: 700;
            color: #667eea;
            text-align: center;
            padding-bottom: 20px;
            border-bottom: 1px solid #eee;
            margin-bottom: 15px;
        }

        .logo span {
            display: block;
            font-size: 12px;
            color: #999;
            font-weight: 400;
        }

        .sidebar-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 12px;
            border-radius: 10px;
            color: #555;
            cursor: pointer;
            transition: 0.3s;
            border: none;
            background: none;
            width: 100%;
            text-align: right;
            font-size: 14px;
        }

        .sidebar-item:hover {
            background: #f0f4ff;
            color: #667eea;
        }

        .sidebar-item.active {
            background: #667eea;
            color: white;
        }

        .main-content {
            margin-right: 220px;
            padding: 25px;
            width: 100%;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .page-header h1 {
            font-size: 26px;
            color: #333;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .page-header .actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn-back {
            padding: 10px 20px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-back:hover {
            background: #5a6fd6;
            transform: scale(1.02);
        }

        .btn-add {
            padding: 10px 20px;
            background: #2ecc71;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-add:hover {
            background: #27ae60;
            transform: scale(1.02);
        }

        /* ===== فلتر ===== */
        .filter-bar {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            align-items: center;
            background: white;
            padding: 16px 20px;
            border-radius: 16px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }

        .filter-bar label {
            font-weight: 500;
            color: #444;
            font-size: 14px;
        }

        .filter-bar select {
            padding: 8px 14px;
            border: 2px solid #e8edf2;
            border-radius: 10px;
            font-size: 14px;
            background: #f8fafc;
            transition: 0.3s;
            min-width: 140px;
        }

        .filter-bar select:focus {
            outline: none;
            border-color: #667eea;
            background: white;
        }

        /* ===== جدول التقييمات ===== */
        .table-container {
            background: white;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
            flex: 1;
            overflow-x: auto;
        }

        .assessments-table {
            width: 100%;
            border-collapse: collapse;
            min-width: 700px;
        }

        .assessments-table th {
            background: #f8fafc;
            padding: 14px 16px;
            text-align: right;
            font-weight: 600;
            color: #555;
            font-size: 14px;
            border-bottom: 2px solid #e8edf2;
            white-space: nowrap;
        }

        .assessments-table td {
            padding: 12px 16px;
            border-bottom: 1px solid #f0f2f5;
            color: #333;
            font-size: 14px;
            vertical-align: middle;
        }

        .assessments-table tr:hover td {
            background: #f8fafc;
        }

        .grade-badge {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
        }

        .grade-excellent {
            background: #eafaf1;
            color: #27ae60;
        }
        .grade-good {
            background: #ebf5fb;
            color: #3498db;
        }
        .grade-average {
            background: #fef9e7;
            color: #f39c12;
        }
        .grade-poor {
            background: #fdedec;
            color: #e74c3c;
        }

        .assessment-type {
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 500;
            background: #f0f4ff;
            color: #667eea;
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: #999;
        }

        .empty-state .big-icon {
            font-size: 48px;
            display: block;
            margin-bottom: 10px;
        }

        .footer {
            text-align: center;
            margin-top: 30px;
            padding: 15px;
            color: #aaa;
            font-size: 13px;
            border-top: 1px solid #e8edf2;
            direction: ltr;
        }

        .footer .name {
            color: #667eea;
            font-weight: 600;
        }

        @media (max-width: 768px) {
            .sidebar {
                width: 60px;
                padding: 15px 8px;
            }
            .sidebar-item span:not(.icon) {
                display: none;
            }
            .sidebar-item {
                justify-content: center;
                padding: 12px;
            }
            .logo {
                font-size: 16px;
            }
            .logo span {
                display: none;
            }
            .main-content {
                margin-right: 60px;
                padding: 15px;
            }
            .page-header h1 {
                font-size: 20px;
            }
            .filter-bar {
                flex-direction: column;
                align-items: stretch;
            }
        }

        @media (max-width: 480px) {
            .assessments-table {
                font-size: 12px;
                min-width: 600px;
            }
            .assessments-table th,
            .assessments-table td {
                padding: 8px 10px;
            }
        }
    </style>
</head>
<body>

    <nav class="sidebar">
        <div class="logo">📚 TeachFlow <span>نظام إدارة المعلمين</span></div>
        <button class="sidebar-item" onclick="window.location.href='home.html'">🏠 <span>الرئيسية</span></button>
        <button class="sidebar-item" onclick="window.location.href='students.html'">👨‍🎓 <span>الطلاب</span></button>
        <button class="sidebar-item" onclick="window.location.href='groups.html'">👥 <span>المجموعات</span></button>
        <button class="sidebar-item" onclick="window.location.href='home.html'">📚 <span>الدروس</span></button>
        <button class="sidebar-item" onclick="window.location.href='home.html'">📅 <span>الجدول</span></button>
        <button class="sidebar-item" onclick="window.location.href='attendance.html'">✅ <span>الحضور</span></button>
        <button class="sidebar-item active" onclick="window.location.href='assessments.html'">📊 <span>التقييمات</span></button>
        <button class="sidebar-item" onclick="window.location.href='home.html'">💰 <span>الحسابات</span></button>
        <button class="sidebar-item" onclick="window.location.href='home.html'">📈 <span>التقارير</span></button>
        <button class="sidebar-item" onclick="window.location.href='notifications.html'">🔔 <span>التنبيهات</span></button>
        <button class="sidebar-item" onclick="window.location.href='home.html'">⚙️ <span>الإعدادات</span></button>
        <button class="sidebar-item" onclick="logout()">🚪 <span>تسجيل الخروج</span></button>
    </nav>

    <main class="main-content">

        <div class="page-header">
            <h1>📊 التقييمات</h1>
            <div class="actions">
                <button class="btn-back" onclick="window.location.href='home.html'">🔙 رجوع</button>
                <button class="btn-add" onclick="showAddAssessment()">➕ إضافة تقييم</button>
            </div>
        </div>

        <!-- ===== فلتر ===== -->
        <div class="filter-bar">
            <label>📚 المجموعة:</label>
            <select id="groupFilter" onchange="loadAssessments()">
                <option value="all">كل المجموعات</option>
            </select>

            <label>👤 الطالب:</label>
            <select id="studentFilter" onchange="loadAssessments()">
                <option value="all">كل الطلاب</option>
            </select>

            <label>📝 النوع:</label>
            <select id="typeFilter" onchange="loadAssessments()">
                <option value="all">كل الأنواع</option>
                <option value="واجب">📝 واجب</option>
                <option value="اختبار">📄 اختبار</option>
                <option value="مشاركة">💬 مشاركة</option>
                <option value="مشروع">📁 مشروع</option>
                <option value="أخرى">📌 أخرى</option>
            </select>
        </div>

        <!-- ===== جدول التقييمات ===== -->
        <div class="table-container">
            <table class="assessments-table">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>👤 الطالب</th>
                        <th>📚 المجموعة</th>
                        <th>📝 النوع</th>
                        <th>📊 الدرجة</th>
                        <th>📅 التاريخ</th>
                        <th>📌 الملاحظات</th>
                        <th>⚡ الإجراءات</th>
                    </tr>
                </thead>
                <tbody id="assessmentsBody">
                    <!-- هتتعبأ من JavaScript -->
                </tbody>
            </table>
        </div>

        <div class="footer">
            Designed with ❤️ by <span class="name">Dr. Hamada Fathy Hammad</span>
        </div>
    </main>

    <script>
        // ===== بيانات التقييمات =====
        let assessments = [];
        let students = [];

        // ===== تحميل البيانات =====
        function loadAssessments() {
            // تحميل الطلاب
            students = JSON.parse(localStorage.getItem('teachflow_students')) || [];

            // تحميل المجموعات في الفلتر
            loadGroupsFilter();

            // تحميل الطلاب في الفلتر
            loadStudentsFilter();

            // تحميل التقييمات
            const saved = localStorage.getItem('teachflow_assessments');
            if (saved) {
                assessments = JSON.parse(saved);
            } else {
                // بيانات وهمية للتجربة
                assessments = [
                    { id: 1, studentId: 1, type: 'واجب', grade: 85, date: '2026-08-28', notes: 'أداء جيد' },
                    { id: 2, studentId: 1, type: 'اختبار', grade: 92, date: '2026-08-20', notes: 'ممتاز' },
                    { id: 3, studentId: 2, type: 'مشاركة', grade: 78, date: '2026-08-25', notes: 'محتاج تحسين' },
                    { id: 4, studentId: 3, type: 'واجب', grade: 65, date: '2026-08-27', notes: 'يحتاج مراجعة' }
                ];
                saveAssessments();
            }

            renderAssessments();
        }

        // ===== تحميل المجموعات في الفلتر =====
        function loadGroupsFilter() {
            const groups = JSON.parse(localStorage.getItem('teachflow_groups')) || [];
            const select = document.getElementById('groupFilter');
            const currentValue = select.value;
            select.innerHTML = '<option value="all">كل المجموعات</option>';
            groups.forEach(g => {
                const option = document.createElement('option');
                option.value = g.name;
                option.textContent = g.name;
                select.appendChild(option);
            });
            select.value = currentValue;
        }

        // ===== تحميل الطلاب في الفلتر =====
        function loadStudentsFilter() {
            const select = document.getElementById('studentFilter');
            const currentValue = select.value;
            select.innerHTML = '<option value="all">كل الطلاب</option>';

            // تصفية الطلاب حسب المجموعة المختارة
            const groupFilter = document.getElementById('groupFilter').value;
            let filteredStudents = students;
            if (groupFilter !== 'all') {
                filteredStudents = students.filter(s => s.group === groupFilter);
            }

            filteredStudents.forEach(s => {
                const option = document.createElement('option');
                option.value = s.id;
                option.textContent = s.name;
                select.appendChild(option);
            });
            select.value = currentValue;
        }

        // ===== حفظ التقييمات =====
        function saveAssessments() {
            localStorage.setItem('teachflow_assessments', JSON.stringify(assessments));
        }

        // ===== عرض التقييمات =====
        function renderAssessments() {
            const tbody = document.getElementById('assessmentsBody');

            // تصفية التقييمات
            let filtered = [...assessments];

            // فلتر المجموعة
            const groupFilter = document.getElementById('groupFilter').value;
            if (groupFilter !== 'all') {
                const studentIds = students.filter(s => s.group === groupFilter).map(s => s.id);
                filtered = filtered.filter(a => studentIds.includes(a.studentId));
            }

            // فلتر الطالب
            const studentFilter = document.getElementById('studentFilter').value;
            if (studentFilter !== 'all') {
                filtered = filtered.filter(a => a.studentId == studentFilter);
            }

            // فلتر النوع
            const typeFilter = document.getElementById('typeFilter').value;
            if (typeFilter !== 'all') {
                filtered = filtered.filter(a => a.type === typeFilter);
            }

            // ترتيب من الأحدث للأقدم
            filtered.sort((a, b) => new Date(b.date) - new Date(a.date));

            if (filtered.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="8">
                            <div class="empty-state">
                                <span class="big-icon">📊</span>
                                <p>لا توجد تقييمات</p>
                                <p style="font-size:12px;color:#ccc;">اضغط على "إضافة تقييم" لإضافة أول تقييم</p>
                            </div>
                        </td>
                    </tr>
                `;
                return;
            }

            tbody.innerHTML = filtered.map((assessment, index) => {
                const student = students.find(s => s.id === assessment.studentId);
                const studentName = student ? student.name : 'طالب محذوف';
                const group = student ? student.group : '-';

                const gradeClass = assessment.grade >= 85 ? 'grade-excellent' :
                    assessment.grade >= 70 ? 'grade-good' :
                    assessment.grade >= 50 ? 'grade-average' : 'grade-poor';

                return `
                    <tr>
                        <td>${index + 1}</td>
                        <td><strong>${studentName}</strong></td>
                        <td>${group}</td>
                        <td><span class="assessment-type">${assessment.type}</span></td>
                        <td><span class="grade-badge ${gradeClass}">${assessment.grade}</span></td>
                        <td>${assessment.date}</td>
                        <td>${assessment.notes || '-'}</td>
                        <td>
                            <button class="btn-edit" onclick="editAssessment(${assessment.id})" style="padding:4px 12px;background:#f39c12;color:white;border:none;border-radius:8px;cursor:pointer;font-size:12px;margin-left:4px;">✏️</button>
                            <button class="btn-delete" onclick="deleteAssessment(${assessment.id})" style="padding:4px 12px;background:#e74c3c;color:white;border:none;border-radius:8px;cursor:pointer;font-size:12px;">🗑️</button>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        // ===== إضافة تقييم =====
        function showAddAssessment() {
            // جلب الطلاب النشطين
            const activeStudents = students.filter(s => s.active);
            if (activeStudents.length === 0) {
                alert('⚠️ لا يوجد طلاب نشطين!');
                return;
            }

            // اختيار الطالب
            let studentOptions = activeStudents.map((s, i) => `${i + 1}. ${s.name} (${s.group})`).join('\n');
            const studentChoice = prompt(`👤 اختر الطالب:\n${studentOptions}\n\nأدخل رقم الطالب:`);
            const studentIndex = parseInt(studentChoice) - 1;

            if (isNaN(studentIndex) || studentIndex < 0 || studentIndex >= activeStudents.length) {
                alert('⚠️ اختيار غير صحيح!');
                return;
            }

            const selectedStudent = activeStudents[studentIndex];

            // نوع التقييم
            const typeOptions = ['1. واجب', '2. اختبار', '3. مشاركة', '4. مشروع', '5. أخرى'];
            const typeChoice = prompt(`📝 اختر نوع التقييم:\n${typeOptions.join('\n')}\n\nأدخل رقم النوع:`);
            const typeMap = { '1': 'واجب', '2': 'اختبار', '3': 'مشاركة', '4': 'مشروع', '5': 'أخرى' };
            const type = typeMap[typeChoice] || 'أخرى';

            // الدرجة
            const grade = prompt('📊 أدخل الدرجة (0-100):');
            if (grade === null || isNaN(grade) || parseInt(grade) < 0 || parseInt(grade) > 100) {
                alert('⚠️ الرجاء إدخال درجة صحيحة بين 0 و 100');
                return;
            }

            // التاريخ
            const date = prompt('📅 أدخل التاريخ (YYYY-MM-DD):', new Date().toISOString().split('T')[0]) || new Date().toISOString().split('T')[0];

            // ملاحظات
            const notes = prompt('📌 ملاحظات (اختياري):') || '';

            const newAssessment = {
                id: Date.now(),
                studentId: selectedStudent.id,
                type: type,
                grade: parseInt(grade),
                date: date,
                notes: notes
            };

            assessments.push(newAssessment);
            saveAssessments();
            renderAssessments();
            alert(`✅ تم إضافة تقييم للطالب ${selectedStudent.name}`);
        }

        // ===== تعديل تقييم =====
        function editAssessment(id) {
            const assessment = assessments.find(a => a.id === id);
            if (!assessment) return;

            const student = students.find(s => s.id === assessment.studentId);
            const studentName = student ? student.name : 'طالب محذوف';

            const typeOptions = ['1. واجب', '2. اختبار', '3. مشاركة', '4. مشروع', '5. أخرى'];
            const typeMap = { '1': 'واجب', '2': 'اختبار', '3': 'مشاركة', '4': 'مشروع', '5': 'أخرى' };
            const currentTypeNum = Object.keys(typeMap).find(k => typeMap[k] === assessment.type) || '1';

            const typeChoice = prompt(`📝 اختر نوع التقييم (الحالي: ${assessment.type}):\n${typeOptions.join('\n')}\n\nأدخل رقم النوع:`, currentTypeNum);
            if (typeChoice && typeMap[typeChoice]) {
                assessment.type = typeMap[typeChoice];
            }

            const grade = prompt(`📊 الدرجة (الحالية: ${assessment.grade}):`, assessment.grade);
            if (grade !== null && !isNaN(grade) && parseInt(grade) >= 0 && parseInt(grade) <= 100) {
                assessment.grade = parseInt(grade);
            }

            const date = prompt(`📅 التاريخ (الحالي: ${assessment.date}):`, assessment.date);
            if (date) assessment.date = date;

            const notes = prompt(`📌 الملاحظات (الحالية: ${assessment.notes || 'لا توجد'}):`, assessment.notes || '');
            if (notes !== null) assessment.notes = notes;

            saveAssessments();
            renderAssessments();
            alert(`✅ تم تعديل تقييم الطالب ${studentName}`);
        }

        // ===== حذف تقييم =====
        function deleteAssessment(id) {
            const assessment = assessments.find(a => a.id === id);
            if (!assessment) return;

            const student = students.find(s => s.id === assessment.studentId);
            const studentName = student ? student.name : 'طالب محذوف';

            if (confirm(`🗑️ هل أنت متأكد من حذف تقييم الطالب "${studentName}"؟`)) {
                assessments = assessments.filter(a => a.id !== id);
                saveAssessments();
                renderAssessments();
                alert('✅ تم حذف التقييم!');
            }
        }

        // ===== تسجيل الخروج =====
        function logout() {
            if (confirm('هل أنت متأكد من تسجيل الخروج؟')) {
                localStorage.removeItem('teachflow_teacher');
                localStorage.removeItem('teachflow_user');
                window.location.href = 'index.html';
            }
        }

        // ===== تحميل الصفحة =====
        document.addEventListener('DOMContentLoaded', function() {
            const teacher = localStorage.getItem('teachflow_teacher');
            if (!teacher) {
                window.location.href = 'index.html';
                return;
            }
            loadAssessments();
        });
    </script>
</body>
</html>
