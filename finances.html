<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الحسابات - TeachFlow</title>
    <!-- ===== Firebase SDK ===== -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js">
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, sans-serif;
        }

        body {
            background: #f0f2f5;
            min-height: 100vh;
        }

        /* ===== Hamburger ===== */
        .hamburger {
            display: none;
            position: fixed;
            top: 15px;
            right: 15px;
            z-index: 999;
            background: #667eea;
            color: white;
            border: none;
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 24px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
        }

        .sidebar-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.4);
            z-index: 99;
        }

        .sidebar-overlay.active {
            display: block;
        }

        /* ===== Sidebar ===== */
        .sidebar {
            position: fixed;
            right: 0;
            top: 0;
            width: 220px;
            height: 100vh;
            background: white;
            padding: 20px 15px;
            box-shadow: -2px 0 10px rgba(0, 0, 0, 0.05);
            overflow-y: auto;
            z-index: 100;
            transition: transform 0.3s ease;
        }

        .sidebar .close-btn {
            display: none;
            background: none;
            border: none;
            font-size: 28px;
            color: #555;
            cursor: pointer;
            float: left;
            margin-bottom: 10px;
        }

        .logo {
            font-size: 22px;
            font-weight: 700;
            color: #667eea;
            text-align: center;
            padding-bottom: 20px;
            border-bottom: 1px solid #eee;
            margin-bottom: 15px;
        }

        .logo span {
            display: block;
            font-size: 12px;
            color: #999;
            font-weight: 400;
        }

        .sidebar-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 12px;
            border-radius: 10px;
            color: #555;
            cursor: pointer;
            transition: 0.3s;
            border: none;
            background: none;
            width: 100%;
            text-align: right;
            font-size: 14px;
        }

        .sidebar-item:hover {
            background: #f0f4ff;
            color: #667eea;
        }

        .sidebar-item.active {
            background: #667eea;
            color: white;
        }

        /* ===== Main ===== */
        .main-content {
            margin-right: 220px;
            padding: 25px;
            width: 100%;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .page-header h1 {
            font-size: 26px;
            color: #333;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .page-header .actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn-back {
            padding: 10px 20px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-back:hover {
            background: #5a6fd6;
            transform: scale(1.02);
        }

        .btn-add {
            padding: 10px 20px;
            background: #2ecc71;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-add:hover {
            background: #27ae60;
            transform: scale(1.02);
        }

        /* ===== Summary Cards ===== */
        .summary-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 16px;
            margin-bottom: 25px;
        }

        .summary-card {
            background: white;
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
            text-align: center;
        }

        .summary-card .number {
            font-size: 28px;
            font-weight: 700;
            color: #333;
        }

        .summary-card .label {
            color: #888;
            font-size: 14px;
            margin-top: 4px;
        }

        .summary-card.blue .number {
            color: #667eea;
        }
        .summary-card.green .number {
            color: #2ecc71;
        }
        .summary-card.orange .number {
            color: #f39c12;
        }
        .summary-card.red .number {
            color: #e74c3c;
        }

        /* ===== Filter ===== */
        .filter-bar {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            align-items: center;
            background: white;
            padding: 16px 20px;
            border-radius: 16px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }

        .filter-bar label {
            font-weight: 500;
            color: #444;
            font-size: 14px;
        }

        .filter-bar select,
        .filter-bar input {
            padding: 8px 14px;
            border: 2px solid #e8edf2;
            border-radius: 10px;
            font-size: 14px;
            background: #f8fafc;
            transition: 0.3s;
            min-width: 140px;
        }

        .filter-bar select:focus,
        .filter-bar input:focus {
            outline: none;
            border-color: #667eea;
            background: white;
        }

        /* ===== Table ===== */
        .table-container {
            background: white;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
            flex: 1;
            overflow-x: auto;
        }

        .finances-table {
            width: 100%;
            border-collapse: collapse;
            min-width: 800px;
        }

        .finances-table th {
            background: #f8fafc;
            padding: 14px 16px;
            text-align: right;
            font-weight: 600;
            color: #555;
            font-size: 14px;
            border-bottom: 2px solid #e8edf2;
            white-space: nowrap;
        }

        .finances-table td {
            padding: 12px 16px;
            border-bottom: 1px solid #f0f2f5;
            color: #333;
            font-size: 14px;
            vertical-align: middle;
        }

        .finances-table tr:hover td {
            background: #f8fafc;
        }

        .payment-status {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
        }

        .status-paid {
            background: #eafaf1;
            color: #27ae60;
        }
        .status-pending {
            background: #fef9e7;
            color: #f39c12;
        }
        .status-overdue {
            background: #fdedec;
            color: #e74c3c;
        }

        .payment-type {
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 500;
            background: #f0f4ff;
            color: #667eea;
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: #999;
        }

        .empty-state .big-icon {
            font-size: 48px;
            display: block;
            margin-bottom: 10px;
        }

        .footer {
            text-align: center;
            margin-top: 30px;
            padding: 15px;
            color: #aaa;
            font-size: 13px;
            border-top: 1px solid #e8edf2;
            direction: ltr;
        }

        .footer .name {
            color: #667eea;
            font-weight: 600;
        }

        /* ===== Mobile ===== */
        @media (max-width: 768px) {
            .hamburger {
                display: block;
            }

            .sidebar {
                width: 280px;
                transform: translateX(100%);
                box-shadow: -4px 0 20px rgba(0, 0, 0, 0.1);
            }

            .sidebar.open {
                transform: translateX(0);
            }

            .sidebar .close-btn {
                display: block;
            }

            .main-content {
                margin-right: 0;
                padding: 70px 15px 15px 15px;
            }

            .page-header h1 {
                font-size: 20px;
            }

            .filter-bar {
                flex-direction: column;
                align-items: stretch;
            }

            .summary-cards {
                grid-template-columns: 1fr 1fr;
            }

            .finances-table {
                font-size: 12px;
                min-width: 700px;
            }

            .finances-table th,
            .finances-table td {
                padding: 8px 10px;
            }

            .btn-back,
            .btn-add {
                font-size: 12px;
                padding: 6px 12px;
            }
        }

        @media (max-width: 480px) {
            .finances-table {
                font-size: 11px;
                min-width: 600px;
            }

            .finances-table th,
            .finances-table td {
                padding: 6px 8px;
            }

            .summary-cards {
                grid-template-columns: 1fr 1fr;
            }

            .summary-card {
                padding: 12px 10px;
            }

            .summary-card .number {
                font-size: 20px;
            }

            .summary-card .label {
                font-size: 12px;
            }

            .page-header .actions {
                flex-direction: column;
                width: 100%;
            }

            .page-header .actions button {
                width: 100%;
                justify-content: center;
            }

            .hamburger {
                font-size: 20px;
                padding: 8px 12px;
                top: 10px;
                right: 10px;
            }

            .sidebar {
                width: 260px;
            }
        }
    </style>
</head>
<body>

    <!-- ===== Hamburger ===== -->
    <button class="hamburger" onclick="toggleSidebar()">☰</button>
    <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

    <!-- ===== Sidebar ===== -->
    <nav class="sidebar" id="sidebar">
        <button class="close-btn" onclick="toggleSidebar()">✕</button>
        <div class="logo">📚 TeachFlow <span>نظام إدارة المعلمين</span></div>

        <button class="sidebar-item" onclick="window.location.href='home.html'">🏠 <span>الرئيسية</span></button>
        <button class="sidebar-item" onclick="window.location.href='groups.html'">👥 <span>المجموعات</span></button>
        <button class="sidebar-item" onclick="window.location.href='students.html'">👨‍🎓 <span>الطلاب</span></button>
        <button class="sidebar-item" onclick="window.location.href='schedule.html'">📅 <span>الجدول</span></button>
        <button class="sidebar-item" onclick="window.location.href='attendance.html'">✅ <span>الحضور</span></button>
        <button class="sidebar-item" onclick="window.location.href='assessments.html'">📊 <span>التقييمات</span></button>
        <button class="sidebar-item active" onclick="window.location.href='finances.html'">💰 <span>الحسابات</span></button>
        <button class="sidebar-item" onclick="window.location.href='student-report.html'">📈 <span>التقارير</span></button>
        <button class="sidebar-item" onclick="window.location.href='notifications.html'">🔔 <span>التنبيهات</span></button>
        <button class="sidebar-item" onclick="window.location.href='settings.html'">⚙️ <span>الإعدادات</span></button>
        <button class="sidebar-item" onclick="logout()">🚪 <span>تسجيل الخروج</span></button>
    </nav>

    <!-- ===== Main ===== -->
    <main class="main-content">

        <div class="page-header">
            <h1>💰 الحسابات</h1>
            <div class="actions">
                <button class="btn-back" onclick="window.location.href='home.html'">🔙 رجوع</button>
                <button class="btn-add" onclick="showAddPayment()">➕ إضافة دفعة</button>
            </div>
        </div>

        <!-- ===== Summary ===== -->
        <div class="summary-cards">
            <div class="summary-card blue">
                <div class="number" id="totalAmount">0</div>
                <div class="label">💰 إجمالي المدفوعات</div>
            </div>
            <div class="summary-card green">
                <div class="number" id="paidAmount">0</div>
                <div class="label">✅ المدفوع</div>
            </div>
            <div class="summary-card orange">
                <div class="number" id="pendingAmount">0</div>
                <div class="label">⏳ المتبقي</div>
            </div>
            <div class="summary-card red">
                <div class="number" id="overdueCount">0</div>
                <div class="label">⚠️ متأخرات</div>
            </div>
        </div>

        <!-- ===== Filter ===== -->
        <div class="filter-bar">
            <label>👤 الطالب:</label>
            <select id="studentFilter" onchange="loadFinances()">
                <option value="all">كل الطلاب</option>
            </select>

            <label>📅 الشهر:</label>
            <select id="monthFilter" onchange="loadFinances()">
                <option value="all">كل الشهور</option>
                <option value="1">يناير</option>
                <option value="2">فبراير</option>
                <option value="3">مارس</option>
                <option value="4">أبريل</option>
                <option value="5">مايو</option>
                <option value="6">يونيو</option>
                <option value="7">يوليو</option>
                <option value="8">أغسطس</option>
                <option value="9">سبتمبر</option>
                <option value="10">أكتوبر</option>
                <option value="11">نوفمبر</option>
                <option value="12">ديسمبر</option>
            </select>

            <label>📋 النوع:</label>
            <select id="typeFilter" onchange="loadFinances()">
                <option value="all">كل الأنواع</option>
                <option value="lesson">📚 بالحصة</option>
                <option value="month">📅 بالشهر</option>
            </select>

            <label>✅ الحالة:</label>
            <select id="statusFilter" onchange="loadFinances()">
                <option value="all">كل الحالات</option>
                <option value="paid">✅ مدفوع</option>
                <option value="pending">⏳ متبقي</option>
                <option value="overdue">⚠️ متأخر</option>
            </select>
        </div>

        <!-- ===== Table ===== -->
        <div class="table-container">
            <table class="finances-table">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>👤 الطالب</th>
                        <th>📚 المجموعة</th>
                        <th>📋 النوع</th>
                        <th>💵 المبلغ</th>
                        <th>✅ الحالة</th>
                        <th>📅 التاريخ</th>
                        <th>📌 ملاحظات</th>
                        <th>⚡ الإجراءات</th>
                    </tr>
                </thead>
                <tbody id="financesBody">
                    <!-- هتتعبأ من JavaScript -->
                </tbody>
            </table>
        </div>

        <div class="footer">
            Designed with ❤️ by <span class="name">Dr. Hamada Fathy Hammad</span>
        </div>
    </main>

    <script>
        // ===== Firebase Config =====
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT.firebaseapp.com",
            projectId: "YOUR_PROJECT",
            storageBucket: "YOUR_PROJECT.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // ===== العملات =====
        const currencies = {
            EGP: { symbol: 'EGP', rate: 1 },
            USD: { symbol: 'USD', rate: 0.032 },
            SAR: { symbol: 'SAR', rate: 0.12 },
            AED: { symbol: 'AED', rate: 0.12 }
        };

        // ===== Sidebar Toggle =====
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebarOverlay');

            sidebar.classList.toggle('closed');
            sidebar.classList.toggle('open');
            overlay.classList.toggle('active');

            if (window.innerWidth <= 768) {
                document.querySelectorAll('.sidebar-item').forEach(item => {
                    item.addEventListener('click', function() {
                        setTimeout(() => {
                            sidebar.classList.add('closed');
                            sidebar.classList.remove('open');
                            overlay.classList.remove('active');
                        }, 300);
                    });
                });
            }
        }

        // ===== بيانات المدفوعات =====
        let payments = [];
        let students = [];
        let groups = [];

        // ===== تحميل البيانات من Firebase =====
        async function loadFinances() {
            const uid = localStorage.getItem('teachflow_uid');
            if (!uid) {
                window.location.href = 'index.html';
                return;
            }

            try {
                // جلب المجموعات
                const groupsSnapshot = await db.collection('teachers').doc(uid).collection('groups').get();
                groups = [];
                groupsSnapshot.forEach(doc => {
                    groups.push({ id: doc.id, ...doc.data() });
                });

                // جلب الطلاب
                const studentsSnapshot = await db.collection('teachers').doc(uid).collection('students').get();
                students = [];
                studentsSnapshot.forEach(doc => {
                    students.push({ id: doc.id, ...doc.data() });
                });
                loadStudentsFilter();

                // جلب المدفوعات
                const paymentsSnapshot = await db.collection('teachers').doc(uid).collection('payments').get();
                payments = [];
                paymentsSnapshot.forEach(doc => {
                    payments.push({ id: doc.id, ...doc.data() });
                });

                renderFinances();
                updateSummary();

            } catch (error) {
                console.error('❌ خطأ في تحميل البيانات:', error);
                payments = [];
                renderFinances();
                updateSummary();
            }
        }

        // ===== تحميل الطلاب في الفلتر =====
        function loadStudentsFilter() {
            const select = document.getElementById('studentFilter');
            const currentValue = select.value;
            select.innerHTML = '<option value="all">كل الطلاب</option>';
            students.forEach(s => {
                const option = document.createElement('option');
                option.value = s.id;
                option.textContent = s.name;
                select.appendChild(option);
            });
            select.value = currentValue;
        }

        // ===== حفظ دفعة في Firebase =====
        async function savePaymentToFirebase(paymentData) {
            const uid = localStorage.getItem('teachflow_uid');
            if (!uid) return;

            try {
                const docRef = await db.collection('teachers').doc(uid).collection('payments').add(paymentData);
                return docRef.id;
            } catch (error) {
                console.error('❌ خطأ في حفظ الدفعة:', error);
                alert('❌ حدث خطأ أثناء حفظ الدفعة');
                return null;
            }
        }

        // ===== تحديث دفعة في Firebase =====
        async function updatePaymentInFirebase(paymentId, paymentData) {
            const uid = localStorage.getItem('teachflow_uid');
            if (!uid) return;

            try {
                await db.collection('teachers').doc(uid).collection('payments').doc(paymentId).update(paymentData);
                return true;
            } catch (error) {
                console.error('❌ خطأ في تحديث الدفعة:', error);
                alert('❌ حدث خطأ أثناء تحديث الدفعة');
                return false;
            }
        }

        // ===== حذف دفعة من Firebase =====
        async function deletePaymentFromFirebase(paymentId) {
            const uid = localStorage.getItem('teachflow_uid');
            if (!uid) return;

            try {
                await db.collection('teachers').doc(uid).collection('payments').doc(paymentId).delete();
                return true;
            } catch (error) {
                console.error('❌ خطأ في حذف الدفعة:', error);
                alert('❌ حدث خطأ أثناء حذف الدفعة');
                return false;
            }
        }

        // ===== عرض المدفوعات =====
        function renderFinances() {
            const tbody = document.getElementById('financesBody');

            let filtered = [...payments];

            const studentFilter = document.getElementById('studentFilter').value;
            if (studentFilter !== 'all') {
                filtered = filtered.filter(p => p.studentId == studentFilter);
            }

            const monthFilter = document.getElementById('monthFilter').value;
            if (monthFilter !== 'all') {
                filtered = filtered.filter(p => {
                    const month = new Date(p.date).getMonth() + 1;
                    return month == monthFilter;
                });
            }

            const typeFilter = document.getElementById('typeFilter').value;
            if (typeFilter !== 'all') {
                filtered = filtered.filter(p => p.type === typeFilter);
            }

            const statusFilter = document.getElementById('statusFilter').value;
            if (statusFilter !== 'all') {
                filtered = filtered.filter(p => p.status === statusFilter);
            }

            filtered.sort((a, b) => new Date(b.date) - new Date(a.date));

            if (filtered.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="9">
                            <div class="empty-state">
                                <span class="big-icon">💰</span>
                                <p>لا توجد مدفوعات</p>
                                <p style="font-size:12px;color:#ccc;">اضغط على "إضافة دفعة" لإضافة أول دفعة</p>
                            </div>
                        </td>
                    </tr>
                `;
                return;
            }

            // جلب العملة المختارة من الإعدادات
            const currency = localStorage.getItem('teachflow_currency') || 'EGP';
            const currencySymbol = currencies[currency]?.symbol || 'EGP';

            tbody.innerHTML = filtered.map((payment, index) => {
                const student = students.find(s => s.id === payment.studentId);
                const studentName = student ? student.name : 'طالب محذوف';
                const group = student ? student.group : '-';

                const statusClass = payment.status === 'paid' ? 'status-paid' :
                    payment.status === 'pending' ? 'status-pending' : 'status-overdue';
                const statusText = payment.status === 'paid' ? '✅ مدفوع' :
                    payment.status === 'pending' ? '⏳ متبقي' : '⚠️ متأخر';

                const typeText = payment.type === 'lesson' ? '📚 بالحصة' : '📅 بالشهر';
                const isOverdue = payment.status === 'overdue';

                return `
                    <tr ${isOverdue ? 'style="background:#fff5f5;"' : ''}>
                        <td>${index + 1}</td>
                        <td><strong>${studentName}</strong></td>
                        <td>${group}</td>
                        <td><span class="payment-type">${typeText}</span></td>
                        <td><strong>${payment.amount} ${currencySymbol}</strong></td>
                        <td><span class="payment-status ${statusClass}">${statusText}</span></td>
                        <td>${payment.date}</td>
                        <td>${payment.notes || '-'}</td>
                        <td>
                            <button class="btn-edit" onclick="editPayment('${payment.id}')" style="padding:4px 12px;background:#f39c12;color:white;border:none;border-radius:8px;cursor:pointer;font-size:12px;margin-left:4px;">✏️</button>
                            <button class="btn-delete" onclick="deletePayment('${payment.id}')" style="padding:4px 12px;background:#e74c3c;color:white;border:none;border-radius:8px;cursor:pointer;font-size:12px;">🗑️</button>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        // ===== تحديث الملخص =====
        function updateSummary() {
            let total = 0,
                paid = 0,
                pending = 0,
                overdue = 0;

            payments.forEach(p => {
                total += p.amount;
                if (p.status === 'paid') paid += p.amount;
                else if (p.status === 'pending') pending += p.amount;
                else if (p.status === 'overdue') overdue += p.amount;
            });

            const currency = localStorage.getItem('teachflow_currency') || 'EGP';
            const currencySymbol = currencies[currency]?.symbol || 'EGP';

            document.getElementById('totalAmount').textContent = total + ' ' + currencySymbol;
            document.getElementById('paidAmount').textContent = paid + ' ' + currencySymbol;
            document.getElementById('pendingAmount').textContent = pending + ' ' + currencySymbol;

            const overdueCount = payments.filter(p => p.status === 'overdue').length;
            document.getElementById('overdueCount').textContent = overdueCount;
        }

        // ===== إضافة دفعة =====
        async function showAddPayment() {
            const uid = localStorage.getItem('teachflow_uid');
            if (!uid) return;

            // جلب الطلاب النشطين
            const studentsSnapshot = await db.collection('teachers').doc(uid).collection('students')
                .where('active', '==', true).get();
            const activeStudents = [];
            studentsSnapshot.forEach(doc => {
                activeStudents.push({ id: doc.id, ...doc.data() });
            });

            if (activeStudents.length === 0) {
                alert('⚠️ لا يوجد طلاب نشطين!');
                return;
            }

            let studentOptions = activeStudents.map((s, i) => `${i + 1}. ${s.name} (${s.group})`).join('\n');
            const studentChoice = prompt(`👤 اختر الطالب:\n${studentOptions}\n\nأدخل رقم الطالب:`);
            const studentIndex = parseInt(studentChoice) - 1;

            if (isNaN(studentIndex) || studentIndex < 0 || studentIndex >= activeStudents.length) {
                alert('⚠️ اختيار غير صحيح!');
                return;
            }

            const selectedStudent = activeStudents[studentIndex];

            const typeOptions = ['1. 📚 بالحصة', '2. 📅 بالشهر'];
            const typeChoice = prompt(`📋 اختر نوع الدفعة:\n${typeOptions.join('\n')}\n\nأدخل رقم النوع:`);
            const typeMap = { '1': 'lesson', '2': 'month' };
            const type = typeMap[typeChoice] || 'month';

            const amount = prompt('💵 أدخل المبلغ:');
            if (amount === null || isNaN(amount) || parseInt(amount) <= 0) {
                alert('⚠️ الرجاء إدخال مبلغ صحيح');
                return;
            }

            const statusOptions = ['1. ✅ مدفوع', '2. ⏳ متبقي', '3. ⚠️ متأخر'];
            const statusChoice = prompt(`✅ اختر الحالة:\n${statusOptions.join('\n')}\n\nأدخل رقم الحالة:`);
            const statusMap = { '1': 'paid', '2': 'pending', '3': 'overdue' };
            const status = statusMap[statusChoice] || 'pending';

            const date = prompt('📅 أدخل التاريخ (YYYY-MM-DD):', new Date().toISOString().split('T')[0]) || new Date().toISOString().split('T')[0];
            const notes = prompt('📌 ملاحظات (اختياري):') || '';

            const newPayment = {
                studentId: selectedStudent.id,
                type: type,
                amount: parseInt(amount),
                status: status,
                date: date,
                notes: notes,
                addedAt: new Date().toISOString()
            };

            const docId = await savePaymentToFirebase(newPayment);
            if (docId) {
                newPayment.id = docId;
                payments.push(newPayment);
                renderFinances();
                updateSummary();
                alert(`✅ تم إضافة دفعة للطالب ${selectedStudent.name}`);
            }
        }

        // ===== تعديل دفعة =====
        async function editPayment(paymentId) {
            const payment = payments.find(p => p.id === paymentId);
            if (!payment) return;

            const student = students.find(s => s.id === payment.studentId);
            const studentName = student ? student.name : 'طالب محذوف';

            const typeOptions = ['1. 📚 بالحصة', '2. 📅 بالشهر'];
            const currentTypeNum = payment.type === 'lesson' ? '1' : '2';
            const typeChoice = prompt(`📋 اختر نوع الدفعة (الحالي: ${payment.type === 'lesson' ? 'بالحصة' : 'بالشهر'}):\n${typeOptions.join('\n')}\n\nأدخل رقم النوع:`, currentTypeNum);
            const typeMap = { '1': 'lesson', '2': 'month' };
            if (typeChoice && typeMap[typeChoice]) {
                payment.type = typeMap[typeChoice];
            }

            const amount = prompt(`💵 المبلغ (الحالي: ${payment.amount}):`, payment.amount);
            if (amount !== null && !isNaN(amount) && parseInt(amount) > 0) {
                payment.amount = parseInt(amount);
            }

            const statusOptions = ['1. ✅ مدفوع', '2. ⏳ متبقي', '3. ⚠️ متأخر'];
            const currentStatusNum = { 'paid': '1', 'pending': '2', 'overdue': '3' } [payment.status] || '2';
            const statusChoice = prompt(`✅ اختر الحالة (الحالية: ${payment.status}):\n${statusOptions.join('\n')}\n\nأدخل رقم الحالة:`, currentStatusNum);
            const statusMap = { '1': 'paid', '2': 'pending', '3': 'overdue' };
            if (statusChoice && statusMap[statusChoice]) {
                payment.status = statusMap[statusChoice];
            }

            const date = prompt(`📅 التاريخ (الحالي: ${payment.date}):`, payment.date);
            if (date) payment.date = date;

            const notes = prompt(`📌 الملاحظات (الحالية: ${payment.notes || 'لا توجد'}):`, payment.notes || '');
            if (notes !== null) payment.notes = notes;

            const updated = await updatePaymentInFirebase(paymentId, {
                type: payment.type,
                amount: payment.amount,
                status: payment.status,
                date: payment.date,
                notes: payment.notes
            });

            if (updated) {
                renderFinances();
                updateSummary();
                alert(`✅ تم تعديل دفعة الطالب ${studentName}`);
            }
        }

        // ===== حذف دفعة =====
        async function deletePayment(paymentId) {
            const payment = payments.find(p => p.id === paymentId);
            if (!payment) return;

            const student = students.find(s => s.id === payment.studentId);
            const studentName = student ? student.name : 'طالب محذوف';

            if (confirm(`🗑️ هل أنت متأكد من حذف دفعة الطالب "${studentName}"؟`)) {
                const deleted = await deletePaymentFromFirebase(paymentId);
                if (deleted) {
                    payments = payments.filter(p => p.id !== paymentId);
                    renderFinances();
                    updateSummary();
                    alert('✅ تم حذف الدفعة!');
                }
            }
        }

        // ===== تسجيل الخروج =====
        function logout() {
            if (confirm('هل أنت متأكد من تسجيل الخروج؟')) {
                localStorage.removeItem('teachflow_teacher');
                localStorage.removeItem('teachflow_user');
                localStorage.removeItem('teachflow_uid');
                window.location.href = 'index.html';
            }
        }

        document.addEventListener('DOMContentLoaded', function() {
            const uid = localStorage.getItem('teachflow_uid');
            if (!uid) {
                window.location.href = 'index.html';
                return;
            }
            loadFinances();

            if (window.innerWidth > 768) {
                const sidebar = document.getElementById('sidebar');
                sidebar.classList.remove('closed');
                sidebar.classList.remove('open');
            }
        });

        window.addEventListener('resize', function() {
            const sidebar = document.getElementById('sidebar');
            if (window.innerWidth > 768) {
                sidebar.classList.remove('closed');
                sidebar.classList.remove('open');
                document.getElementById('sidebarOverlay').classList.remove('active');
            } else {
                sidebar.classList.add('closed');
                sidebar.classList.remove('open');
            }
        });
    </script>
</body>
</html>
