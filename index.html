<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل المعلم - TeachFlow</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .register-container {
            width: 100%;
            max-width: 500px;
        }

        .register-box {
            background: white;
            border-radius: 24px;
            padding: 40px 35px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .register-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .register-header h1 {
            font-size: 32px;
            color: #333;
            margin-bottom: 5px;
        }

        .register-header p {
            color: #888;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-weight: 500;
            color: #444;
            margin-bottom: 5px;
            font-size: 14px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 14px;
            border: 2px solid #e8edf2;
            border-radius: 12px;
            font-size: 15px;
            background: #f8fafc;
            transition: 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
            background: white;
        }

        .form-group .hint {
            font-size: 12px;
            color: #999;
            margin-top: 4px;
        }

        /* ===== اختيار اللغة ===== */
        .language-options {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
        }

        .lang-option {
            padding: 10px 16px;
            border: 2px solid #e8edf2;
            border-radius: 12px;
            text-align: center;
            cursor: pointer;
            transition: 0.3s;
            background: #f8fafc;
            font-size: 14px;
            font-weight: 500;
            flex: 1;
            min-width: 60px;
        }

        .lang-option:hover {
            border-color: #667eea;
            background: #f0f4ff;
        }

        .lang-option.selected {
            border-color: #667eea;
            background: #667eea;
            color: white;
        }

        .lang-option .flag {
            font-size: 22px;
            display: block;
            margin-bottom: 2px;
        }

        .lang-select-wrapper {
            flex: 0 0 auto;
            position: relative;
        }

        .lang-select-wrapper select {
            padding: 10px 14px;
            border: 2px solid #e8edf2;
            border-radius: 12px;
            font-size: 14px;
            background: #f8fafc;
            cursor: pointer;
            outline: none;
            transition: 0.3s;
            appearance: none;
            -webkit-appearance: none;
            min-width: 120px;
        }

        .lang-select-wrapper select:focus {
            border-color: #667eea;
            background: white;
        }

        .lang-select-wrapper::after {
            content: '▼';
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: #999;
            font-size: 12px;
            pointer-events: none;
        }

        /* ===== المواد ===== */
        .subjects-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .subject-item {
            padding: 8px 12px;
            border: 2px solid #e8edf2;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.3s;
            background: #f8fafc;
            text-align: center;
            font-size: 13px;
        }

        .subject-item:hover {
            border-color: #667eea;
            background: #f0f4ff;
        }

        .subject-item.selected {
            border-color: #2ecc71;
            background: #eafaf1;
            color: #27ae60;
        }

        /* ===== إضافة مادة ===== */
        .custom-row {
            display: flex;
            gap: 10px;
            margin-top: 8px;
        }

        .custom-row input {
            flex: 1;
            padding: 10px 14px;
            border: 2px solid #e8edf2;
            border-radius: 10px;
            font-size: 14px;
            background: #f8fafc;
            outline: none;
            transition: 0.3s;
        }

        .custom-row input:focus {
            border-color: #667eea;
            background: white;
        }

        .custom-row button {
            padding: 10px 18px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: 0.3s;
            white-space: nowrap;
        }

        .custom-row button:hover {
            background: #5a6fd6;
        }

        /* ===== المواد المختارة ===== */
        .selected-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 10px;
        }

        .selected-tag {
            background: #667eea;
            color: white;
            padding: 5px 14px;
            border-radius: 20px;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .selected-tag .remove {
            cursor: pointer;
            font-weight: 700;
            opacity: 0.7;
        }

        .selected-tag .remove:hover {
            opacity: 1;
        }

        /* ===== زر التسجيل ===== */
        .btn-register {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #2ecc71, #27ae60);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
        }

        .btn-register:hover {
            transform: scale(1.02);
            box-shadow: 0 8px 25px rgba(46, 204, 113, 0.4);
        }

        .btn-register:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        /* ===== رسائل الخطأ ===== */
        .error-msg {
            color: #e74c3c;
            font-size: 13px;
            text-align: center;
            margin-top: 10px;
            display: none;
        }

        .error-msg.show {
            display: block;
        }

        @media (max-width: 480px) {
            .register-box {
                padding: 25px 18px;
            }
            .language-options {
                flex-direction: column;
            }
            .lang-select-wrapper select {
                width: 100%;
            }
            .subjects-grid {
                grid-template-columns: 1fr 1fr;
            }
            .custom-row {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="register-container">
        <div class="register-box">
            <div class="register-header">
                <h1 id="pageTitle">📚 TeachFlow</h1>
                <p id="pageSubtitle">تسجيل المعلم الجديد</p>
            </div>

            <form id="registerForm">
                <!-- ===== اسم المعلم ===== -->
                <div class="form-group">
                    <label id="nameLabel">👨‍🏫 اسم المعلم</label>
                    <input type="text" id="teacherName" placeholder="أدخل اسمك بالكامل" required>
                </div>

                <!-- ===== البريد الإلكتروني ===== -->
                <div class="form-group">
                    <label id="emailLabel">📧 البريد الإلكتروني</label>
                    <input type="email" id="email" placeholder="teacher@example.com" required>
                </div>

                <!-- ===== كلمة المرور ===== -->
                <div class="form-group">
                    <label id="passwordLabel">🔒 كلمة المرور</label>
                    <input type="password" id="password" placeholder="••••••••" required>
                    <div class="hint" id="passwordHint">يجب أن تكون 6 أحرف على الأقل</div>
                </div>

                <!-- ===== تأكيد كلمة المرور ===== -->
                <div class="form-group">
                    <label id="confirmLabel">🔒 تأكيد كلمة المرور</label>
                    <input type="password" id="confirmPassword" placeholder="••••••••" required>
                </div>

                <!-- ===== اختيار اللغة ===== -->
                <div class="form-group">
                    <label id="languageLabel">🌍 اللغة</label>
                    <div class="language-options">
                        <div class="lang-option selected" data-lang="ar" onclick="selectLanguage('ar')">
                            <span class="flag">🇸🇦</span>
                            العربية
                        </div>
                        <div class="lang-option" data-lang="en" onclick="selectLanguage('en')">
                            <span class="flag">🇬🇧</span>
                            English
                        </div>
                        <div class="lang-select-wrapper">
                            <select id="otherLangSelect" onchange="selectLanguage(this.value)">
                                <option value="">🌍 أخرى...</option>
                                <option value="fr">🇫🇷 Français</option>
                                <option value="tr">🇹🇷 Türkçe</option>
                                <option value="es">🇪🇸 Español</option>
                                <option value="de">🇩🇪 Deutsch</option>
                                <option value="it">🇮🇹 Italiano</option>
                                <option value="pt">🇵🇹 Português</option>
                                <option value="ru">🇷🇺 Русский</option>
                                <option value="zh">🇨🇳 中文</option>
                                <option value="ja">🇯🇵 日本語</option>
                                <option value="ko">🇰🇷 한국어</option>
                                <option value="hi">🇮🇳 हिन्दी</option>
                                <option value="ur">🇵🇰 اردو</option>
                            </select>
                        </div>
                    </div>
                </div>

                <!-- ===== اختيار المواد ===== -->
                <div class="form-group">
                    <label id="subjectLabel">📚 مادة التدريس</label>
                    <div class="subjects-grid" id="subjectsGrid">
                        <!-- هتتعبأ من JavaScript -->
                    </div>

                    <div class="custom-row">
                        <input type="text" id="customSubject" placeholder="✏️ اكتب مادة جديدة...">
                        <button type="button" id="addBtn" onclick="addCustomSubject()">➕ إضافة</button>
                    </div>

                    <div class="selected-tags" id="selectedSubjects">
                        <span id="noSubjectMsg" style="color:#999;font-size:13px;">⚠️ لم تختار أي مادة بعد</span>
                    </div>
                </div>

                <button type="submit" class="btn-register" id="registerBtn" disabled>
                    🚀 تسجيل ودخول
                </button>

                <div class="error-msg" id="errorMsg"></div>
            </form>
        </div>
    </div>

        // ===== متغيرات =====
        let currentLang = 'ar';
        let selectedSubjects = [];

        // ===== المواد الأساسية (مفاتيح) =====
        const subjectKeys = ['math', 'arabic', 'english', 'science', 'history', 'geography', 'physics', 'chemistry', 'biology', 'philosophy'];

        // ===== تغيير اللغة =====
        function selectLanguage(lang) {
            if (!lang || lang === '') return;
            currentLang = lang;

            document.querySelectorAll('.lang-option').forEach(el => {
                el.classList.toggle('selected', el.dataset.lang === lang);
            });
            document.getElementById('otherLangSelect').value = lang;

            if (lang === 'ar' || lang === 'ur') {
                document.dir = 'rtl';
                document.documentElement.lang = lang;
            } else {
                document.dir = 'ltr';
                document.documentElement.lang = lang;
            }

            applyTranslation(lang);
            renderSubjects(lang);
        }

        // ===== تطبيق الترجمة =====
        function applyTranslation(lang) {
            const t = translations[lang];
            if (!t) return;

            document.getElementById('pageTitle').textContent = t.title;
            document.getElementById('pageSubtitle').textContent = t.subtitle;
            document.getElementById('nameLabel').textContent = t.nameLabel;
            document.getElementById('teacherName').placeholder = t.namePlaceholder;
            document.getElementById('emailLabel').textContent = t.emailLabel;
            document.getElementById('email').placeholder = t.emailPlaceholder;
            document.getElementById('passwordLabel').textContent = t.passwordLabel;
            document.getElementById('password').placeholder = t.passwordPlaceholder;
            document.getElementById('confirmLabel').textContent = t.confirmLabel;
            document.getElementById('confirmPassword').placeholder = t.confirmPlaceholder;
            document.getElementById('passwordHint').textContent = t.passwordHint;
            document.getElementById('languageLabel').textContent = t.languageLabel;
            document.getElementById('subjectLabel').textContent = t.subjectLabel;
            document.getElementById('customSubject').placeholder = t.subjectPlaceholder;
            document.getElementById('addBtn').textContent = t.addBtn;
            document.getElementById('registerBtn').textContent = t.registerBtn;
            document.getElementById('noSubjectMsg').textContent = t.noSubject;
        }

        // ===== عرض المواد حسب اللغة =====
        function renderSubjects(lang) {
            const t = translations[lang];
            if (!t) return;

            const grid = document.getElementById('subjectsGrid');
            grid.innerHTML = '';

            subjectKeys.forEach(key => {
                const div = document.createElement('div');
                div.className = 'subject-item';
                div.dataset.subject = key;
                div.textContent = t.subjects[key] || key;
                div.onclick = function() { toggleSubject(this, key); };
                grid.appendChild(div);
            });

            // إعادة تحديد المواد المختارة
            document.querySelectorAll('.subject-item').forEach(el => {
                if (selectedSubjects.includes(el.dataset.subject)) {
                    el.classList.add('selected');
                }
            });
        }

        // ===== اختيار مادة =====
        function toggleSubject(element, key) {
            const index = selectedSubjects.indexOf(key);
            if (index > -1) {
                selectedSubjects.splice(index, 1);
                element.classList.remove('selected');
            } else {
                selectedSubjects.push(key);
                element.classList.add('selected');
            }
            updateSelectedTags();
        }

        // ===== إضافة مادة مخصصة =====
        function addCustomSubject() {
            const input = document.getElementById('customSubject');
            const subject = input.value.trim();
            const t = translations[currentLang];

            if (!subject) {
                alert(t.alertSubject);
                return;
            }

            if (selectedSubjects.includes(subject)) {
                alert(t.alertDuplicate);
                input.value = '';
                return;
            }

            selectedSubjects.push(subject);
            input.value = '';

            const grid = document.getElementById('subjectsGrid');
            const newItem = document.createElement('div');
            newItem.className = 'subject-item selected';
            newItem.dataset.subject = subject;
            newItem.textContent = '📌 ' + subject;
            newItem.onclick = function() { toggleSubject(this, subject); };
            grid.appendChild(newItem);

            updateSelectedTags();
        }

        // ===== تحديث المواد المختارة =====
        function updateSelectedTags() {
            const container = document.getElementById('selectedSubjects');
            container.innerHTML = '';
            const t = translations[currentLang];

            if (selectedSubjects.length === 0) {
                const msg = document.createElement('span');
                msg.style.color = '#999';
                msg.style.fontSize = '13px';
                msg.textContent = t.noSubject;
                container.appendChild(msg);
                document.getElementById('registerBtn').disabled = true;
                return;
            }

            document.getElementById('registerBtn').disabled = false;

            selectedSubjects.forEach(subject => {
                // تحويل المفتاح إلى اسم
                let displayName = subject;
                if (subjectKeys.includes(subject)) {
                    displayName = t.subjects[subject] || subject;
                }

                const tag = document.createElement('span');
                tag.className = 'selected-tag';
                tag.innerHTML = `${displayName} <span class="remove" onclick="removeSubject('${subject}')">✕</span>`;
                container.appendChild(tag);
            });
        }

        // ===== حذف مادة =====
        function removeSubject(subject) {
            const index = selectedSubjects.indexOf(subject);
            if (index > -1) {
                selectedSubjects.splice(index, 1);
                document.querySelectorAll('.subject-item').forEach(el => {
                    if (el.dataset.subject === subject) {
                        el.classList.remove('selected');
                    }
                });
                updateSelectedTags();
            }
        }

        // ===== معالجة التسجيل =====
        document.getElementById('registerForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const name = document.getElementById('teacherName').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();
            const confirmPassword = document.getElementById('confirmPassword').value.trim();
            const errorEl = document.getElementById('errorMsg');
            const t = translations[currentLang];

            errorEl.classList.remove('show');

            if (!name) {
                errorEl.textContent = t.errorName;
                errorEl.classList.add('show');
                return;
            }

            if (!email || !email.includes('@')) {
                errorEl.textContent = t.errorEmail;
                errorEl.classList.add('show');
                return;
            }

            if (password.length < 6) {
                errorEl.textContent = t.errorPassword;
                errorEl.classList.add('show');
                return;
            }

            if (password !== confirmPassword) {
                errorEl.textContent = t.errorMatch;
                errorEl.classList.add('show');
                return;
            }

            if (selectedSubjects.length === 0) {
                errorEl.textContent = t.errorSubject;
                errorEl.classList.add('show');
                return;
            }

            const teacherData = {
                name: name,
                email: email,
                password: password,
                language: currentLang,
                subjects: selectedSubjects,
                registeredAt: new Date().toISOString()
            };

            localStorage.setItem('teachflow_teacher', JSON.stringify(teacherData));
            localStorage.setItem('teachflow_user', JSON.stringify({ name: name, email: email }));

            alert(t.success);
            window.location.href = 'home.html';
        });

        // ===== الضغط على Enter =====
        document.getElementById('customSubject').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                addCustomSubject();
            }
        });

        // ===== تحميل الصفحة =====
        window.addEventListener('load', function() {
            const teacher = localStorage.getItem('teachflow_teacher');
            if (teacher) {
                window.location.href = 'home.html';
                return;
            }

            selectLanguage('ar');
        });
    </script>
