<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل المعلم - TeachFlow</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .register-container {
            width: 100%;
            max-width: 500px;
        }

        .register-box {
            background: white;
            border-radius: 24px;
            padding: 40px 35px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .register-header {
            text-align: center;
            margin-bottom: 25px;
        }

        .register-header h1 {
            font-size: 32px;
            color: #333;
            margin-bottom: 5px;
        }

        .register-header p {
            color: #888;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-weight: 500;
            color: #444;
            margin-bottom: 5px;
            font-size: 14px;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 12px 14px;
            border: 2px solid #e8edf2;
            border-radius: 12px;
            font-size: 15px;
            background: #f8fafc;
            transition: 0.3s;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #667eea;
            background: white;
        }

        .form-group .hint {
            font-size: 12px;
            color: #999;
            margin-top: 4px;
        }

        /* ===== إضافة المواد ===== */
        .subject-selector {
            display: flex;
            gap: 10px;
        }

        .subject-selector select {
            flex: 1;
        }

        .subject-selector button {
            padding: 10px 18px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: 0.3s;
            white-space: nowrap;
        }

        .subject-selector button:hover {
            background: #5a6fd6;
        }

        .custom-subject-input {
            display: none;
            margin-top: 8px;
        }

        .custom-subject-input.show {
            display: block;
        }

        .custom-subject-input input {
            width: 100%;
            padding: 10px 14px;
            border: 2px solid #e8edf2;
            border-radius: 12px;
            font-size: 15px;
            background: #f8fafc;
            transition: 0.3s;
        }

        .custom-subject-input input:focus {
            outline: none;
            border-color: #667eea;
            background: white;
        }

        .selected-subjects {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 10px;
            min-height: 40px;
            padding: 6px;
            border: 2px dashed #e8edf2;
            border-radius: 12px;
            background: #fafafa;
        }

        .selected-subjects .empty-msg {
            color: #999;
            font-size: 13px;
            padding: 6px 10px;
        }

        .subject-tag {
            background: #667eea;
            color: white;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .subject-tag .remove {
            cursor: pointer;
            font-weight: 700;
            opacity: 0.7;
            font-size: 14px;
        }

        .subject-tag .remove:hover {
            opacity: 1;
        }

        /* ===== اللغة ===== */
        .language-options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .lang-option {
            padding: 12px;
            border: 2px solid #e8edf2;
            border-radius: 12px;
            text-align: center;
            cursor: pointer;
            transition: 0.3s;
            background: #f8fafc;
            font-size: 15px;
            font-weight: 500;
        }

        .lang-option:hover {
            border-color: #667eea;
            background: #f0f4ff;
        }

        .lang-option.selected {
            border-color: #667eea;
            background: #667eea;
            color: white;
        }

        .lang-option .flag {
            font-size: 22px;
            display: block;
            margin-bottom: 4px;
        }

        .btn-register {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #2ecc71, #27ae60);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
        }

        .btn-register:hover {
            transform: scale(1.02);
            box-shadow: 0 8px 25px rgba(46, 204, 113, 0.4);
        }

        .btn-register:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .error-msg {
            color: #e74c3c;
            font-size: 13px;
            text-align: center;
            margin-top: 10px;
            display: none;
        }

        .error-msg.show {
            display: block;
        }

        .footer {
            text-align: center;
            margin-top: 25px;
            padding-top: 18px;
            border-top: 1px solid #e8edf2;
            color: #aaa;
            font-size: 13px;
            direction: ltr;
        }

        .footer .name {
            color: #667eea;
            font-weight: 600;
        }

        @media (max-width: 480px) {
            .register-box {
                padding: 25px 18px;
            }
            .language-options {
                grid-template-columns: 1fr 1fr;
            }
            .subject-selector {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="register-container">
        <div class="register-box">
            <div class="register-header">
                <h1 id="pageTitle">📚 TeachFlow</h1>
                <p id="pageSubtitle">تسجيل المعلم الجديد</p>
            </div>

            <form id="registerForm">
                <!-- ===== اسم المعلم ===== -->
                <div class="form-group">
                    <label id="nameLabel">👨‍🏫 اسم المعلم</label>
                    <input type="text" id="teacherName" placeholder="أدخل اسمك بالكامل" required>
                </div>

                <!-- ===== البريد الإلكتروني ===== -->
                <div class="form-group">
                    <label id="emailLabel">📧 البريد الإلكتروني</label>
                    <input type="email" id="email" placeholder="teacher@example.com" required>
                </div>

                <!-- ===== كلمة المرور ===== -->
                <div class="form-group">
                    <label id="passwordLabel">🔒 كلمة المرور</label>
                    <input type="password" id="password" placeholder="••••••••" required>
                    <div class="hint" id="passwordHint">يجب أن تكون 6 أحرف على الأقل</div>
                </div>

                <!-- ===== اللغة ===== -->
                <div class="form-group">
                    <label id="languageLabel">🌍 اللغة</label>
                    <div class="language-options">
                        <div class="lang-option selected" data-lang="ar" onclick="selectLanguage('ar')">
                            <span class="flag">🇸🇦</span>
                            <span id="langArText">العربية</span>
                        </div>
                        <div class="lang-option" data-lang="en" onclick="selectLanguage('en')">
                            <span class="flag">🇬🇧</span>
                            <span id="langEnText">English</span>
                        </div>
                    </div>
                </div>

                <!-- ===== المواد ===== -->
                <div class="form-group">
                    <label id="subjectLabel">📚 المواد التي تدرسها</label>

                    <div class="subject-selector">
                        <select id="subjectSelect">
                            <option value="الرياضيات">📐 الرياضيات</option>
                            <option value="اللغة العربية">📖 اللغة العربية</option>
                            <option value="اللغة الإنجليزية">🇬🇧 اللغة الإنجليزية</option>
                            <option value="العلوم">🔬 العلوم</option>
                            <option value="التاريخ">🏛️ التاريخ</option>
                            <option value="الجغرافيا">🌍 الجغرافيا</option>
                            <option value="الفيزياء">⚡ الفيزياء</option>
                            <option value="الكيمياء">🧪 الكيمياء</option>
                            <option value="الأحياء">🧬 الأحياء</option>
                            <option value="الفلسفة">💭 الفلسفة</option>
                            <option value="أخرى">✏️ أخرى (اكتبها)</option>
                        </select>
                        <button type="button" id="addSubjectBtn" onclick="addSubject()">➕ إضافة</button>
                    </div>

                    <!-- حقل كتابة مادة مخصصة -->
                    <div class="custom-subject-input" id="customSubjectContainer">
                        <input type="text" id="customSubject" placeholder="✏️ اكتب اسم المادة...">
                    </div>

                    <!-- المواد المختارة -->
                    <div class="selected-subjects" id="selectedSubjects">
                        <span class="empty-msg" id="emptyMsg">⚠️ لم تختار أي مادة بعد</span>
                    </div>

                    <div class="hint" id="subjectHint">اختر المواد التي تدرسها (يمكنك اختيار أكثر من مادة)</div>
                </div>

                <!-- ===== زر التسجيل ===== -->
                <button type="submit" class="btn-register" id="registerBtn" disabled>
                    🚀 تسجيل ودخول
                </button>

                <div class="error-msg" id="errorMsg"></div>
            </form>

            <div class="footer">
                Designed with ❤️ by <span class="name">Dr. Hamada Fathy Hammad</span>
            </div>
        </div>
    </div>

    <script>
        // ===== الترجمة =====
        const translations = {
            ar: {
                title: '📚 TeachFlow',
                subtitle: 'تسجيل المعلم الجديد',
                nameLabel: '👨‍🏫 اسم المعلم',
                namePlaceholder: 'أدخل اسمك بالكامل',
                emailLabel: '📧 البريد الإلكتروني',
                emailPlaceholder: 'teacher@example.com',
                passwordLabel: '🔒 كلمة المرور',
                passwordPlaceholder: '••••••••',
                passwordHint: 'يجب أن تكون 6 أحرف على الأقل',
                languageLabel: '🌍 اللغة',
                langAr: 'العربية',
                langEn: 'English',
                subjectLabel: '📚 المواد التي تدرسها',
                subjectHint: 'اختر المواد التي تدرسها (يمكنك اختيار أكثر من مادة)',
                addBtn: '➕ إضافة',
                emptyMsg: '⚠️ لم تختار أي مادة بعد',
                customPlaceholder: '✏️ اكتب اسم المادة...',
                registerBtn: '🚀 تسجيل ودخول',
                errorName: '⚠️ الرجاء إدخال اسم المعلم',
                errorEmail: '⚠️ الرجاء إدخال بريد إلكتروني صحيح',
                errorPassword: '⚠️ كلمة المرور يجب أن تكون 6 أحرف على الأقل',
                errorSubject: '⚠️ الرجاء اختيار مادة واحدة على الأقل',
                success: '✅ تم تسجيل المعلم بنجاح!',
                subjects: {
                    'الرياضيات': '📐 الرياضيات',
                    'اللغة العربية': '📖 اللغة العربية',
                    'اللغة الإنجليزية': '🇬🇧 اللغة الإنجليزية',
                    'العلوم': '🔬 العلوم',
                    'التاريخ': '🏛️ التاريخ',
                    'الجغرافيا': '🌍 الجغرافيا',
                    'الفيزياء': '⚡ الفيزياء',
                    'الكيمياء': '🧪 الكيمياء',
                    'الأحياء': '🧬 الأحياء',
                    'الفلسفة': '💭 الفلسفة',
                    'أخرى': '✏️ أخرى (اكتبها)'
                }
            },
            en: {
                title: '📚 TeachFlow',
                subtitle: 'New Teacher Registration',
                nameLabel: '👨‍🏫 Teacher Name',
                namePlaceholder: 'Enter your full name',
                emailLabel: '📧 Email',
                emailPlaceholder: 'teacher@example.com',
                passwordLabel: '🔒 Password',
                passwordPlaceholder: '••••••••',
                passwordHint: 'Must be at least 6 characters',
                languageLabel: '🌍 Language',
                langAr: 'العربية',
                langEn: 'English',
                subjectLabel: '📚 Subjects you teach',
                subjectHint: 'Choose the subjects you teach (you can choose more than one)',
                addBtn: '➕ Add',
                emptyMsg: '⚠️ No subject selected yet',
                customPlaceholder: '✏️ Write the subject name...',
                registerBtn: '🚀 Register & Login',
                errorName: '⚠️ Please enter teacher name',
                errorEmail: '⚠️ Please enter a valid email',
                errorPassword: '⚠️ Password must be at least 6 characters',
                errorSubject: '⚠️ Please select at least one subject',
                success: '✅ Teacher registered successfully!',
                subjects: {
                    'الرياضيات': '📐 Mathematics',
                    'اللغة العربية': '📖 Arabic Language',
                    'اللغة الإنجليزية': '🇬🇧 English Language',
                    'العلوم': '🔬 Science',
                    'التاريخ': '🏛️ History',
                    'الجغرافيا': '🌍 Geography',
                    'الفيزياء': '⚡ Physics',
                    'الكيمياء': '🧪 Chemistry',
                    'الأحياء': '🧬 Biology',
                    'الفلسفة': '💭 Philosophy',
                    'أخرى': '✏️ Other (write it)'
                }
            }
        };

        // ===== متغيرات =====
        let currentLang = 'ar';
        let selectedSubjects = [];

        // ===== اختيار اللغة =====
        function selectLanguage(lang) {
            currentLang = lang;
            document.querySelectorAll('.lang-option').forEach(el => {
                el.classList.toggle('selected', el.dataset.lang === lang);
            });

            if (lang === 'ar') {
                document.dir = 'rtl';
                document.documentElement.lang = 'ar';
            } else {
                document.dir = 'ltr';
                document.documentElement.lang = 'en';
            }

            applyTranslation(lang);
            updateSubjectSelect(lang);
            renderSelectedSubjects();
        }

        // ===== تطبيق الترجمة =====
        function applyTranslation(lang) {
            const t = translations[lang];

            document.getElementById('pageTitle').textContent = t.title;
            document.getElementById('pageSubtitle').textContent = t.subtitle;
            document.getElementById('nameLabel').textContent = t.nameLabel;
            document.getElementById('teacherName').placeholder = t.namePlaceholder;
            document.getElementById('emailLabel').textContent = t.emailLabel;
            document.getElementById('email').placeholder = t.emailPlaceholder;
            document.getElementById('passwordLabel').textContent = t.passwordLabel;
            document.getElementById('password').placeholder = t.passwordPlaceholder;
            document.getElementById('passwordHint').textContent = t.passwordHint;
            document.getElementById('languageLabel').textContent = t.languageLabel;
            document.getElementById('langArText').textContent = t.langAr;
            document.getElementById('langEnText').textContent = t.langEn;
            document.getElementById('subjectLabel').textContent = t.subjectLabel;
            document.getElementById('subjectHint').textContent = t.subjectHint;
            document.getElementById('addSubjectBtn').textContent = t.addBtn;
            document.getElementById('customSubject').placeholder = t.customPlaceholder;
            document.getElementById('registerBtn').textContent = t.registerBtn;
        }

        // ===== تحديث قائمة المواد =====
        function updateSubjectSelect(lang) {
            const t = translations[lang];
            const select = document.getElementById('subjectSelect');
            const currentValue = select.value;

            select.innerHTML = '';
            const subjectKeys = ['الرياضيات', 'اللغة العربية', 'اللغة الإنجليزية', 'العلوم', 'التاريخ', 'الجغرافيا', 'الفيزياء', 'الكيمياء', 'الأحياء', 'الفلسفة', 'أخرى'];
            subjectKeys.forEach(key => {
                const option = document.createElement('option');
                option.value = key;
                option.textContent = t.subjects[key] || key;
                select.appendChild(option);
            });

            // استرجاع القيمة المحددة
            if ([...select.options].some(o => o.value === currentValue)) {
                select.value = currentValue;
            }
        }

        // ===== إظهار/إخفاء حقل المادة المخصصة =====
        document.getElementById('subjectSelect').addEventListener('change', function() {
            const container = document.getElementById('customSubjectContainer');
            if (this.value === 'أخرى') {
                container.classList.add('show');
                document.getElementById('customSubject').focus();
            } else {
                container.classList.remove('show');
                document.getElementById('customSubject').value = '';
            }
        });

        // ===== إضافة مادة =====
        function addSubject() {
            const select = document.getElementById('subjectSelect');
            let subject = select.value;

            if (subject === 'أخرى') {
                const custom = document.getElementById('customSubject').value.trim();
                if (!custom) {
                    alert(currentLang === 'ar' ? '⚠️ الرجاء كتابة اسم المادة' : '⚠️ Please enter the subject name');
                    return;
                }
                subject = custom;
                document.getElementById('customSubject').value = '';
                document.getElementById('customSubjectContainer').classList.remove('show');
                select.value = 'الرياضيات';
            }

            if (selectedSubjects.includes(subject)) {
                alert(currentLang === 'ar' ? '⚠️ هذه المادة مضافة بالفعل' : '⚠️ This subject is already added');
                return;
            }

            selectedSubjects.push(subject);
            renderSelectedSubjects();
            updateRegisterButton();
        }

        // ===== عرض المواد المختارة =====
        function renderSelectedSubjects() {
            const container = document.getElementById('selectedSubjects');
            container.innerHTML = '';

            if (selectedSubjects.length === 0) {
                const empty = document.createElement('span');
                empty.className = 'empty-msg';
                empty.id = 'emptyMsg';
                empty.textContent = translations[currentLang].emptyMsg;
                container.appendChild(empty);
                return;
            }

            selectedSubjects.forEach(subject => {
                const tag = document.createElement('span');
                tag.className = 'subject-tag';
                tag.innerHTML = `${subject} <span class="remove" onclick="removeSubject('${subject}')">✕</span>`;
                container.appendChild(tag);
            });
        }

        // ===== حذف مادة =====
        function removeSubject(subject) {
            selectedSubjects = selectedSubjects.filter(s => s !== subject);
            renderSelectedSubjects();
            updateRegisterButton();
        }

        // ===== تحديث زر التسجيل =====
        function updateRegisterButton() {
            const btn = document.getElementById('registerBtn');
            btn.disabled = selectedSubjects.length === 0;
        }

        // ===== الضغط على Enter في حقل المادة المخصصة =====
        document.getElementById('customSubject').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                addSubject();
            }
        });

        // ===== معالجة التسجيل =====
        document.getElementById('registerForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const name = document.getElementById('teacherName').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();
            const errorEl = document.getElementById('errorMsg');
            const t = translations[currentLang];

            errorEl.classList.remove('show');

            if (!name) {
                errorEl.textContent = t.errorName;
                errorEl.classList.add('show');
                return;
            }

            if (!email || !email.includes('@')) {
                errorEl.textContent = t.errorEmail;
                errorEl.classList.add('show');
                return;
            }

            if (password.length < 6) {
                errorEl.textContent = t.errorPassword;
                errorEl.classList.add('show');
                return;
            }

            if (selectedSubjects.length === 0) {
                errorEl.textContent = t.errorSubject;
                errorEl.classList.add('show');
                return;
            }

            const teacherData = {
                name: name,
                email: email,
                password: password,
                language: currentLang,
                subjects: selectedSubjects,
                registeredAt: new Date().toISOString()
            };

            localStorage.setItem('teachflow_teacher', JSON.stringify(teacherData));
            localStorage.setItem('teachflow_user', JSON.stringify({ name: name, email: email }));

            alert(t.success);
            window.location.href = 'home.html';
        });

        // ===== تحميل الصفحة =====
        window.addEventListener('load', function() {
            const teacher = localStorage.getItem('teachflow_teacher');
            if (teacher) {
                window.location.href = 'home.html';
                return;
            }
            selectLanguage('ar');
            updateRegisterButton();
        });
    </script>
</body>
</html>
