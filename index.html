<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل المعلم - TeachFlow</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .register-container {
            width: 100%;
            max-width: 480px;
        }

        .register-box {
            background: white;
            border-radius: 24px;
            padding: 40px 35px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .register-header {
            text-align: center;
            margin-bottom: 25px;
        }

        .register-header h1 {
            font-size: 32px;
            color: #333;
            margin-bottom: 5px;
        }

        .register-header p {
            color: #888;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-weight: 500;
            color: #444;
            margin-bottom: 5px;
            font-size: 14px;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 12px 14px;
            border: 2px solid #e8edf2;
            border-radius: 12px;
            font-size: 15px;
            background: #f8fafc;
            transition: 0.3s;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #667eea;
            background: white;
        }

        .form-group .hint {
            font-size: 12px;
            color: #999;
            margin-top: 4px;
        }

        .form-group .custom-subject-input {
            display: none;
            margin-top: 8px;
        }

        .form-group .custom-subject-input.show {
            display: block;
        }

        /* ===== اختيار اللغة (مبسط) ===== */
        .language-options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .lang-option {
            padding: 12px;
            border: 2px solid #e8edf2;
            border-radius: 12px;
            text-align: center;
            cursor: pointer;
            transition: 0.3s;
            background: #f8fafc;
            font-size: 15px;
            font-weight: 500;
        }

        .lang-option:hover {
            border-color: #667eea;
            background: #f0f4ff;
        }

        .lang-option.selected {
            border-color: #667eea;
            background: #667eea;
            color: white;
        }

        .lang-option .flag {
            font-size: 22px;
            display: block;
            margin-bottom: 4px;
        }

        /* ===== زر التسجيل ===== */
        .btn-register {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #2ecc71, #27ae60);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
        }

        .btn-register:hover {
            transform: scale(1.02);
            box-shadow: 0 8px 25px rgba(46, 204, 113, 0.4);
        }

        .btn-register:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .error-msg {
            color: #e74c3c;
            font-size: 13px;
            text-align: center;
            margin-top: 10px;
            display: none;
        }

        .error-msg.show {
            display: block;
        }

        .footer {
            text-align: center;
            margin-top: 25px;
            padding-top: 18px;
            border-top: 1px solid #e8edf2;
            color: #aaa;
            font-size: 13px;
            direction: ltr;
        }

        .footer .name {
            color: #667eea;
            font-weight: 600;
        }

        @media (max-width: 480px) {
            .register-box {
                padding: 25px 18px;
            }
            .language-options {
                grid-template-columns: 1fr 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="register-container">
        <div class="register-box">
            <div class="register-header">
                <h1>📚 TeachFlow</h1>
                <p>تسجيل المعلم الجديد</p>
            </div>

            <form id="registerForm">
                <!-- ===== اسم المعلم ===== -->
                <div class="form-group">
                    <label>👨‍🏫 اسم المعلم</label>
                    <input type="text" id="teacherName" placeholder="أدخل اسمك بالكامل" required>
                </div>

                <!-- ===== البريد الإلكتروني ===== -->
                <div class="form-group">
                    <label>📧 البريد الإلكتروني</label>
                    <input type="email" id="email" placeholder="teacher@example.com" required>
                </div>

                <!-- ===== كلمة المرور (بدون تأكيد) ===== -->
                <div class="form-group">
                    <label>🔒 كلمة المرور</label>
                    <input type="password" id="password" placeholder="••••••••" required>
                    <div class="hint">يجب أن تكون 6 أحرف على الأقل</div>
                </div>

                <!-- ===== اختيار اللغة (عربي/إنجليزي فقط) ===== -->
                <div class="form-group">
                    <label>🌍 اللغة</label>
                    <div class="language-options">
                        <div class="lang-option selected" data-lang="ar" onclick="selectLanguage('ar')">
                            <span class="flag">🇸🇦</span>
                            العربية
                        </div>
                        <div class="lang-option" data-lang="en" onclick="selectLanguage('en')">
                            <span class="flag">🇬🇧</span>
                            English
                        </div>
                    </div>
                </div>

                <!-- ===== اختيار المواد (قائمة منسدلة) ===== -->
                <div class="form-group">
                    <label>📚 مادة التدريس</label>
                    <select id="subjectSelect" onchange="toggleCustomSubject()">
                        <option value="الرياضيات">📐 الرياضيات</option>
                        <option value="اللغة العربية">📖 اللغة العربية</option>
                        <option value="اللغة الإنجليزية">🇬🇧 اللغة الإنجليزية</option>
                        <option value="العلوم">🔬 العلوم</option>
                        <option value="التاريخ">🏛️ التاريخ</option>
                        <option value="الجغرافيا">🌍 الجغرافيا</option>
                        <option value="الفيزياء">⚡ الفيزياء</option>
                        <option value="الكيمياء">🧪 الكيمياء</option>
                        <option value="الأحياء">🧬 الأحياء</option>
                        <option value="الفلسفة">💭 الفلسفة</option>
                        <option value="أخرى">✏️ أخرى (اكتبها)</option>
                    </select>

                    <!-- حقل كتابة مادة مخصصة -->
                    <div class="custom-subject-input" id="customSubjectContainer">
                        <input type="text" id="customSubject" placeholder="✏️ اكتب اسم المادة..." style="width:100%;padding:10px 14px;border:2px solid #e8edf2;border-radius:12px;font-size:15px;background:#f8fafc;transition:0.3s;">
                    </div>
                    <div class="hint">اختر مادة من القائمة أو اختر "أخرى" واكتبها</div>
                </div>

                <!-- ===== زر التسجيل ===== -->
                <button type="submit" class="btn-register" id="registerBtn">
                    🚀 تسجيل ودخول
                </button>

                <div class="error-msg" id="errorMsg"></div>
            </form>

            <!-- ===== التوقيع ===== -->
            <div class="footer">
                Designed with ❤️ by <span class="name">Dr. Hamada Fathy Hammad</span>
            </div>
        </div>
    </div>

    <script>
        // ===== متغيرات =====
        let selectedLang = 'ar';

        // ===== اختيار اللغة =====
        function selectLanguage(lang) {
            selectedLang = lang;
            document.querySelectorAll('.lang-option').forEach(el => {
                el.classList.toggle('selected', el.dataset.lang === lang);
            });

            // تغيير اتجاه الصفحة
            if (lang === 'ar') {
                document.dir = 'rtl';
                document.documentElement.lang = 'ar';
            } else {
                document.dir = 'ltr';
                document.documentElement.lang = 'en';
            }
        }

        // ===== إظهار/إخفاء حقل المادة المخصصة =====
        function toggleCustomSubject() {
            const select = document.getElementById('subjectSelect');
            const container = document.getElementById('customSubjectContainer');
            if (select.value === 'أخرى') {
                container.classList.add('show');
                document.getElementById('customSubject').focus();
            } else {
                container.classList.remove('show');
                document.getElementById('customSubject').value = '';
            }
        }

        // ===== معالجة التسجيل =====
        document.getElementById('registerForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const name = document.getElementById('teacherName').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();
            const subjectSelect = document.getElementById('subjectSelect').value;
            const customSubject = document.getElementById('customSubject').value.trim();
            const errorEl = document.getElementById('errorMsg');

            errorEl.classList.remove('show');

            // التحقق من اسم المعلم
            if (!name) {
                errorEl.textContent = '⚠️ الرجاء إدخال اسم المعلم';
                errorEl.classList.add('show');
                return;
            }

            // التحقق من البريد
            if (!email || !email.includes('@')) {
                errorEl.textContent = '⚠️ الرجاء إدخال بريد إلكتروني صحيح';
                errorEl.classList.add('show');
                return;
            }

            // التحقق من كلمة المرور
            if (password.length < 6) {
                errorEl.textContent = '⚠️ كلمة المرور يجب أن تكون 6 أحرف على الأقل';
                errorEl.classList.add('show');
                return;
            }

            // تحديد المادة النهائية
            let finalSubject = subjectSelect;
            if (subjectSelect === 'أخرى') {
                if (!customSubject) {
                    errorEl.textContent = '⚠️ الرجاء كتابة اسم المادة';
                    errorEl.classList.add('show');
                    return;
                }
                finalSubject = customSubject;
            }

            // حفظ البيانات
            const teacherData = {
                name: name,
                email: email,
                password: password,
                language: selectedLang,
                subjects: [finalSubject], // كمادة واحدة فقط
                registeredAt: new Date().toISOString()
            };

            localStorage.setItem('teachflow_teacher', JSON.stringify(teacherData));
            localStorage.setItem('teachflow_user', JSON.stringify({ name: name, email: email }));

            alert('✅ تم تسجيل المعلم بنجاح!');
            window.location.href = 'home.html';
        });

        // ===== تحميل الصفحة =====
        window.addEventListener('load', function() {
            const teacher = localStorage.getItem('teachflow_teacher');
            if (teacher) {
                window.location.href = 'home.html';
                return;
            }
            selectLanguage('ar');
        });
    </script>
</body>
</html>
