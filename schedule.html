<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الجدول الأسبوعي - TeachFlow</title>
    <!-- ===== Firebase SDK ===== -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js">
    </script>
    <!-- ===== jsPDF & html2canvas ===== -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js">
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js">
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, sans-serif;
        }

        body {
            background: #f0f2f5;
            min-height: 100vh;
        }

        /* ===== Hamburger ===== */
        .hamburger {
            display: none;
            position: fixed;
            top: 15px;
            right: 15px;
            z-index: 999;
            background: #667eea;
            color: white;
            border: none;
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 24px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
        }

        .sidebar-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.4);
            z-index: 99;
        }

        .sidebar-overlay.active {
            display: block;
        }

        /* ===== Sidebar ===== */
        .sidebar {
            position: fixed;
            right: 0;
            top: 0;
            width: 220px;
            height: 100vh;
            background: white;
            padding: 20px 15px;
            box-shadow: -2px 0 10px rgba(0, 0, 0, 0.05);
            overflow-y: auto;
            z-index: 100;
            transition: transform 0.3s ease;
        }

        .sidebar .close-btn {
            display: none;
            background: none;
            border: none;
            font-size: 28px;
            color: #555;
            cursor: pointer;
            float: left;
            margin-bottom: 10px;
        }

        .logo {
            font-size: 22px;
            font-weight: 700;
            color: #667eea;
            text-align: center;
            padding-bottom: 20px;
            border-bottom: 1px solid #eee;
            margin-bottom: 15px;
        }

        .logo span {
            display: block;
            font-size: 12px;
            color: #999;
            font-weight: 400;
        }

        .sidebar-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 12px;
            border-radius: 10px;
            color: #555;
            cursor: pointer;
            transition: 0.3s;
            border: none;
            background: none;
            width: 100%;
            text-align: right;
            font-size: 14px;
        }

        .sidebar-item:hover {
            background: #f0f4ff;
            color: #667eea;
        }

        .sidebar-item.active {
            background: #667eea;
            color: white;
        }

        /* ===== Main ===== */
        .main-content {
            margin-right: 220px;
            padding: 25px;
            width: 100%;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .page-header h1 {
            font-size: 26px;
            color: #333;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .page-header .actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn-add {
            padding: 10px 20px;
            background: #2ecc71;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-add:hover {
            background: #27ae60;
            transform: scale(1.02);
        }

        .btn-back {
            padding: 10px 20px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-back:hover {
            background: #5a6fd6;
            transform: scale(1.02);
        }

        .btn-refresh {
            padding: 10px 20px;
            background: #3498db;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-refresh:hover {
            background: #2980b9;
            transform: scale(1.02);
        }

        .btn-print {
            padding: 10px 20px;
            background: #27ae60;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-print:hover {
            background: #219653;
            transform: scale(1.02);
        }

        .btn-pdf {
            padding: 10px 20px;
            background: #e74c3c;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-pdf:hover {
            background: #c0392b;
            transform: scale(1.02);
        }

        /* ===== Schedule Table ===== */
        .schedule-container {
            background: white;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
            flex: 1;
            overflow-x: auto;
        }

        .schedule-table {
            width: 100%;
            border-collapse: collapse;
            min-width: 700px;
        }

        .schedule-table th {
            background: #667eea;
            color: white;
            padding: 16px 12px;
            text-align: center;
            font-weight: 600;
            font-size: 14px;
            border: 1px solid #5a6fd6;
            white-space: nowrap;
        }

        .schedule-table th .day-sub {
            font-size: 10px;
            font-weight: 400;
            opacity: 0.8;
            display: block;
        }

        .schedule-table td {
            padding: 12px 8px;
            text-align: center;
            border: 1px solid #e8edf2;
            vertical-align: middle;
            min-height: 60px;
            transition: 0.2s;
        }

        .schedule-table tr:hover td {
            background: #f8fafc;
        }

        .schedule-table .time-col {
            background: #f8fafc;
            font-weight: 600;
            color: #555;
            width: 70px;
            white-space: nowrap;
            font-size: 13px;
            border-left: 2px solid #667eea;
        }

        /* ===== Lesson Cell ===== */
        .schedule-table .lesson-cell {
            border-radius: 8px;
            padding: 6px 8px;
            margin: 2px 0;
            cursor: pointer;
            transition: 0.3s;
            position: relative;
            border-right: 3px solid transparent;
        }

        .schedule-table .lesson-cell:hover {
            transform: scale(1.02);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .schedule-table .lesson-cell .group-name {
            font-weight: 600;
            color: #333;
            font-size: 13px;
        }

        .schedule-table .lesson-cell .subject {
            color: #667eea;
            font-size: 11px;
        }

        .schedule-table .lesson-cell .location {
            font-size: 10px;
            color: #888;
        }

        .schedule-table .lesson-cell .from-group {
            font-size: 9px;
            color: #2e7d32;
            background: #e8f5e9;
            padding: 1px 6px;
            border-radius: 10px;
            display: inline-block;
            margin-top: 2px;
        }

        .schedule-table .lesson-cell .repeat-badge {
            font-size: 8px;
            color: #fff;
            background: #9b59b6;
            padding: 1px 6px;
            border-radius: 10px;
            display: inline-block;
            margin-top: 2px;
        }

        /* ===== Colors for different subjects ===== */
        .schedule-table .lesson-cell.color-1 {
            border-right-color: #667eea;
            background: #eef1ff;
        }
        .schedule-table .lesson-cell.color-2 {
            border-right-color: #2ecc71;
            background: #eafaf1;
        }
        .schedule-table .lesson-cell.color-3 {
            border-right-color: #f39c12;
            background: #fef9e7;
        }
        .schedule-table .lesson-cell.color-4 {
            border-right-color: #e74c3c;
            background: #fdedec;
        }
        .schedule-table .lesson-cell.color-5 {
            border-right-color: #9b59b6;
            background: #f4ecf7;
        }
        .schedule-table .lesson-cell.color-6 {
            border-right-color: #1abc9c;
            background: #e8f8f5;
        }

        .schedule-table .empty-cell {
            color: #ccc;
            font-size: 12px;
        }

        .footer {
            text-align: center;
            margin-top: 30px;
            padding: 15px;
            color: #aaa;
            font-size: 13px;
            border-top: 1px solid #e8edf2;
            direction: ltr;
        }

        .footer .name {
            color: #667eea;
            font-weight: 600;
        }

        /* ===== Print ===== */
        @media print {
            .sidebar,
            .btn-back,
            .btn-add,
            .btn-refresh,
            .btn-print,
            .btn-pdf,
            .footer,
            .page-header .actions,
            .hamburger,
            .sidebar-overlay {
                display: none !important;
            }

            .main-content {
                margin-right: 0 !important;
                padding: 10px !important;
            }

            .schedule-container {
                box-shadow: none !important;
                border: 1px solid #ddd !important;
            }

            .schedule-table th {
                background: #667eea !important;
                color: white !important;
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }
        }

        /* ===== Mobile ===== */
        @media (max-width: 768px) {
            .hamburger {
                display: block;
            }

            .sidebar {
                width: 280px;
                transform: translateX(100%);
                box-shadow: -4px 0 20px rgba(0, 0, 0, 0.1);
            }

            .sidebar.open {
                transform: translateX(0);
            }

            .sidebar .close-btn {
                display: block;
            }

            .main-content {
                margin-right: 0;
                padding: 70px 15px 15px 15px;
            }

            .page-header h1 {
                font-size: 20px;
            }

            .schedule-table {
                font-size: 12px;
                min-width: 600px;
            }

            .schedule-table th,
            .schedule-table td {
                padding: 8px 6px;
            }

            .schedule-table .time-col {
                width: 60px;
                font-size: 11px;
            }

            .page-header .actions {
                gap: 6px;
            }

            .page-header .actions button {
                padding: 6px 12px;
                font-size: 12px;
            }
        }

        @media (max-width: 480px) {
            .schedule-table {
                font-size: 11px;
                min-width: 500px;
            }

            .schedule-table th,
            .schedule-table td {
                padding: 6px 4px;
            }

            .schedule-table .time-col {
                width: 50px;
                font-size: 10px;
            }

            .page-header .actions {
                flex-direction: row;
                flex-wrap: wrap;
                width: 100%;
            }

            .page-header .actions button {
                flex: 1;
                min-width: 50px;
                justify-content: center;
                font-size: 11px;
                padding: 4px 8px;
            }

            .hamburger {
                font-size: 20px;
                padding: 8px 12px;
                top: 10px;
                right: 10px;
            }

            .sidebar {
                width: 260px;
            }
        }
    </style>
</head>
<body>

    <!-- ===== Hamburger ===== -->
    <button class="hamburger" onclick="toggleSidebar()">☰</button>
    <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

    <!-- ===== Sidebar ===== -->
    <nav class="sidebar" id="sidebar">
        <button class="close-btn" onclick="toggleSidebar()">✕</button>
        <div class="logo">📚 TeachFlow <span>نظام إدارة المعلمين</span></div>

        <button class="sidebar-item" onclick="window.location.href='home.html'">🏠 <span>الرئيسية</span></button>
        <button class="sidebar-item" onclick="window.location.href='groups.html'">👥 <span>المجموعات</span></button>
        <button class="sidebar-item" onclick="window.location.href='students.html'">👨‍🎓 <span>الطلاب</span></button>
        <button class="sidebar-item active" onclick="window.location.href='schedule.html'">📅 <span>الجدول</span></button>
        <button class="sidebar-item" onclick="window.location.href='attendance.html'">✅ <span>الحضور</span></button>
        <button class="sidebar-item" onclick="window.location.href='assessments.html'">📊 <span>التقييمات</span></button>
        <button class="sidebar-item" onclick="window.location.href='finances.html'">💰 <span>الحسابات</span></button>
        <button class="sidebar-item" onclick="window.location.href='student-report.html'">📈 <span>التقارير</span></button>
        <button class="sidebar-item" onclick="window.location.href='notifications.html'">🔔 <span>التنبيهات</span></button>
        <button class="sidebar-item" onclick="window.location.href='settings.html'">⚙️ <span>الإعدادات</span></button>
        <button class="sidebar-item" onclick="logout()">🚪 <span>تسجيل الخروج</span></button>
    </nav>

    <!-- ===== Main ===== -->
    <main class="main-content">

        <div class="page-header">
            <h1>📅 الجدول الأسبوعي</h1>
            <div class="actions">
                <button class="btn-back" onclick="window.location.href='home.html'">🔙 رجوع</button>
                <button class="btn-refresh" onclick="refreshSchedule()">🔄 تحديث</button>
                <button class="btn-add" onclick="showAddLesson()">➕ إضافة حصة</button>
                <button class="btn-print" onclick="window.print()">🖨️ طباعة</button>
                <button class="btn-pdf" onclick="exportPDF()">📄 PDF</button>
            </div>
        </div>

        <div class="schedule-container" id="scheduleContainer">
            <table class="schedule-table" id="scheduleTable">
                <thead>
                    <tr>
                        <th>⏰ الوقت</th>
                        <th>السبت <span class="day-sub">يوم 1</span></th>
                        <th>الأحد <span class="day-sub">يوم 2</span></th>
                        <th>الإثنين <span class="day-sub">يوم 3</span></th>
                        <th>الثلاثاء <span class="day-sub">يوم 4</span></th>
                        <th>الأربعاء <span class="day-sub">يوم 5</span></th>
                        <th>الخميس <span class="day-sub">يوم 6</span></th>
                        <th>الجمعة <span class="day-sub">يوم 7</span></th>
                    </tr>
                </thead>
                <tbody id="scheduleBody">
                    <!-- هتتعبأ من JavaScript -->
                </tbody>
            </table>
        </div>

        <div class="footer">
            Designed with ❤️ by <span class="name">Dr. Hamada Fathy Hammad</span>
        </div>
    </main>

    <script>
        // ===== Firebase Config =====
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT.firebaseapp.com",
            projectId: "YOUR_PROJECT",
            storageBucket: "YOUR_PROJECT.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // ===== Sidebar Toggle =====
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebarOverlay');

            sidebar.classList.toggle('closed');
            sidebar.classList.toggle('open');
            overlay.classList.toggle('active');

            if (window.innerWidth <= 768) {
                document.querySelectorAll('.sidebar-item').forEach(item => {
                    item.addEventListener('click', function() {
                        setTimeout(() => {
                            sidebar.classList.add('closed');
                            sidebar.classList.remove('open');
                            overlay.classList.remove('active');
                        }, 300);
                    });
                });
            }
        }

        // ===== أيام الأسبوع =====
        const days = ['السبت', 'الأحد', 'الإثنين', 'الثلاثاء', 'الأربعاء', 'الخميس', 'الجمعة'];

        // ===== الأوقات =====
        const times = [
            '8:00 ص', '9:00 ص', '10:00 ص', '11:00 ص', '12:00 م',
            '1:00 م', '2:00 م', '3:00 م', '4:00 م', '5:00 م',
            '6:00 م', '7:00 م', '8:00 م', '9:00 م', '10:00 م'
        ];

        // ===== الألوان للمواد =====
        const colors = ['color-1', 'color-2', 'color-3', 'color-4', 'color-5', 'color-6'];

        // ===== بيانات الجدول =====
        let schedule = [];
        let groups = [];

        // ===== تحميل الجدول من Firebase =====
        async function loadSchedule() {
            const uid = localStorage.getItem('teachflow_uid');
            if (!uid) {
                window.location.href = 'index.html';
                return;
            }

            try {
                // جلب المجموعات
                const groupsSnapshot = await db.collection('teachers').doc(uid).collection('groups').get();
                groups = [];
                groupsSnapshot.forEach(doc => {
                    groups.push({ id: doc.id, ...doc.data() });
                });

                // جلب الحصص
                const scheduleSnapshot = await db.collection('teachers').doc(uid).collection('schedule').get();
                schedule = [];
                scheduleSnapshot.forEach(doc => {
                    schedule.push({ id: doc.id, ...doc.data() });
                });

                renderSchedule();

            } catch (error) {
                console.error('❌ خطأ في تحميل الجدول:', error);
                schedule = [];
                renderSchedule();
            }
        }

        // ===== حفظ حصة في Firebase =====
        async function saveLessonToFirebase(lessonData) {
            const uid = localStorage.getItem('teachflow_uid');
            if (!uid) return;

            try {
                const docRef = await db.collection('teachers').doc(uid).collection('schedule').add(lessonData);
                return docRef.id;
            } catch (error) {
                console.error('❌ خطأ في حفظ الحصة:', error);
                alert('❌ حدث خطأ أثناء حفظ الحصة');
                return null;
            }
        }

        // ===== حذف حصة من Firebase =====
        async function deleteLessonFromFirebase(lessonId) {
            const uid = localStorage.getItem('teachflow_uid');
            if (!uid) return;

            try {
                await db.collection('teachers').doc(uid).collection('schedule').doc(lessonId).delete();
                return true;
            } catch (error) {
                console.error('❌ خطأ في حذف الحصة:', error);
                alert('❌ حدث خطأ أثناء حذف الحصة');
                return false;
            }
        }

        // ===== عرض الجدول =====
        function renderSchedule() {
            const tbody = document.getElementById('scheduleBody');

            tbody.innerHTML = times.map(time => {
                let row = `<tr><td class="time-col">${time}</td>`;

                days.forEach((day, dayIndex) => {
                    // الحصص المسجلة
                    const scheduledLessons = schedule.filter(s => s.day === day && s.time === time);

                    // المجموعات اللي ليها يوم ووقت محدد
                    const groupLessons = groups
                        .filter(g => g.day === day && g.time === time && g.active !== false)
                        .map(g => ({
                            id: 'group-' + g.id,
                            group: g.name,
                            subject: g.level || 'مجموعة',
                            location: g.locationType || '',
                            isGroup: true,
                            fromGroup: true,
                            color: colors[Math.floor(Math.random() * colors.length)]
                        }));

                    // دمج الحصص
                    let allLessons = [...groupLessons, ...scheduledLessons];

                    // إضافة التكرار الأسبوعي (من الحصص اللي فيها repeatWeekly)
                    const weeklyLessons = schedule
                        .filter(s => s.repeatWeekly && s.day === day && s.time === time && !scheduledLessons.includes(s))
                        .map(s => ({
                            ...s,
                            isGroup: false,
                            fromGroup: false,
                            isRepeat: true,
                            color: colors[Math.floor(Math.random() * colors.length)]
                        }));

                    allLessons = [...allLessons, ...weeklyLessons];

                    if (allLessons.length > 0) {
                        row += `<td>`;
                        allLessons.forEach((lesson, index) => {
                            const isGroup = lesson.isGroup || false;
                            const isRepeat = lesson.isRepeat || false;
                            const locationText = lesson.location ? `📍 ${lesson.location}` : '';
                            const colorClass = lesson.color || colors[index % colors.length];

                            let bgColor = '#f0f4ff';
                            if (isGroup) {
                                bgColor = '#e8f5e9';
                            } else if (isRepeat) {
                                bgColor = '#f3e5f5';
                            }

                            row += `
                                <div class="lesson-cell ${colorClass}" 
                                     style="background:${bgColor}; padding:6px 8px; margin:2px 0; border-radius:8px; cursor:pointer; transition:0.3s;"
                                     onclick="${isGroup ? `showGroupDetails('${lesson.group}')` : `deleteLesson('${lesson.id}')`}">
                                    <div class="group-name">${lesson.group}</div>
                                    <div class="subject">${lesson.subject}</div>
                                    ${locationText ? `<div class="location">${locationText}</div>` : ''}
                                    ${isGroup ? '<div class="from-group">🔄 من المجموعات</div>' : ''}
                                    ${isRepeat ? '<div class="repeat-badge">🔄 متكرر</div>' : ''}
                                </div>
                            `;
                        });
                        row += `</td>`;
                    } else {
                        row += `<td><span class="empty-cell">-</span></td>`;
                    }
                });

                row += `</tr>`;
                return row;
            }).join('');
        }

        // ===== عرض تفاصيل المجموعة =====
        function showGroupDetails(groupName) {
            const group = groups.find(g => g.name === groupName);
            if (group) {
                alert(`📚 ${group.name}\n📅 ${group.day || 'غير محدد'}\n⏰ ${group.time || 'غير محدد'}\n📍 ${group.locationAddress || 'لا يوجد عنوان'}\n📊 المستوى: ${group.level || 'عام'}\n👥 الحد الأقصى: ${group.maxStudents || 'غير محدد'}`);
            } else {
                alert(`📚 ${groupName}`);
            }
        }

        // ===== تحديث الجدول =====
        function refreshSchedule() {
            renderSchedule();
            alert('🔄 تم تحديث الجدول!');
        }

        // ===== إضافة حصة =====
        async function showAddLesson() {
            const uid = localStorage.getItem('teachflow_uid');
            if (!uid) return;

            // جلب المجموعات من Firebase
            const groupsSnapshot = await db.collection('teachers').doc(uid).collection('groups').get();
            const groups = [];
            groupsSnapshot.forEach(doc => {
                groups.push({ id: doc.id, ...doc.data() });
            });

            if (groups.length === 0) {
                alert('⚠️ لا توجد مجموعات! الرجاء إضافة مجموعة أولاً.');
                return;
            }

            const dayOptions = days.map((d, i) => `${i + 1}. ${d}`).join('\n');
            const dayChoice = prompt(`📅 اختر اليوم:\n${dayOptions}\n\nأدخل رقم اليوم:`);
            const dayIndex = parseInt(dayChoice) - 1;
            if (isNaN(dayIndex) || dayIndex < 0 || dayIndex >= days.length) {
                alert('⚠️ اختيار غير صحيح!');
                return;
            }
            const day = days[dayIndex];

            const timeOptions = times.map((t, i) => `${i + 1}. ${t}`).join('\n');
            const timeChoice = prompt(`⏰ اختر الوقت:\n${timeOptions}\n\nأدخل رقم الوقت:`);
            const timeIndex = parseInt(timeChoice) - 1;
            if (isNaN(timeIndex) || timeIndex < 0 || timeIndex >= times.length) {
                alert('⚠️ اختيار غير صحيح!');
                return;
            }
            const time = times[timeIndex];

            const groupOptions = groups.map((g, i) => `${i + 1}. ${g.name}`).join('\n');
            const groupChoice = prompt(`👥 اختر المجموعة:\n${groupOptions}\n\nأدخل رقم المجموعة:`);
            const groupIndex = parseInt(groupChoice) - 1;
            if (isNaN(groupIndex) || groupIndex < 0 || groupIndex >= groups.length) {
                alert('⚠️ اختيار غير صحيح!');
                return;
            }
            const group = groups[groupIndex].name;

            const subject = prompt('📚 المادة (اختياري):') || '';
            const repeatWeekly = confirm('🔄 هل تريد تكرار هذه الحصة أسبوعياً؟ (OK = نعم، Cancel = لا)');

            const newLesson = {
                day: day,
                time: time,
                group: group,
                subject: subject,
                repeatWeekly: repeatWeekly,
                addedAt: new Date().toISOString()
            };

            const docId = await saveLessonToFirebase(newLesson);
            if (docId) {
                newLesson.id = docId;
                schedule.push(newLesson);
                renderSchedule();
                alert(`✅ تم إضافة الحصة: ${day} - ${time} - ${group}${repeatWeekly ? ' (متكرر أسبوعياً)' : ''}`);
            }
        }

        // ===== حذف حصة =====
        async function deleteLesson(lessonId) {
            if (lessonId.toString().startsWith('group-')) {
                alert('⚠️ هذه حصة من المجموعات، لا يمكن حذفها من هنا.\nيمكنك تعديلها من صفحة المجموعات.');
                return;
            }

            const lesson = schedule.find(s => s.id === lessonId);
            if (!lesson) return;

            if (confirm(`🗑️ هل أنت متأكد من حذف حصة ${lesson.group} في ${lesson.day} ${lesson.time}؟`)) {
                const deleted = await deleteLessonFromFirebase(lessonId);
                if (deleted) {
                    schedule = schedule.filter(s => s.id !== lessonId);
                    renderSchedule();
                    alert('✅ تم حذف الحصة!');
                }
            }
        }

        // ===== تصدير PDF =====
        function exportPDF() {
            const element = document.getElementById('scheduleContainer');
            const originalOverflow = document.body.style.overflow;
            document.body.style.overflow = 'hidden';

            element.style.border = '1px solid #ddd';
            element.style.padding = '10px';

            html2canvas(element, {
                scale: 2,
                useCORS: true,
                backgroundColor: '#ffffff',
                allowTaint: true,
                logging: false
            }).then(canvas => {
                const imgData = canvas.toDataURL('image/png');
                const { jsPDF } = window.jspdf;
                const pdf = new jsPDF('l', 'mm', 'a4');
                const pdfWidth = pdf.internal.pageSize.getWidth();
                const pdfHeight = (canvas.height * pdfWidth) / canvas.width;
                pdf.addImage(imgData, 'PNG', 0, 0, pdfWidth, pdfHeight);
                pdf.save(`الجدول_الأسبوعي_${new Date().toISOString().split('T')[0]}.pdf`);

                element.style.border = 'none';
                element.style.padding = '0';
                document.body.style.overflow = originalOverflow;
            }).catch(err => {
                alert('⚠️ حدث خطأ أثناء إنشاء PDF: ' + err.message);
                element.style.border = 'none';
                element.style.padding = '0';
                document.body.style.overflow = originalOverflow;
            });
        }

        // ===== تسجيل الخروج =====
        function logout() {
            if (confirm('هل أنت متأكد من تسجيل الخروج؟')) {
                localStorage.removeItem('teachflow_teacher');
                localStorage.removeItem('teachflow_user');
                localStorage.removeItem('teachflow_uid');
                window.location.href = 'index.html';
            }
        }

        // ===== تحميل الصفحة =====
        document.addEventListener('DOMContentLoaded', function() {
            const uid = localStorage.getItem('teachflow_uid');
            if (!uid) {
                window.location.href = 'index.html';
                return;
            }
            loadSchedule();

            if (window.innerWidth > 768) {
                const sidebar = document.getElementById('sidebar');
                sidebar.classList.remove('closed');
                sidebar.classList.remove('open');
            }

            // تحديث كل 30 ثانية
            setInterval(renderSchedule, 30000);
        });

        window.addEventListener('resize', function() {
            const sidebar = document.getElementById('sidebar');
            if (window.innerWidth > 768) {
                sidebar.classList.remove('closed');
                sidebar.classList.remove('open');
                document.getElementById('sidebarOverlay').classList.remove('active');
            } else {
                sidebar.classList.add('closed');
                sidebar.classList.remove('open');
            }
        });
    </script>
</body>
</html>
